<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d18">
<title>심연의 던전</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d18'/%3E%3Ccircle cx='32' cy='30' r='18' fill='%23ffb347' opacity='.35'/%3E%3Crect x='24' y='20' width='16' height='22' rx='4' fill='%23ffb347'/%3E%3Crect x='28' y='14' width='8' height='6' fill='%23ffe0a0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d18;--ink:#ece9f4;--mut:#9ea1c2;--p1:#161a2d;--p2:#1e2342;--p3:#2a3160;--line:#3a4275;--lamp:#ffb347;--lamp2:#ffe0a0;
--hp:#e5566d;--mp:#4f9dff;--xp:#8bd16f;--gold:#ffd24d;--ok:#7fd48f;--bad:#ff7b7b;
--r0:#cfd3e2;--r1:#72b9ff;--r2:#ffd54f;--r3:#c883ff;--r4:#ff8f45;
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
--serif:'Gowun Batang','Noto Serif KR','Batang',serif;
--sans:'Gowun Dodum','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;padding-top:var(--top);padding-bottom:var(--bot)}
.btn{appearance:none;-webkit-appearance:none;border:2px solid #080a15;border-radius:11px;padding:10px 16px;font-size:16px;font-weight:700;background:linear-gradient(#3b4382,#262c5b);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 #060811;color:#f2f0ff;min-height:44px;transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 0 #060811}
.btn.lamp{background:linear-gradient(#ffd27d,#f0952a);color:#2a1503;text-shadow:0 1px 0 rgba(255,255,255,.35);border-color:#4a2706;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 0 #3a1f05}
.btn.red{background:linear-gradient(#e86a7e,#b23049);border-color:#3a0814;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #2a050f}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn[disabled]{opacity:.42;filter:grayscale(.6);pointer-events:none}
.btn.sm{padding:6px 11px;font-size:14px;min-height:36px;border-radius:9px}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid #060811;background:linear-gradient(#1a1f3a,#12162c);flex:none}
.hdr h2{margin:0;font-family:var(--serif);font-size:20px;color:var(--lamp2);flex:1}
.body{flex:1;min-height:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.foot{flex:none;padding:10px 14px;border-top:2px solid #060811;background:linear-gradient(#141831,#0d1022);display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.mut{color:var(--mut)}
/* ---- 마을 ---- */
#s-town{align-items:center;text-align:center;overflow-y:auto;background:radial-gradient(900px 520px at 50% 16%,rgba(255,170,70,.20),transparent 62%),linear-gradient(#0d0f1e,#080a13)}
.hero{position:relative;width:100%;max-width:460px;height:min(36vh,290px);flex:none}
.hero svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.glow{animation:flick 3.2s ease-in-out infinite;transform-origin:center}
@keyframes flick{0%,100%{opacity:.85}18%{opacity:1}37%{opacity:.72}55%{opacity:.98}78%{opacity:.8}}
.ttl{font-family:var(--serif);font-weight:700;font-size:clamp(38px,10vw,54px);line-height:1.05;color:var(--lamp2);text-shadow:0 2px 0 #4a2706,0 0 30px rgba(255,170,70,.5);margin:0}
.sub{color:var(--mut);margin:6px 0 0;font-size:14px}
.tinfo{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 12px 0}
.menu{width:100%;max-width:360px;display:grid;gap:10px;padding:16px 16px 26px}
.menu .btn{width:100%;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.menu small{font-weight:400;opacity:.8;font-size:12px}
/* ---- 선택/목록 ---- */
.ccard{border:2px solid var(--line);border-radius:14px;padding:11px;background:linear-gradient(var(--p2),var(--p1));display:grid;grid-template-columns:56px 1fr;gap:11px;margin-bottom:10px;position:relative;cursor:pointer}
.ccard.sel{border-color:var(--lamp);box-shadow:0 0 0 2px rgba(255,179,71,.3),0 0 26px rgba(255,179,71,.18)}
.ccard.lock{filter:saturate(.55)}
.cico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:31px;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(0,0,0,.4));border:2px solid var(--cc,#888)}
.ccard h4{margin:0 0 3px;font-family:var(--serif);font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard p{margin:0 0 6px;font-size:13px;color:#c5c8e4;line-height:1.4}
.cst{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.cst span{font-size:12px;padding:2px 7px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid #2c3262}
.csk{font-size:12px;color:#aab0dc;line-height:1.5}
.daily{border:2px dashed var(--lamp);border-radius:14px;padding:11px;margin-bottom:12px;background:rgba(255,179,71,.07);font-size:13px;line-height:1.5}
.daily h4{margin:0 0 4px;font-family:var(--serif);font-size:17px;color:var(--lamp2)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.seg button{padding:7px 12px;border-radius:9px;border:2px solid var(--line);background:#12162c;font-weight:700;font-size:14px}
.seg button.on{border-color:var(--lamp);background:rgba(255,179,71,.16);color:var(--lamp2)}
.seg button[disabled]{opacity:.35}
.sect{font-family:var(--serif);font-size:16px;color:var(--lamp2);margin:14px 0 6px}
.urow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;margin-bottom:8px;border:2px solid var(--line);border-radius:12px;background:linear-gradient(var(--p2),var(--p1))}
.urow .ui{font-size:28px;text-align:center}
.urow b{display:block;font-size:15px}
.urow small{display:block;color:#b4b8da;font-size:12px;line-height:1.35}
.pips{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:3px;background:#0a0c1a;border:1px solid #3a4275}
.pips i.on{background:var(--lamp);border-color:#8a5410}
.urow.max{border-color:#6a5420}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dex{border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--p1);font-size:12px;line-height:1.3;cursor:pointer}
.dex .e{font-size:30px;display:block}
.dex.un{opacity:.45}
.dex.un .e{filter:brightness(0) opacity(.5)}
.arow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 10px;margin-bottom:7px;border:2px solid var(--line);border-radius:11px;background:var(--p1);font-size:13px}
.arow.done{border-color:#4d7a3e;background:rgba(95,160,70,.12)}
.arow b{display:block;font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px;padding:4px 2px}
.kv span:nth-child(odd){color:#b4b8da}
.kv span:nth-child(even){text-align:right;font-weight:700}
/* ---- 게임 ---- */
#s-game{background:#05060d}
#hud{display:flex;align-items:center;gap:7px;padding:5px 8px;background:linear-gradient(#1a1f3a,#10142a);border-bottom:2px solid #060811;flex:none;min-height:46px}
#hud .loc{flex:1;min-width:0;font-weight:700;line-height:1.15;font-size:15px}
#hud .loc small{display:block;color:var(--mut);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;padding:0;font-size:19px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:10px}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#05060d}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block}
#mini{position:absolute;right:6px;top:6px;border:1px solid rgba(255,255,255,.22);background:rgba(5,6,13,.62);border-radius:6px;pointer-events:none}
#toast{position:absolute;left:0;right:0;top:12%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.tst{font-family:var(--serif);font-weight:700;font-size:20px;padding:6px 16px;border-radius:12px;background:rgba(8,9,20,.78);border:1px solid rgba(255,179,71,.5);color:var(--lamp2);text-shadow:0 1px 0 #000;animation:tst 1.9s ease-out forwards}
@keyframes tst{0%{opacity:0;transform:translateY(8px) scale(.95)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#dpad{position:absolute;left:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;opacity:.85}
#dpad button{border:2px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(18,22,48,.7);font-size:18px;padding:0;color:#ece9f4;touch-action:none}
#dpad button:active{background:rgba(255,179,71,.45)}
#side{flex:none;background:linear-gradient(#141831,#0d1022);border-top:2px solid #060811;padding:7px 9px 8px;display:flex;flex-direction:column;gap:6px}
#prow{display:flex;align-items:center;gap:8px}
#pic{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(0,0,0,.4));border:2px solid var(--cc,#888);position:relative}
#pic em{position:absolute;right:-6px;bottom:-5px;font-style:normal;font-size:10px;font-weight:700;background:#0a0c1a;border:1px solid var(--lamp);color:var(--lamp2);border-radius:8px;padding:0 4px}
.bars{flex:1;display:grid;gap:3px}
.bar{position:relative;height:15px;border-radius:8px;background:#06070f;border:1px solid #2a2f58;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .18s}
.bar b{position:relative;display:block;text-align:center;font-size:11px;line-height:13px;text-shadow:0 1px 1px #000;font-weight:700}
.bar.thin{height:7px}
#bHp i{background:linear-gradient(#ff7b8e,#c93c55)}
#bMp i{background:linear-gradient(#7fbcff,#2f72d6)}
#bXp i{background:linear-gradient(#a6e58b,#5aa245)}
#stat{display:flex;gap:4px;flex-wrap:wrap;min-height:19px}
.sx{font-size:11px;padding:1px 7px;border-radius:8px;background:rgba(0,0,0,.4);border:1px solid #3a4275;font-weight:700}
#log{height:62px;overflow-y:auto;font-size:13px;line-height:1.36;color:#cfd2ea;background:rgba(0,0,0,.3);border-radius:8px;padding:4px 8px;-webkit-user-select:text;user-select:text}
#log div{padding:0}
.l-bad{color:#ff9b9b}.l-good{color:#9be6a8}.l-gold{color:#ffd24d}.l-info{color:#9ec3ff}.l-crit{color:#ffb347;font-weight:700}.l-mut{color:#8c90b4}
#acts{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ab{position:relative;padding:3px 0 2px;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;line-height:1.1;background:linear-gradient(#323a78,#222853);border:2px solid #080a15;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #060811;font-weight:700}
.ab:active{transform:translateY(2px);box-shadow:0 1px 0 #060811}
.ab .ic{font-size:21px;line-height:1.05}
.ab .n{position:absolute;right:2px;top:0;font-size:10px;background:#000a;border-radius:6px;padding:0 4px}
.ab .k{position:absolute;left:3px;top:1px;font-size:9px;opacity:.6;display:none}
.ab.dim{opacity:.42}
.ab.hot{background:linear-gradient(#ffd27d,#f0952a);color:#2a1503;border-color:#4a2706}
.ab.cd::after{content:attr(data-cd);position:absolute;top:0;right:0;bottom:0;left:0;border-radius:10px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:18px}
html.kb .ab .k{display:block}
#fade{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:60}
#fade.on{opacity:1}
@media (min-aspect-ratio:6/5) and (min-width:720px){
  #main{flex-direction:row}
  #side{width:min(380px,36vw);border-top:0;border-left:2px solid #060811;overflow-y:auto;gap:8px;padding:10px}
  #log{flex:1;min-height:110px;height:auto}
  #acts{grid-template-columns:repeat(4,1fr)}
  .ab{min-height:58px;font-size:12px}
}
/* ---- 시트 ---- */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,3,10,.74)}
.sheet{width:100%;max-width:580px;max-height:94%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;background:linear-gradient(#1c2145,#12162c);border:2px solid var(--line);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.6);padding-bottom:var(--bot);animation:rise .18s ease-out}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;border-bottom:2px solid var(--line);max-height:90%}}
@keyframes rise{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex:none}
.sh-h h3{margin:0;flex:1;font-family:var(--serif);font-size:19px;color:var(--lamp2)}
.sh-b{padding:4px 14px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.sh-f{display:flex;gap:8px;padding:8px 14px 12px;flex:none;flex-wrap:wrap}
.sh-f .btn{flex:1;min-width:110px}
.tabs{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;flex:none}
.tabs button{padding:6px 12px;border-radius:9px;border:2px solid var(--line);background:#12162c;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{border-color:var(--lamp);background:rgba(255,179,71,.16);color:var(--lamp2)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.islot{aspect-ratio:1;min-height:54px;border-radius:10px;border:2px solid var(--rc,#3a4275);background:#0a0c1a;display:flex;align-items:center;justify-content:center;font-size:27px;position:relative;cursor:pointer;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
.islot.sel{box-shadow:0 0 0 2px var(--lamp);}
.islot .n{position:absolute;right:2px;bottom:0;font-size:11px;font-weight:700;text-shadow:0 1px 1px #000}
.islot .up{position:absolute;left:2px;top:0;font-size:11px;color:#8dff9a;font-weight:700}
.islot.empty{opacity:.4;font-size:12px;color:var(--mut)}
.eqrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.eqrow .islot{aspect-ratio:auto;height:78px;flex-direction:column;font-size:30px;gap:2px}
.eqrow .islot small{font-size:11px;color:var(--mut)}
.idet{border:2px solid var(--rc,#3a4275);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.28);margin-top:10px}
.idet h4{margin:0 0 4px;font-family:var(--serif);font-size:17px;color:var(--rc,#fff)}
.idet .ln{font-size:13px;line-height:1.5}
.pos{color:#8dff9a}.neg{color:#ff8d8d}.dim{color:#8c90b4}
.perk{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:11px;margin-bottom:9px;border:2px solid var(--line);border-radius:13px;background:linear-gradient(var(--p3),var(--p2));font-size:14px}
.perk:hover{border-color:var(--lamp)}
.perk .pi{font-size:30px;text-align:center}
.perk b{display:block;font-size:16px;font-family:var(--serif)}
.perk small{color:#c0c4e6;font-size:13px;line-height:1.4}
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center;padding:8px;border:2px solid var(--rc,#3a4275);border-radius:11px;margin-bottom:7px;background:rgba(0,0,0,.25)}
.srow .si{font-size:26px;text-align:center}
.srow b{display:block;font-size:14px;color:var(--rc,#fff)}
.srow small{display:block;font-size:12px;color:#aab0d6;line-height:1.35}
.sumg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}
.sumg div{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mut)}
.sumg b{display:block;font-size:19px;color:var(--ink);font-family:var(--serif)}
.big{font-family:var(--serif);font-size:26px;text-align:center;margin:6px 0 2px;color:var(--lamp2)}
.cen{text-align:center}
textarea.code{width:100%;height:96px;border-radius:10px;border:2px solid var(--line);background:#080a15;color:#cfd2ea;font-size:12px;padding:8px;font-family:monospace;-webkit-user-select:text;user-select:text}
#gate{align-items:center;justify-content:center;text-align:center;padding:24px;z-index:80;background:#05060d}
#gate h2{font-family:var(--serif);color:var(--lamp2);font-size:26px;margin:0 0 8px}
#gate p{color:var(--mut);margin:0 0 18px}
</style>
</head>
<body>
<div id="gate" class="screen" hidden>
  <h2>🔒 입장이 필요해요</h2>
  <p>게임 모음(FLASH ZONE)에서 비밀번호를 입력한 뒤<br>이 게임을 열어주세요.</p>
  <button class="btn lamp" id="gateBtn">게임 모음으로 가기</button>
</div>

<div id="s-town" class="screen" hidden>
  <div class="hero">
    <svg viewBox="0 0 460 290" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <radialGradient id="hg1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".9"/><stop offset=".45" stop-color="#ff9d3a" stop-opacity=".35"/><stop offset="1" stop-color="#ff9d3a" stop-opacity="0"/></radialGradient>
        <linearGradient id="hg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3052"/><stop offset="1" stop-color="#151832"/></linearGradient>
        <linearGradient id="hg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060d"/><stop offset="1" stop-color="#1b1020"/></linearGradient>
      </defs>
      <rect width="460" height="290" fill="#0a0c18"/>
      <g class="glow"><circle cx="230" cy="190" r="170" fill="url(#hg1)"/></g>
      <path d="M96 290V150a134 134 0 0 1 268 0v140z" fill="url(#hg2)" stroke="#0a0c18" stroke-width="4"/>
      <path d="M126 290V156a104 104 0 0 1 208 0v134z" fill="url(#hg3)"/>
      <g fill="#0d1022" opacity=".55"><rect x="104" y="170" width="18" height="10"/><rect x="110" y="196" width="22" height="10"/><rect x="340" y="176" width="20" height="10"/><rect x="332" y="206" width="22" height="10"/><rect x="112" y="230" width="16" height="10"/><rect x="338" y="238" width="18" height="10"/></g>
      <g fill="#3a3658"><rect x="150" y="262" width="160" height="28"/></g>
      <g fill="#2c2948"><rect x="164" y="244" width="132" height="18"/></g>
      <g fill="#201e38"><rect x="180" y="228" width="100" height="16"/></g>

/* ================= 맵 헬퍼 ================= */
function inb(x,y){return x>=0&&y>=0&&x<G.map.w&&y<G.map.h;}
function tileAt(x,y){return inb(x,y)?G.map.t[y*G.map.w+x]:0;}
function isFloor(x,y){var t=tileAt(x,y);return t===1||t===2;}
function monAt(x,y){var a=G.mons;for(var i=0;i<a.length;i++){if(a[i].hp>0&&a[i].x===x&&a[i].y===y)return a[i];}return null;}
function propAt(x,y){var a=G.props;for(var i=0;i<a.length;i++){if(a[i].x===x&&a[i].y===y)return a[i];}return null;}
function itemAt(x,y){var a=G.items,r=[];for(var i=0;i<a.length;i++){if(a[i].x===x&&a[i].y===y)r.push(a[i]);}return r;}
function mutMul(key){var v=1;if(G&&G.mut){for(var i=0;i<G.mut.length;i++){var m=MUTS[G.mut[i]];if(m&&m[key])v*=m[key];}}return v;}

/* 대각 이동/공격: 두 모서리가 모두 벽이 아니어야 함 */
function adjOK(x,y,dx,dy){
  if(dx&&dy){if(!isFloor(x+dx,y)||!isFloor(x,y+dy))return false;}
  return true;
}
function canStep(x,y,dx,dy,phase){
  var nx=x+dx,ny=y+dy;if(!inb(nx,ny))return false;

  if(dx&&dy&&(!isFloor(x+dx,y)||!isFloor(x,y+dy)))return false;
  return true;
}
function los(x0,y0,x1,y1){
  var dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0,n=0;
  while(!(x===x1&&y===y1)&&n++<80){
    var e2=2*e;if(e2>-dy){e-=dy;x+=sx;}if(e2<dx){e+=dx;y+=sy;}
    if(x===x1&&y===y1)return true;
    if(tileAt(x,y)===0)return false;
  }
  return true;
}
function lineTiles(x0,y0,x1,y1,maxLen){
  var out=[],dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0,n=0;
  if(dx===0&&dy===0)return out;
  while(n++<maxLen){
    var e2=2*e;if(e2>-dy){e-=dy;x+=sx;}if(e2<dx){e+=dx;y+=sy;}
    if(!inb(x,y)||tileAt(x,y)===0)break;
    out.push([x,y]);
  }

}
function bfsDist(t,W,H,sx,sy){
  var d=new Int16Array(W*H).fill(-1),q=[sx+sy*W],h=0;d[sx+sy*W]=0;
  while(h<q.length){var c=q[h++],cx=c%W,cy=(c/W)|0,dd=d[c];
    var nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<4;i++){var nx=cx+nb[i][0],ny=cy+nb[i][1];if(nx<0||ny<0||nx>=W||ny>=H)continue;var ni=nx+ny*W;if(d[ni]!==-1||t[ni]===0)continue;d[ni]=dd+1;q.push(ni);}
  }
  return d;
}

var AFFD={};AFF.forEach(function(a){AFFD[a.k]=a;});

  var lk=1+(luck||0)/100;

function makeItem(rng,ilvl,kind,rar,baseKey){

    U.x.forEach(function(a){it.ex.push([a[0],a[1]]);});

function itemStats(it){

function itemScore(it){if(!it)return 0;var s=itemStats(it),t=0;for(var k in s)t+=(SCORE_W[k]||.3)*s[k];return t;}

function pickMonKey(rng,depth){

function bossKeyFor(depth){return BOSS_ORDER[(Math.floor(depth/5)-1)%BOSS_ORDER.length];}
function mkMon(rng,key,x,y,o){

/* ================= 층 생성 ================= */
function genRooms(rng,t,W,H){
  var rooms=[];
  for(var i=0;i<90&&rooms.length<15;i++){
    var w=rng.int(5,11),h=rng.int(4,8),x=rng.int(1,W-w-2),y=rng.int(1,H-h-2),ok=true;
    for(var j=0;j<rooms.length;j++){var r=rooms[j];if(x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y){ok=false;break;}}
    if(!ok)continue;
    rooms.push({x:x,y:y,w:w,h:h,cx:x+(w>>1),cy:y+(h>>1)});
    for(var yy=y;yy<y+h;yy++)for(var xx=x;xx<x+w;xx++)t[yy*W+xx]=1;
  }
  function hl(y,x1,x2){for(var x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)t[y*W+x]=1;}
  function vl(x,y1,y2){for(var y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)t[y*W+x]=1;}
  function link(a,b){if(rng.chance(.5)){hl(a.cy,a.cx,b.cx);vl(b.cx,a.cy,b.cy);}else{vl(a.cx,a.cy,b.cy);hl(b.cy,a.cx,b.cx);}}
  var sorted=rooms.slice().sort(function(a,b){return a.cx-b.cx;});
  for(var k=0;k<sorted.length-1;k++)link(sorted[k],sorted[k+1]);
  for(var e=0;e<3&&rooms.length>3;e++){link(rng.pick(rooms),rng.pick(rooms));}
  /* 기둥 */
  rooms.forEach(function(r){if(r.w>=8&&r.h>=6&&rng.chance(.45)){
    var px=r.x+2+rng.int(0,r.w-5),py=r.y+2+rng.int(0,r.h-5);
    if(px!==r.cx||py!==r.cy){t[py*W+px]=0;}}});
  return rooms;
}
function genCave(rng,t,W,H){
  var a=new Uint8Array(W*H),x,y,i;
  for(y=0;y<H;y++)for(x=0;x<W;x++){a[y*W+x]=(x===0||y===0||x===W-1||y===H-1)?1:(rng.chance(.46)?1:0);}
  for(var it=0;it<4;it++){
    var b=new Uint8Array(a);
    for(y=1;y<H-1;y++)for(x=1;x<W-1;x++){
      var n=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(dx||dy)n+=a[(y+dy)*W+x+dx];}
      b[y*W+x]=n>=5?1:(n<=3?0:a[y*W+x]);
    }
    a=b;
  }
  var lab=new Int16Array(W*H).fill(-1),best=-1,bestN=0,cur=0;
  for(i=0;i<W*H;i++){
    if(a[i]||lab[i]!==-1)continue;
    var q=[i],h=0;lab[i]=cur;
    while(h<q.length){var c=q[h++],cx=c%W,cy=(c/W)|0;
      var nb=[[1,0],[-1,0],[0,1],[0,-1]];
      for(var k=0;k<4;k++){var nx=cx+nb[k][0],ny=cy+nb[k][1],ni=nx+ny*W;if(nx<0||ny<0||nx>=W||ny>=H||a[ni]||lab[ni]!==-1)continue;lab[ni]=cur;q.push(ni);}
    }
    if(q.length>bestN){bestN=q.length;best=cur;}cur++;
  }
  if(bestN<W*H*.3)return false;
  for(i=0;i<W*H;i++)t[i]=(lab[i]===best)?1:0;
  return true;
}
function genArena(rng,t,W,H){
  for(var y=3;y<H-3;y++)for(var x=3;x<W-3;x++)t[y*W+x]=1;
  var px=[[11,7],[11,H-9],[21,7],[21,H-9],[16,H>>1]];
  px.forEach(function(p){for(var dy=0;dy<2;dy++)for(var dx=0;dx<2;dx++)t[(p[1]+dy)*W+p[0]+dx]=0;});
}
function buildFloor(depth){
  var rng=new RNG(hashStr(G.seed+':f'+depth)),bi=biomeIdx(depth),B=BIOMES[bi],boss=(depth%5===0);
  var W=boss?33:46,H=boss?25:32,t=new Uint8Array(W*H),rooms=[],ok=false;
  if(boss){genArena(rng,t,W,H);}
  else{if(B.gen==='cave')ok=genCave(rng,t,W,H);if(!ok){t.fill(0);rooms=genRooms(rng,t,W,H);}}
  var floors=[],i;for(i=0;i<W*H;i++)if(t[i]===1)floors.push(i);
  var sx,sy,ex,ey;
  if(boss){sx=4;sy=H>>1;ex=W-5;ey=H>>1;}
  else{
    var sp=rooms.length?rng.pick(rooms):null;
    if(sp){sx=sp.cx;sy=sp.cy;if(t[sy*W+sx]!==1){var f0=floors[0];sx=f0%W;sy=(f0/W)|0;}}
    else{var f1=rng.pick(floors);sx=f1%W;sy=(f1/W)|0;}
    var dd=bfsDist(t,W,H,sx,sy),mx=0,far=[];
    for(i=0;i<floors.length;i++){var v=dd[floors[i]];if(v>mx){mx=v;}}
    for(i=0;i<floors.length;i++){if(dd[floors[i]]>=mx*.92)far.push(floors[i]);}
    var fi=rng.pick(far);ex=fi%W;ey=(fi/W)|0;
  }
  G.map={w:W,h:H,t:t,seen:new Uint8Array(W*H),vis:new Uint8Array(W*H),bi:bi};
  G.stairs={x:ex,y:ey};
  if(!boss)t[ey*W+ex]=2;
  G.mons=[];G.items=[];G.props=[];G.traps={};G.flags={bossDead:!boss,curse:0,lastUsed:false,angelUsed:false,boss:boss};
  G.p.x=sx;G.p.y=sy;G.p.vx=sx;G.p.vy=sy;
  var taken={};taken[sx+sy*W]=1;taken[ex+ey*W]=1;
  var order=rng.shuffle(floors.slice());
  function free(minD,ex2){
    for(var q=0;q<order.length;q++){var c=order[q];if(taken[c])continue;var cx=c%W,cy=(c/W)|0;
      if(cheb(cx,cy,sx,sy)<minD)continue;
      if(ex2&&!ex2(cx,cy))continue;
      taken[c]=1;return {x:cx,y:cy};}
    return null;
  }
  function open8(x,y){for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;if(t[(y+dy)*W+x+dx]===0)return false;}return true;}
  var mc=mutMul('mc'),dp=mutMul('dp');
  /* 몬스터 */
  var el=Math.min(.4,.02+depth*.01),n=Math.min(26,Math.floor((6+depth*.45+rng.int(0,3))*mc));
  if(boss){
    var bk=bossKeyFor(depth);
    G.mons.push(mkMon(rng,bk,W-9,H>>1,{sleep:true}));taken[(W-9)+(H>>1)*W]=1;
    n=4;
  }
  for(i=0;i<n;i++){var pos=free(boss?9:7);if(!pos)break;
    var k=pickMonKey(rng,depth),isEl=rng.chance(el);
    G.mons.push(mkMon(rng,k,pos.x,pos.y,{sleep:rng.chance(.62),elite:isEl}));}
  /* 아이템 */
  var ni=rng.int(3,5);
  for(i=0;i<ni;i++){var p2=free(2);if(!p2)break;
    var r=rng.next();
    if(r<.52*(dp>1?.8:1)){
      var ck=rng.wpick(CONS_ORDER,function(c){return {hp:6,mp:4,cure:2,tele:1.6,map:1.4,fire:1.4,enh:1.2,fear:1.2,bomb:1.6}[c]*(dp>1&&(c==='hp'||c==='mp')?2:1);});
      G.items.push({x:p2.x,y:p2.y,c:ck,n:1});
    }else{G.items.push({x:p2.x,y:p2.y,it:randomEquip(rng,depth,0)});}
  }
  var ng=rng.int(3,5);
  for(i=0;i<ng;i++){var p3=free(1);if(!p3)break;G.items.push({x:p3.x,y:p3.y,g:Math.round((5+depth*3.2)*(.7+.6*rng.next()))});}
  if(boss){for(i=0;i<2;i++){var pp=free(1,function(x,y){return cheb(x,y,sx,sy)<=5;});if(pp)G.items.push({x:pp.x,y:pp.y,c:i?'mp':'hp',n:1});}}
  /* 상자 */
  var nc=boss?0:rng.int(1,2)+(depth>=6&&rng.chance(.4)?1:0);
  for(i=0;i<nc;i++){var p4=free(4,open8);if(!p4)continue;G.props.push({t:'chest',x:p4.x,y:p4.y,open:false,mimic:depth>=2&&rng.chance(.12)});}
  /* 제단 */
  if(!boss&&rng.chance(.38)){var p5=free(5,open8);if(p5)G.props.push({t:'shrine',x:p5.x,y:p5.y,kind:rng.pick(['heal','heal','blood','gamble','curse']),used:false});}
  /* 상인 */
  if(!boss&&depth>=2&&rng.chance(.34)){var p6=free(4,open8);if(p6)G.props.push({t:'merch',x:p6.x,y:p6.y,stock:shopStock(rng,depth)});}

    for(i=0;i<nt;i++){var p7=free(3);if(!p7)break;
      G.traps[p7.x+p7.y*W]={t:rng.pick(['spike','spike','gas','tele','alarm','fire']),rev:false};}}

}

function recalc(keep){
  var p=G.p,C=CLASSES[G.cls],s={},k,oldHp=ST?ST.maxHp:0,oldMp=ST?ST.maxMp:0;
  ['w','a','c'].forEach(function(sl){var it=p.eq[sl];if(it)addStats(s,itemStats(it),1);});
  for(k in p.perks){if(PERK[k])addStats(s,PERK[k].m,p.perks[k]);}
  p.relics.forEach(function(id){if(REL[id])addStats(s,REL[id].m,1);});
  UPG.forEach(function(u){var lv=S.up[u.id]||0;if(lv&&u.m)addStats(s,u.m,lv);});
  if(C.ex)addStats(s,C.ex,1);
  if(G.mut)G.mut.forEach(function(id){addStats(s,MUTS[id].pm,1);});
  var L=p.lv,st={};
  st.maxHp=Math.max(12,Math.round((C.hp+C.gHp*(L-1)+(s.hp||0))*(1+(s.hpp||0)/100)));
  st.maxMp=Math.max(0,Math.round(C.mp+C.gMp*(L-1)+(s.mp||0)));
  st.atk=(C.atk+C.gAtk*(L-1)+(s.atk||0))*(1+(s.atkp||0)/100);
  st.def=C.def+C.gDef*(L-1)+(s.def||0);
  st.crit=clamp(C.crit+(s.crit||0),0,80);
  st.critd=150+(s.critd||0);
  st.dodge=clamp(s.dodge||0,0,60);
  st.ls=s.ls||0;
  st.light=clamp(Math.round(C.light+(s.light||0)+Math.floor((S.up.light||0)/3)),3,14);
  st.mpr=C.mpr+(s.mpr||0);
  st.regen=s.regen||0;
  st.goldp=s.goldp||0;st.xpp=s.xpp||0;st.luck=s.luck||0;st.thorn=s.thorn||0;
  st.skill=s.skill||0;st.mpc=clamp(s.mpc||0,0,60);st.pot=s.pot||0;
  st.burn=clamp(s.burn||0,0,80);st.poison=clamp(s.poison||0,0,80);st.slow=clamp(s.slow||0,0,80);
  st.chain=clamp(s.chain||0,0,70);st.exec=s.exec||0;st.dmgr=clamp(s.dmgr||0,0,60);
  st.detect=s.detect||0;st.revive=s.revive||0;st.reap=s.reap||0;st.mapf=s.mapf||0;st.angel=s.angel||0;st.insta=s.insta||0;st.last=s.last||0;
  st.heal=G.cls==='cleric'?1.25:1;
  ST=st;
  if(keep){if(st.maxHp>oldHp)p.hp+=st.maxHp-oldHp;if(st.maxMp>oldMp)p.mp+=st.maxMp-oldMp;}
  p.hp=Math.min(p.hp,st.maxHp);p.mp=Math.min(p.mp,st.maxMp);
}
function curAtk(){var p=G.p,a=ST.atk;if(p.bf.rage>0)a*=1.45;if(p.bf.venom>0)a*=1.15;if(G.cls==='berserk')a*=1+.6*(1-p.hp/ST.maxHp);return a;}
function curLs(){return ST.ls+(G.p.bf.rage>0?20:0);}
function defK(){return 25+G.depth*2;}
function plrDefRed(){return defK()/(defK()+ST.def);}
function monDefRed(m){return defK()/(defK()+m.def);}
function xpNeed(L){return Math.round(18+14*(L-1)+XPQ*(L-1)*(L-1));}
function skillCost(sk){return sk.mp?Math.max(1,Math.ceil(sk.mp*(1-ST.mpc/100))):0;}

/* ================= 경험치 / 레벨 ================= */
function gainXp(n){
  var p=G.p,g=0;p.xp+=n;
  while(p.xp>=xpNeed(p.lv)&&g++<60){
    p.xp-=xpNeed(p.lv);p.lv++;G.pend.lv++;S.st.maxLv=Math.max(S.st.maxLv,p.lv);
    recalc(true);
    healPlayer(ST.maxHp*.2,true);p.mp=Math.min(ST.maxMp,p.mp+ST.maxMp*.3);
    log('★ 레벨 업! Lv.'+p.lv,'crit');SFX('lvl');UI.toast&&UI.toast('레벨 업!  Lv.'+p.lv);
    FX.ring(p.x,p.y,'#ffe08a');
  }
}
function addGold(n){var g=Math.max(1,Math.round(n*(1+ST.goldp/100)*mutMul('mg')));G.p.gold+=g;G.stats.gold+=g;S.st.gold+=g;return g;}

/* ================= 플레이어 피해/회복 ================= */
function healPlayer(n,quiet){
  var p=G.p;n=Math.round(n);if(n<=0)return 0;
  var real=Math.min(n,ST.maxHp-p.hp);if(real<=0)return 0;
  p.hp+=real;if(!quiet)FX.text(p.x,p.y,'+'+real,'#7fd48f');
  return real;
}
function hurtPlayer(dmg,src,o){
  o=o||{};var p=G.p;
  dmg=Math.max(1,Math.round(dmg));
  if(!o.pure){
    if(ST.angel&&!G.flags.angelUsed){G.flags.angelUsed=true;log('😇 수호천사가 공격을 막아냈다!','good');FX.text(p.x,p.y,'무효','#ffe08a',true);return 0;}
    dmg=Math.max(1,Math.round(dmg*(1-ST.dmgr/100)));
  }
  p.hp-=dmg;
  FX.text(p.x,p.y,'-'+dmg,'#ff6b7e',dmg>ST.maxHp*.15);FX.shake(Math.min(10,3+dmg/ST.maxHp*30));FX.hurt();SFX('hurt');
  if(UI.vib)UI.vib(dmg>ST.maxHp*.2?60:25);
  if(p.hp<=0){
    if(ST.last&&!G.flags.lastUsed){G.flags.lastUsed=true;p.hp=1;log('🔥 마지막 저항! 간신히 버텼다','crit');}
    else if(p.revLeft>0){
      p.revLeft--;
      var pct=Math.max(p.revPct||.3,ST.revive?.6:0);
      p.hp=Math.max(1,Math.round(ST.maxHp*pct));p.st={};
      log('🕊️ 쓰러졌지만 다시 일어났다! (HP '+Math.round(pct*100)+'%)','crit');FX.ring(p.x,p.y,'#fff6d6');FX.shake(8);SFX('lvl');
      G.mons.forEach(function(m){if(m.hp>0&&cheb(m.x,m.y,p.x,p.y)<=2)m.st.stun=2;});
    }else{p.hp=0;playerDie(src);}
  }
  return dmg;
}

/* ================= 몬스터 피해 / 처치 ================= */
function calcPlayerDmg(m,mult,o){
  o=o||{};
  var a=curAtk()*mult*(.9+.2*R.next());
  var crit=!!o.crit||R.next()*100<ST.crit+(o.critAdd||0)||(o.sneak&&G.cls==='rogue'&&m.sl);
  if(crit)a*=ST.critd/100;
  if(m.hp<=m.mhp*.3&&ST.exec)a*=1+ST.exec/100;
  a*=monDefRed(m);
  if(o.und&&MON[m.k].und)a*=2;
  return {d:Math.max(1,Math.round(a)),c:crit};
}
function wakeNear(m){G.mons.forEach(function(o){if(o.sl&&o.hp>0&&cheb(o.x,o.y,m.x,m.y)<=3&&R.next()<.5)o.sl=false;});}
function noise(r){var p=G.p;G.mons.forEach(function(m){if(m.sl&&m.hp>0&&cheb(m.x,m.y,p.x,p.y)<=r&&R.next()<.45)m.sl=false;});}
function hurtMon(m,dmg,crit,o){
  o=o||{};if(m.hp<=0)return 0;
  dmg=Math.max(1,Math.round(dmg));m.hp-=dmg;
  if(m.sl){m.sl=false;wakeNear(m);}
  FX.text(m.x,m.y,(crit?'!':'')+dmg,o.color||(crit?'#ffb347':'#ffffff'),crit);FX.hit(m);
  if(!o.nols&&!o.status){var ls=curLs();if(ls>0)healPlayer(dmg*ls/100,true);}
  if(m.hp<=0){killMon(m);return dmg;}
  if(ST.insta&&!MON[m.k].boss&&!o.status&&m.hp<m.mhp*ST.insta/100){FX.text(m.x,m.y,'처형!','#ff4d4d',true);m.hp=0;killMon(m);return dmg;}
  return dmg;
}
function dropPos(x,y){
  if(isFloor(x,y))return {x:x,y:y};
  for(var r=1;r<=2;r++)for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++){if(isFloor(x+dx,y+dy))return {x:x+dx,y:y+dy};}
  return {x:G.p.x,y:G.p.y};
}
function freeNear(x,y,r){
  var c=[];
  for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++){
    var nx=x+dx,ny=y+dy;if(!dx&&!dy)continue;if(!isFloor(nx,ny))continue;
    if(monAt(nx,ny)||(nx===G.p.x&&ny===G.p.y))continue;var pr=propAt(nx,ny);if(pr&&blocksMove(pr))continue;
    c.push({x:nx,y:ny});
  }
  return c.length?c[Math.floor(R.next()*c.length)]:null;
}
function killMon(m){
  var d=MON[m.k],p=G.p;
  m.hp=0;G.stats.kills++;S.st.kills++;
  var dx=S.dex.mon[m.k]||(S.dex.mon[m.k]={seen:1,kills:0});dx.kills=(dx.kills||0)+1;
  var xp=Math.round(m.xp*(1+ST.xpp/100));
  log(m.nm+jo(m.nm,'을','를')+' 쓰러뜨렸다  (+'+xp+' XP)','mut');
  FX.burst(m.x,m.y,m.el>=0||d.boss?'#ffd24d':'#cfd3e2');SFX('kill');
  if(G.tgt===m.id)G.tgt=0;
  if(ST.reap)healPlayer(ST.maxHp*ST.reap/100,false);
  if(d.split&&!m.small){for(var i=0;i<2;i++){var pos=freeNear(m.x,m.y,1);if(pos){var s=mkMon(R,m.k,pos.x,pos.y,{small:true,sleep:false});G.mons.push(s);}}log('슬라임이 둘로 갈라졌다!','mut');}
  if(d.explode&&cheb(m.x,m.y,p.x,p.y)<=1){log(m.nm+jo(m.nm,'이','가')+' 폭발했다!','bad');FX.ring(m.x,m.y,'#ff8a3a');hurtPlayer(m.atk*1.3*plrDefRed(),m.nm);if(!G.over)mStatusOnPlayer('burn',m);}
  if(d.boss)onBossKilled(m);else dropLoot(m);
  gainXp(xp);
}
function dropLoot(m){
  var dep=G.depth,pos=dropPos(m.x,m.y),el=m.el>=0,dp=mutMul('dp');
  if(R.next()<(el?.9:.5)){G.items.push({x:pos.x,y:pos.y,g:Math.round((4+dep*2.6)*(.6+.8*R.next())*(el?2.4:1))});}
  if(R.next()<(el?.5:.085*dp)){
    var c=R.next()<.62?'hp':(R.next()<.6?'mp':R.pick(['cure','tele','fire','bomb','fear','map','enh']));
    G.items.push({x:pos.x,y:pos.y,c:c,n:1});
  }
  if(el||R.next()<.05*(1+ST.luck/150)){G.items.push({x:pos.x,y:pos.y,it:randomEquip(R,dep,ST.luck+(el?40:0),el?1:0)});}
}

/* ================= 상태 이상 ================= */
function applyMonStatus(m,type,t,d){
  if(m.hp<=0)return;var boss=MON[m.k].boss;
  if(boss&&type==='stun')return;
  if(boss&&type==='slow')t=Math.min(t,2);
  if(type==='poison'||type==='burn'){var cur=m.st[type];m.st[type]={t:Math.max(t,cur?cur.t:0),d:Math.max(d||1,cur?cur.d:0)};}
  else{m.st[type]=Math.max(m.st[type]||0,t);}
}
function procHit(m){
  if(m.hp<=0)return;
  var a=curAtk(),pd=Math.max(1,Math.round(a*.22)),bd=Math.max(1,Math.round(a*.3));
  if(G.p.bf.venom>0||R.next()*100<ST.poison)applyMonStatus(m,'poison',4,pd);
  if(R.next()*100<ST.burn)applyMonStatus(m,'burn',3,bd);
  if(R.next()*100<ST.slow)applyMonStatus(m,'slow',3);
  if(ST.chain&&R.next()*100<ST.chain)chainLightning(m);
}
function chainLightning(from){
  var best=null,bd=99;
  G.mons.forEach(function(o){if(o.hp<=0||o===from||!isVisMon(o))return;var d=cheb(o.x,o.y,from.x,from.y);if(d<=4&&d<bd){bd=d;best=o;}});
  if(!best)return;
  FX.line(from.x,from.y,best.x,best.y,'#ffe86a');
  var r=calcPlayerDmg(best,.8,{});hurtMon(best,r.d,false,{nols:true,color:'#ffe86a'});
}
function mStatusOnPlayer(k,m){
  if(k==='poison')addPStatus('poison',4,Math.max(1,Math.round(m.atk*.2)));
  else if(k==='burn')addPStatus('burn',3,Math.max(1,Math.round(m.atk*.28)));
  else if(k==='slow')addPStatus('slow',3,0);
}
function addPStatus(type,t,d){
  var p=G.p;
  if(type==='slow'){p.st.slow=Math.max(p.st.slow||0,t);return;}
  var cur=p.st[type];p.st[type]={t:Math.max(t,cur?cur.t:0),d:Math.max(d,cur?cur.d:0)};
}
function plrStatusTick(){
  var p=G.p;
  ['poison','burn'].forEach(function(k){
    var s=p.st[k];if(!s||G.over)return;
    hurtPlayer(s.d,k==='poison'?'독':'화상',{pure:true});
    s.t--;if(s.t<=0)delete p.st[k];
  });
  if(p.st.slow>0){p.st.slow--;if(p.st.slow<=0)delete p.st.slow;}
}
function monStatusTick(m){
  var s=m.st;
  ['poison','burn'].forEach(function(k){
    var e=s[k];if(!e||m.hp<=0)return;
    hurtMon(m,e.d,false,{status:true,nols:true,color:k==='poison'?'#7fe06a':'#ff9a4a'});
    if(m.hp>0){e.t--;if(e.t<=0)delete s[k];}
  });
  if(m.hp>0&&s.slow>0){s.slow--;if(s.slow<=0)delete s.slow;}
}

/* ================= 시야 / 거리 ================= */
function computeFOV(){
  var m=G.map,W=m.w,p=G.p,Rr=ST.light,vis=m.vis,seen=m.seen;
  vis.fill(0);
  for(var dy=-Rr;dy<=Rr;dy++)for(var dx=-Rr;dx<=Rr;dx++){
    if(dx*dx+dy*dy>Rr*Rr+Rr)continue;
    var tx=p.x+dx,ty=p.y+dy;if(!inb(tx,ty))continue;
    if(los(p.x,p.y,tx,ty)){var i=ty*W+tx;vis[i]=1;seen[i]=1;}
  }
}
function revealAll(){var m=G.map;m.seen.fill(1);}
function computeDist(){
  var m=G.map,W=m.w,H=m.h,p=G.p;
  if(!DIST||DIST.length!==W*H)DIST=new Int16Array(W*H);
  DIST.fill(-1);
  var q=[p.y*W+p.x],h=0;DIST[q[0]]=0;
  while(h<q.length){
    var c=q[h++],cx=c%W,cy=(c/W)|0,dd=DIST[c];
    if(dd>=40)continue;
    for(var i=0;i<8;i++){
      var dx=DIRS8[i][0],dy=DIRS8[i][1];
      if(!canStep(cx,cy,dx,dy,false))continue;
      var ni=(cy+dy)*W+cx+dx;if(DIST[ni]!==-1)continue;DIST[ni]=dd+1;q.push(ni);
    }
  }
}
function updateDex(){
  var p=G.p;
  G.mons.forEach(function(m){if(m.hp>0&&isVisMon(m)&&!S.dex.mon[m.k])S.dex.mon[m.k]={seen:1,kills:0};});
}

/* ================= 몬스터 AI ================= */
function monTurn(m){
  if(m.hp<=0||G.over)return;
  var d=MON[m.k];
  m.en+=m.spd*(m.st.slow>0?.5:1);
  var g=0;
  while(m.en>=1&&m.hp>0&&!G.over&&g++<3){m.en-=1;monAct(m,d);}
  if(m.hp>0&&!G.over)monStatusTick(m);
}
function tryWake(m,d){
  var p=G.p,dist=cheb(m.x,m.y,p.x,p.y),vis=isVisMon(m);
  if(d.boss){if(vis&&dist<=7){m.sl=false;log('⚠ '+m.nm+jo(m.nm,'이','가')+' 눈을 떴다!','bad');SFX('boss');FX.shake(6);}return;}
  if(dist>ST.light+2)return;
  if(!vis&&dist>2)return;
  var ch=dist<=1?.9:(dist<=3?.35:.12);if(G.cls==='rogue')ch*=.5;
  if(R.next()<ch){m.sl=false;if(vis)log(m.nm+jo(m.nm,'이','가')+' 깨어났다!','bad');wakeNear(m);}
}
function mOccupied(nx,ny){var p=G.p;if(nx===p.x&&ny===p.y)return true;if(monAt(nx,ny))return true;var pr=propAt(nx,ny);return !!(pr&&blocksMove(pr));}
function randomStep(m,d){
  var c=[];
  for(var i=0;i<8;i++){var dx=DIRS8[i][0],dy=DIRS8[i][1];if(!canStep(m.x,m.y,dx,dy,!!d.phase))continue;if(mOccupied(m.x+dx,m.y+dy))continue;c.push([dx,dy]);}
  if(c.length){var e=c[Math.floor(R.next()*c.length)];m.x+=e[0];m.y+=e[1];return true;}
  return false;
}
function stepAway(m,d){
  var p=G.p,bs=cheb(m.x,m.y,p.x,p.y),best=null;
  for(var i=0;i<8;i++){
    var dx=DIRS8[i][0],dy=DIRS8[i][1];if(!canStep(m.x,m.y,dx,dy,!!d.phase))continue;
    var nx=m.x+dx,ny=m.y+dy;if(mOccupied(nx,ny))continue;
    var nd=cheb(nx,ny,p.x,p.y);if(nd>bs){bs=nd;best=[dx,dy];}
  }
  if(best){m.x+=best[0];m.y+=best[1];return true;}
  return false;
}
function chase(m,d){
  var p=G.p,W=G.map.w,i,dx,dy,nx,ny;
  if(d.phase){
    var sx=sgn(p.x-m.x),sy=sgn(p.y-m.y),opts=[[sx,sy],[sx,0],[0,sy]];
    for(i=0;i<opts.length;i++){dx=opts[i][0];dy=opts[i][1];if(!dx&&!dy)continue;nx=m.x+dx;ny=m.y+dy;
      if(!canStep(m.x,m.y,dx,dy,true))continue;if(monAt(nx,ny)||(nx===p.x&&ny===p.y))continue;m.x=nx;m.y=ny;return;}
    return;
  }
  var cur=DIST[m.y*W+m.x];
  if(cur<0){randomStep(m,d);return;}
  var bd=cur,best=null,eq=[];
  for(i=0;i<8;i++){
    dx=DIRS8[i][0];dy=DIRS8[i][1];
    if(!canStep(m.x,m.y,dx,dy,false))continue;
    nx=m.x+dx;ny=m.y+dy;if(mOccupied(nx,ny))continue;
    var dd=DIST[ny*W+nx];if(dd<0)continue;
    if(dd<bd){bd=dd;best=[dx,dy];eq=[];}
    else if(dd===cur&&!best)eq.push([dx,dy]);
  }
  if(best){m.x+=best[0];m.y+=best[1];return;}
  if(eq.length&&R.next()<.5){var e=eq[Math.floor(R.next()*eq.length)];m.x+=e[0];m.y+=e[1];}
}
function mStatusFlee(m,d){
  var p=G.p,dist=cheb(m.x,m.y,p.x,p.y);
  if(stepAway(m,d))return;
  if(dist<=1&&(d.phase||adjOK(m.x,m.y,p.x-m.x,p.y-m.y)))monAttack(m,1);
}
function monAct(m,d){
  var p=G.p;
  if(m.st.stun>0){m.st.stun--;return;}
  if(m.sl){tryWake(m,d);return;}
  if(m.tele){resolveTele(m);return;}
  var dist=cheb(m.x,m.y,p.x,p.y);
  if(m.st.fear>0){m.st.fear--;mStatusFlee(m,d);return;}
  if(d.abil&&monAbilities(m,d,dist))return;
  if(d.erratic&&R.next()<.4){randomStep(m,d);return;}
  var adj=dist===1&&(d.phase||adjOK(m.x,m.y,p.x-m.x,p.y-m.y));
  if(d.kite&&dist<=2&&!m.kt){if(stepAway(m,d)){m.kt=1;return;}}
  m.kt=0;
  if(adj){monAttack(m,1);return;}
  if(d.rng&&dist<=d.rng&&los(m.x,m.y,p.x,p.y)){FX.shoot(m.x,m.y,p.x,p.y,'#ff9d6a');monAttack(m,.9,{ranged:true});return;}
  chase(m,d);
}
function monAttack(m,mult,o){
  o=o||{};var p=G.p;sprAtk('m'+m.id,m,p);
  if(!o.aoe&&R.next()*100<ST.dodge){log(m.nm+jo(m.nm,'의','의')+' 공격을 피했다!','info');FX.text(p.x,p.y,'회피','#9ec3ff');return;}
  var a=m.atk*(m.enr||1)*mult*(.9+.2*R.next())*plrDefRed();
  var dealt=hurtPlayer(a,m.nm,{ranged:o.ranged});
  if(dealt>0){
    log(m.nm+jo(m.nm,'이','가')+' '+dealt+' 피해를 입혔다','bad');
    if(m.drain&&m.hp>0)m.hp=Math.min(m.mhp,m.hp+Math.round(dealt*.5));
    if(m.hit&&!G.over){for(var k in m.hit){if(R.next()<m.hit[k])mStatusOnPlayer(k,m);}}
    if(o.st&&!G.over)mStatusOnPlayer(o.st,m);
    if(ST.thorn&&!o.ranged&&m.hp>0){hurtMon(m,Math.max(1,Math.round(dealt*ST.thorn/100)),false,{nols:true,color:'#c9a0ff'});}
  }
}
function countMinions(m){var n=0;G.mons.forEach(function(o){if(o.hp>0&&o.owner===m.id)n++;});return n;}
function monAbilities(m,d,dist){
  var p=G.p;
  for(var i=0;i<d.abil.length;i++){
    var a=d.abil[i];
    if(a.t==='enrage'){if(!m.enr&&m.hp<=m.mhp*a.at){m.enr=a.m;log('🔥 '+m.nm+jo(m.nm,'이','가')+' 분노했다!','bad');FX.shake(7);FX.ring(m.x,m.y,'#ff4d4d');}continue;}
    if(m.cd[i]>0){m.cd[i]--;continue;}
    if(a.t==='summon'){
      if(countMinions(m)>=a.cap)continue;
      var sp=0;
      for(var s=0;s<a.n;s++){var pos=freeNear(m.x,m.y,2);if(!pos)break;var mm=mkMon(R,a.ids[Math.floor(R.next()*a.ids.length)],pos.x,pos.y,{sleep:false});mm.owner=m.id;G.mons.push(mm);sp++;}
      if(sp){log(m.nm+jo(m.nm,'이','가')+' 부하를 불러냈다!','bad');FX.ring(m.x,m.y,'#c883ff');m.cd[i]=a.ev;return true;}
      continue;
    }
    if(a.t==='shoot'){
      if(dist>=2&&dist<=a.r&&los(m.x,m.y,p.x,p.y)){FX.shoot(m.x,m.y,p.x,p.y,'#ff9d6a');monAttack(m,a.m,{ranged:true,st:a.st});m.cd[i]=a.ev;return true;}
      continue;
    }
    if(a.t==='slam'){
      if(dist<=a.r+1){
        var tl=[];for(var dy=-a.r;dy<=a.r;dy++)for(var dx=-a.r;dx<=a.r;dx++){if(isFloor(m.x+dx,m.y+dy))tl.push([m.x+dx,m.y+dy]);}
        m.tele={tiles:tl,mult:a.m,st:a.st};m.cd[i]=a.ev;
        log('⚠ '+m.nm+jo(m.nm,'이','가')+' 강력한 일격을 준비한다! 붉은 칸에서 벗어나세요','bad');SFX('warn');return true;
      }
      continue;
    }
    if(a.t==='breath'){
      if(dist<=a.len&&los(m.x,m.y,p.x,p.y)){
        var lt=lineTiles(m.x,m.y,p.x,p.y,a.len);
        m.tele={tiles:lt,mult:a.m,st:'burn'};m.cd[i]=a.ev;
        log('⚠ '+m.nm+jo(m.nm,'이','가')+' 숨을 크게 들이쉰다! 일직선을 피하세요','bad');SFX('warn');return true;
      }
      continue;
    }
  }
  return false;
}
function resolveTele(m){
  var t=m.tele,p=G.p,hit=false;m.tele=null;
  t.tiles.forEach(function(c){FX.flash(c[0],c[1],'#ff6a3a');if(c[0]===p.x&&c[1]===p.y)hit=true;});
  FX.shake(5);
  if(hit)monAttack(m,t.mult,{ranged:true,st:t.st,aoe:true});else log('범위 공격을 피했다!','info');
}

/* ================= 턴 진행 ================= */
function spawnWanderer(){
  var m=G.map,W=m.w,tries=0;
  while(tries++<50){
    var x=1+Math.floor(R.next()*(m.w-2)),y=1+Math.floor(R.next()*(m.h-2));
    if(!isFloor(x,y)||cheb(x,y,G.p.x,G.p.y)<12||m.vis[y*W+x]||monAt(x,y))continue;
    var mm=mkMon(R,pickMonKey(R,G.depth),x,y,{sleep:false});G.mons.push(mm);return;
  }
}
function tick(){
  var p=G.p,k;
  G.turn++;G.fturn++;S.st.turns++;
  plrStatusTick();if(G.over)return;
  if(p.hp<ST.maxHp){p.hpAcc+=ST.maxHp*(.15+ST.regen)/100;if(p.hpAcc>=1){var h=Math.floor(p.hpAcc);p.hpAcc-=h;p.hp=Math.min(ST.maxHp,p.hp+h);}}else p.hpAcc=0;
  if(p.mp<ST.maxMp){p.mpAcc+=ST.mpr;if(p.mpAcc>=1){var mm=Math.floor(p.mpAcc);p.mpAcc-=mm;p.mp=Math.min(ST.maxMp,p.mp+mm);}}else p.mpAcc=0;
  for(k in p.cd){if(p.cd[k]>0)p.cd[k]--;}
  for(k in p.bf){if(p.bf[k]>0)p.bf[k]--;}
  var W=G.map.w;
  for(var tk in G.traps){var tr=G.traps[tk];if(!tr.rev){var tx=tk%W,ty=(tk/W)|0;if(cheb(tx,ty,p.x,p.y)<=2&&R.next()<.4)tr.rev=true;}}
  computeDist();
  var list=G.mons.slice();
  for(var i=0;i<list.length&&!G.over;i++)monTurn(list[i]);
  if(!G.over&&G.fturn>0&&G.fturn%140===0&&!G.flags.boss)spawnWanderer();
}
function endTurn(cost){
  cost=cost||1;
  if(G.p.st.slow>0){G.p.slowTog=!G.p.slowTog;if(G.p.slowTog)cost++;}
  for(var i=0;i<cost&&!G.over;i++)tick();
  G.mons=G.mons.filter(function(m){return m.hp>0;});
  afterTurn();
}
function afterTurn(){
  if(!G||G.over){if(UI.refresh)UI.refresh();return;}
  updateDex();
  if(UI.refresh)UI.refresh();
  if(G.pend.lv>0||G.pend.relic>0||G.pend.victory){if(UI.processPending)UI.processPending();}
  saveRun();
}

/* ================= 타깃팅 ================= */
function inReach(m,range){
  var p=G.p,d=cheb(m.x,m.y,p.x,p.y);
  if(m.hp<=0||d<1||d>range||!isVisMon(m))return false;
  if(d===1)return !!(MON[m.k].phase||adjOK(p.x,p.y,m.x-p.x,m.y-p.y));
  return los(p.x,p.y,m.x,m.y);
}
function pickTarget(range){
  var p=G.p,sel=null,best=null,bd=1e9,i;
  if(G.tgt){for(i=0;i<G.mons.length;i++){if(G.mons[i].id===G.tgt&&G.mons[i].hp>0){sel=G.mons[i];break;}}}
  if(sel&&inReach(sel,range))return sel;
  G.mons.forEach(function(m){if(!inReach(m,range))return;var sc=cheb(m.x,m.y,p.x,p.y)*100+m.hp/m.mhp*10;if(sc<bd){bd=sc;best=m;}});
  return best;
}
function visibleHostiles(){return G.mons.filter(function(m){return m.hp>0&&isVisMon(m);});}
function adjacentMons(){
  var p=G.p;
  return G.mons.filter(function(m){return m.hp>0&&cheb(m.x,m.y,p.x,p.y)===1&&(MON[m.k].phase||adjOK(p.x,p.y,m.x-p.x,m.y-p.y));});
}

/* ================= 아이템 습득 / 함정 ================= */
function removeItem(o){var i=G.items.indexOf(o);if(i>=0)G.items.splice(i,1);}
function giveItem(it){
  var p=G.p;
  G.stats.items++;S.st.items++;if(it.r===4)S.st.legend++;if(it.un)S.dex.uni[it.un]=1;
  if(!p.eq[it.k]){p.eq[it.k]=it;recalc(true);log('장착: '+itemName(it),'info');}
  else p.bag.push(it);
}
function pickupHere(){
  var p=G.p,list=itemAt(p.x,p.y);
  for(var i=0;i<list.length;i++){
    var o=list[i];
    if(o.g){var g=addGold(o.g);log('💰 골드 +'+g,'gold');FX.text(p.x,p.y,'+'+g,'#ffd24d');removeItem(o);SFX('coin');}
    else if(o.c){
      var cur=p.cons[o.c]||0;
      if(cur>=CONS_CAP){if(!o.warned){log(CONS[o.c].n+'을(를) 더 들 수 없다','mut');o.warned=true;}continue;}
      p.cons[o.c]=cur+(o.n||1);log(CONS[o.c].e+' '+CONS[o.c].n+' 획득','info');removeItem(o);SFX('pick');
    }else if(o.it){
      if(p.bag.length>=BAG_CAP&&p.eq[o.it.k]){if(!o.warned){log('가방이 가득 찼다! ('+itemName(o.it)+')','bad');o.warned=true;}continue;}
      var it=o.it,better=itemScore(it)>itemScore(p.eq[it.k]);
      giveItem(it);removeItem(o);
      log('획득: '+itemName(it)+(better&&p.eq[it.k]!==it?' ▲':''),'info');SFX('pick');
      if(it.r>=3)FX.ring(p.x,p.y,RAR[it.r].c);
    }
  }
}
function applyTrap(tr){
  var p=G.p,dep=G.depth;
  FX.ring(p.x,p.y,'#ff6a3a');
  if(tr.t==='spike'){log('⚠ 가시 함정!','bad');hurtPlayer(ST.maxHp*.07+dep*2,'가시 함정');}
  else if(tr.t==='gas'){log('☣ 독가스가 뿜어져 나왔다!','bad');addPStatus('poison',6,Math.max(1,Math.round(ST.maxHp*.012+dep*.5)));}
  else if(tr.t==='fire'){log('🔥 화염 함정!','bad');hurtPlayer(ST.maxHp*.04+dep,'화염 함정');if(!G.over)addPStatus('burn',3,Math.max(1,Math.round(ST.maxHp*.012+dep*.4)));}
  else if(tr.t==='alarm'){log('🔔 경보가 울렸다! 모든 적이 깨어났다','bad');G.mons.forEach(function(m){m.sl=false;});SFX('warn');}
  else if(tr.t==='tele'){log('🌀 전송 함정! 어딘가로 날아갔다','info');teleportRandom();}
}
function trapCheck(){
  var p=G.p,W=G.map.w,k=p.x+p.y*W,tr=G.traps[k];
  if(!tr)return;
  delete G.traps[k];
  applyTrap(tr);
}
function disarmTrap(x,y){
  var W=G.map.w,k=x+y*W,tr=G.traps[k];
  if(!tr)return false;
  stopTravel();
  delete G.traps[k];
  if(R.next()<.7){log('🛠 '+TRAPS[tr.t].n+'을(를) 해제했다','good');FX.ring(x,y,'#9fffb0');SFX('click');}
  else{log('해제에 실패했다!','bad');applyTrap(tr);}
  endTurn(1);
  return true;
}
function teleportRandom(){
  var m=G.map,W=m.w,tries=0,x,y;
  while(tries++<80){
    x=1+Math.floor(R.next()*(m.w-2));y=1+Math.floor(R.next()*(m.h-2));
    if(!isFloor(x,y)||monAt(x,y)||m.vis[y*W+x]&&tries<60)continue;
    var pr=propAt(x,y);if(pr&&blocksMove(pr))continue;
    if(tries<60&&cheb(x,y,G.p.x,G.p.y)<8)continue;
    G.p.x=x;G.p.y=y;G.p.vx=x;G.p.vy=y;computeFOV();FX.ring(x,y,'#9ec3ff');return true;
  }
  return false;
}
function onStairs(){return G.map.t[G.p.y*G.map.w+G.p.x]===2;}

/* ================= 이동 / 공격 ================= */
function stepTo(dx,dy){
  var p=G.p,nx=p.x+dx,ny=p.y+dy;
  if(!canStep(p.x,p.y,dx,dy,false))return false;
  if(monAt(nx,ny))return false;
  var pr=propAt(nx,ny);if(pr&&blocksMove(pr))return false;
  p.x=nx;p.y=ny;
  computeFOV();
  pickupHere();
  trapCheck();
  if(!G.over&&onStairs())UI.toast('계단 위예요 · 내려가기 버튼 (Enter)');
  endTurn(1);
  return true;
}
function playerAttack(m){
  var p=G.p,C=CLASSES[G.cls],d=cheb(m.x,m.y,p.x,p.y);sprAtk('p',p,m);
  noise(6);
  var res=calcPlayerDmg(m,C.bm,{sneak:true});
  if(d>1)FX.shoot(p.x,p.y,m.x,m.y,C.col);else FX.slash(m.x,m.y);
  SFX(res.c?'crit':'hit');
  log((res.c?'치명타! ':'')+m.nm+jo(m.nm,'에게','에게')+' '+res.d+' 피해',res.c?'crit':'');
  hurtMon(m,res.d,res.c,{});
  procHit(m);
  G.tgt=m.hp>0?m.id:0;
  endTurn(1);
  return true;
}
function openChest(pr){
  var dep=G.depth,p=G.p;
  pr.open=true;
  if(pr.mimic){
    var i=G.props.indexOf(pr);if(i>=0)G.props.splice(i,1);
    var mm=mkMon(R,'mimic',pr.x,pr.y,{sleep:false});G.mons.push(mm);
    log('📦 상자가 입을 벌렸다! 미믹이다!','bad');FX.ring(pr.x,pr.y,'#ff6a6a');FX.shake(6);SFX('boss');
    endTurn(1);return true;
  }
  SFX('chest');log('📦 상자를 열었다!','info');FX.ring(pr.x,pr.y,'#ffd24d');
  G.items.push({x:pr.x,y:pr.y,g:Math.round((18+dep*8)*(.8+.5*R.next())*(pr.rich?3:1))});
  if(pr.rich){
    for(var i2=0;i2<3;i2++)G.items.push({x:pr.x,y:pr.y,it:randomEquip(R,dep,ST.luck+30,i2===0?3:2)});
    G.items.push({x:pr.x,y:pr.y,c:'hp',n:1});G.items.push({x:pr.x,y:pr.y,c:'mp',n:1});
  }else{
    if(R.next()<.72)G.items.push({x:pr.x,y:pr.y,it:randomEquip(R,dep,ST.luck+30,0)});
    if(R.next()<.28)G.items.push({x:pr.x,y:pr.y,it:randomEquip(R,dep,ST.luck+30,1)});
    if(R.next()<.45)G.items.push({x:pr.x,y:pr.y,c:R.pick(['hp','mp','hp','cure','tele','map','fire','bomb','enh','fear']),n:1});
    if(R.next()<.06)G.pend.relic++;
  }
  endTurn(1);return true;
}
function interact(pr){
  if(pr.t==='chest')return openChest(pr);
  if(pr.t==='shrine'){UI.openShrine(pr);return false;}
  if(pr.t==='merch'){UI.openShop(pr);return false;}
  return false;
}
function doMove(dx,dy){
  if(!G||G.over)return false;
  stopTravel();
  var p=G.p;
  if(!dx&&!dy)return doWait();
  if(dx&&dy&&!(isFloor(p.x+dx,p.y)&&isFloor(p.x,p.y+dy)))return false;
  var nx=p.x+dx,ny=p.y+dy,m=monAt(nx,ny);
  if(m)return playerAttack(m);
  var pr=propAt(nx,ny);
  if(pr&&blocksMove(pr))return interact(pr);
  if(!isFloor(nx,ny))return false;
  var trk=G.traps[ny*G.map.w+nx];
  if(trk&&trk.rev)return disarmTrap(nx,ny);
  return stepTo(dx,dy);
}
function doWait(){
  if(!G||G.over)return false;
  stopTravel();pickupHere();endTurn(1);return true;
}
function doAttackAuto(){
  if(!G||G.over)return false;
  stopTravel();
  var m=pickTarget(CLASSES[G.cls].rg);
  if(!m){UI.toast('공격할 대상이 없어요');return false;}
  return playerAttack(m);
}

function castPay(id){
  var p=G.p,sk=SK[id];sprAtk('p',p,null);
  if(sk.mp)p.mp-=skillCost(sk);
  if(sk.hp)p.hp=Math.max(1,p.hp-Math.ceil(p.hp*sk.hp));
  if(sk.cd)p.cd[id]=sk.cd;
}

function useCons(key){
  if(!G||G.over)return false;
  stopTravel();
  var p=G.p;
  if(!(p.cons[key]>0)){UI.toast(CONS[key].n+'이(가) 없어요');return false;}
  var used=false,i;
  if(key==='hp'){
    if(p.hp>=ST.maxHp){UI.toast('HP가 가득 찼어요');return false;}
    var h=healPlayer(ST.maxHp*.45*(1+ST.pot/100),false);log('🧪 체력 물약 (+'+h+')','good');SFX('heal');used=true;
  }else if(key==='mp'){
    if(p.mp>=ST.maxMp){UI.toast('MP가 가득 찼어요');return false;}
    var before=p.mp;p.mp=Math.min(ST.maxMp,p.mp+Math.round(ST.maxMp*.5*(1+ST.pot/100)));
    FX.text(p.x,p.y,'+'+(p.mp-before)+' MP','#7fbcff');log('💧 마나 물약 (+'+(p.mp-before)+')','info');SFX('heal');used=true;
  }else if(key==='cure'){
    if(!p.st.poison&&!p.st.burn&&!p.st.slow){UI.toast('상태이상이 없어요');return false;}
    p.st={};log('💊 상태이상을 모두 씻어냈다','good');SFX('heal');used=true;
  }else if(key==='tele'){
    log('🌀 순간이동!','info');SFX('skill');teleportRandom();used=true;
  }else if(key==='map'){
    revealAll();log('📜 지도가 펼쳐졌다','info');SFX('skill');used=true;
  }else if(key==='fire'){
    var ms=visibleHostiles();if(!ms.length){UI.toast('시야 안에 적이 없어요');return false;}
    log('☄️ 불의 두루마리! ('+ms.length+'명)','crit');SFX('skill');FX.shake(6);noise(9);
    ms.forEach(function(m){FX.ring(m.x,m.y,'#ff8a3a');var r=calcPlayerDmg(m,2.2,{});hurtMon(m,r.d,false,{color:'#ff9a4a'});if(m.hp>0)applyMonStatus(m,'burn',3,Math.max(1,Math.round(curAtk()*.3)));});
    used=true;
  }else if(key==='enh'){
    var order=['w','a'],tg=null;
    for(i=0;i<order.length;i++){var it=p.eq[order[i]];if(it&&it.mk&&(it.plus||0)<5){tg=it;break;}}
    if(!tg){UI.toast('강화할 수 있는 장비가 없어요');return false;}
    tg.plus=(tg.plus||0)+1;recalc(true);log('✨ '+itemName(tg)+' 강화 성공!','good');SFX('lvl');FX.ring(p.x,p.y,'#ffe08a');used=true;
  }else if(key==='fear'){
    var ms2=visibleHostiles();if(!ms2.length){UI.toast('시야 안에 적이 없어요');return false;}
    ms2.forEach(function(m){if(!MON[m.k].boss){m.st.fear=8;m.sl=false;FX.text(m.x,m.y,'😱','#fff');}});
    log('😱 공포의 두루마리! 적들이 도망친다','crit');SFX('skill');used=true;
  }else if(key==='bomb'){
    var t=pickTarget(5);if(!t){UI.toast('사거리 안에 적이 없어요');return false;}
    log('💣 폭탄 투척!','crit');SFX('skill');FX.shoot(p.x,p.y,t.x,t.y,'#ffcf5a');FX.ring(t.x,t.y,'#ff8a3a');FX.shake(6);noise(9);
    G.mons.filter(function(m){return m.hp>0&&cheb(m.x,m.y,t.x,t.y)<=1;}).forEach(function(m){var r=calcPlayerDmg(m,3.0,{});hurtMon(m,r.d,false,{color:'#ffcf5a'});});
    used=true;
  }
  if(used){p.cons[key]--;endTurn(1);}
  return used;
}

  if(i>=p.bag.length)return false;
  var it=p.bag[i],old=p.eq[it.k];
  p.bag.splice(i,1);p.eq[it.k]=it;if(old)p.bag.push(old);
  recalc(true);log('장착: '+itemName(it),'info');SFX('click');return true;
}
function unequipSlot(sl){
  var p=G.p,it=p.eq[sl];if(!it)return false;
  if(p.bag.length>=BAG_CAP){UI.toast('가방이 가득 찼어요');return false;}
  p.eq[sl]=null;p.bag.push(it);recalc(false);SFX('click');return true;
}
function breakGold(it){return Math.max(1,Math.round(itemPrice(it)*.24));}
function dropItem(id){
  var p=G.p,i;for(i=0;i<p.bag.length;i++){if(p.bag[i].id===id)break;}

  var it=p.bag.splice(i,1)[0],g=breakGold(it);p.gold+=g;log('분해: '+itemName(it)+' (+'+g+'골드)','gold');SFX('coin');return true;

function worseCount(){
  var p=G.p,n=0;
  p.bag.forEach(function(it){var cur=p.eq[it.k];if(cur&&itemScore(it)<=itemScore(cur))n++;});

}
function dropWorse(){
  var p=G.p,n=0,gold=0;
  for(var i=p.bag.length-1;i>=0;i--){
    var it=p.bag[i],cur=p.eq[it.k];
    if(cur&&itemScore(it)<=itemScore(cur)){gold+=breakGold(it);p.bag.splice(i,1);n++;}
  }
  if(n){p.gold+=gold;log('열등한 장비 '+n+'개를 분해했다 (+'+gold+'골드)','gold');SFX('coin');}
  return n;
}

/* ================= 길찾기 / 자동 이동 ================= */
var TR=null;
function bfsPath(goalFn,ignoreMons,allowTraps){
  var m=G.map,W=m.w,H=m.h,p=G.p,start=p.y*W+p.x;
  var prev=new Int32Array(W*H).fill(-2);prev[start]=-1;
  var q=[start],h=0,found=-1;
  while(h<q.length&&found<0){
    var c=q[h++],cx=c%W,cy=(c/W)|0;
    for(var i=0;i<8;i++){
      var dx=DIRS8[i][0],dy=DIRS8[i][1];
      if(!canStep(cx,cy,dx,dy,false))continue;
      var nx=cx+dx,ny=cy+dy,ni=ny*W+nx;
      if(prev[ni]!==-2||!m.seen[ni])continue;
      if(goalFn(nx,ny)){prev[ni]=c;found=ni;break;}
      var tr=G.traps[ni];if(tr&&tr.rev&&!allowTraps)continue;
      if(!ignoreMons){var mo=monAt(nx,ny);if(mo&&isVisMon(mo))continue;}
      var pr=propAt(nx,ny);if(pr&&blocksMove(pr))continue;
      prev[ni]=c;q.push(ni);
    }
  }
  if(found<0)return null;
  var path=[],cur=found;
  while(cur!==start){path.push([cur%W,(cur/W)|0]);cur=prev[cur];}
  path.reverse();return path;
}
function isExploreGoal(x,y){
  var m=G.map,W=m.w,k=y*W+x,p=G.p;
  if(x===p.x&&y===p.y)return false;
  var tr=G.traps[k];if(tr&&tr.rev)return false;
  var its=itemAt(x,y);
  for(var i=0;i<its.length;i++){var o=its[i];if(o.it&&p.bag.length>=BAG_CAP&&p.eq[o.it.k])continue;if(o.c&&(p.cons[o.c]||0)>=CONS_CAP)continue;return true;}
  if(m.t[k]===0)return false;
  var nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var j=0;j<4;j++){var nx=x+nb[j][0],ny=y+nb[j][1];if(!inb(nx,ny))continue;var ni=ny*W+nx;if(!m.seen[ni]&&m.t[ni]!==0)return true;}
  return false;
}
function findPath(goalFn){return bfsPath(goalFn)||bfsPath(goalFn,false,true);}
function explorePath(){return findPath(isExploreGoal);}
function blockerOnPath(goalFn){
  var path=bfsPath(goalFn,true,true);
  if(!path)return null;
  for(var i=0;i<path.length;i++){var mo=monAt(path[i][0],path[i][1]);if(mo&&isVisMon(mo))return mo;}
  return null;
}
function noteBlocker(goalFn){
  var bl=blockerOnPath(goalFn);
  if(bl){G.tgt=bl.id;UI.toast('길을 막고 있는 '+bl.nm+jo(bl.nm,'을','를')+' 처치하세요');if(UI.refresh)UI.refresh();return true;}
  return false;
}
function stopTravel(){if(TR){clearTimeout(TR.timer);TR=null;if(UI.travelState)UI.travelState(false);}}
function startTravel(path,mode){
  stopTravel();
  if(!path||!path.length)return false;
  TR={path:path,mode:mode,timer:0,hp:G.p.hp,known:{}};
  G.mons.forEach(function(m){if(m.hp>0&&isVisMon(m))TR.known[m.id]=1;});
  if(UI.travelState)UI.travelState(true,mode);
  travelStep();
  return true;
}
function travelStep(){
  if(!TR)return;
  if(!G||G.over||(UI.busy&&UI.busy())){stopTravel();return;}
  var p=G.p,threat=false,fresh=false;
  G.mons.forEach(function(m){
    if(m.hp<=0||!isVisMon(m))return;
    if(!TR.known[m.id]){TR.known[m.id]=1;fresh=true;}
    if(!m.sl)threat=true;
  });
  if(threat||fresh){stopTravel();UI.toast(threat?'적이 나타났어요!':'앞에 무언가 있어요');return;}
  var nxt=TR.path.shift();
  if(!nxt){stopTravel();return;}
  var dx=nxt[0]-p.x,dy=nxt[1]-p.y;
  if(Math.abs(dx)>1||Math.abs(dy)>1||monAt(nxt[0],nxt[1])){stopTravel();return;}
  var pr=propAt(nxt[0],nxt[1]);if(pr&&blocksMove(pr)){stopTravel();return;}
  var trn=G.traps[nxt[1]*G.map.w+nxt[0]];
  if(trn&&trn.rev){var md0=TR.mode,rest=TR.path.slice();rest.unshift(nxt);disarmTrap(nxt[0],nxt[1]);if(G.over)return;TR={path:rest,mode:md0,timer:0,hp:G.p.hp,known:{}};G.mons.forEach(function(m){if(m.hp>0&&isVisMon(m))TR.known[m.id]=1;});TR.timer=setTimeout(travelStep,70);return;}
  var hp0=p.hp;
  if(!stepTo(dx,dy)){stopTravel();return;}
  if(!TR)return;
  if(G.p.hp<hp0){stopTravel();return;}
  if(TR.path.length===0){
    if(TR.mode==='explore'){
      var np=explorePath();
      if(np&&np.length)TR.path=np;
      else{stopTravel();if(!noteBlocker(isExploreGoal))UI.toast('탐험 완료! 계단으로 가세요');return;}
    }else{
      var md=TR.mode;stopTravel();if(md==='stairs'&&onStairs())UI.toast('계단에 도착했어요 · 내려가기 버튼 (Enter)');return;
    }
  }
  TR.timer=setTimeout(travelStep,55);
}
function doExplore(){
  if(!G||G.over)return false;
  if(TR){stopTravel();return true;}
  var aw=visibleHostiles().filter(function(m){return !m.sl;});
  if(aw.length){UI.toast('적이 시야에 있어요!');return false;}
  var path=explorePath();
  if(!path||!path.length){if(!noteBlocker(isExploreGoal))UI.toast('더 탐험할 곳이 없어요. 계단으로 가세요!');return false;}
  startTravel(path,'explore');return true;
}
function tapTile(tx,ty){
  if(!G||G.over)return;
  var p=G.p,C=CLASSES[G.cls];
  if(tx===p.x&&ty===p.y){if(onStairs())descend();else doWait();return;}
  var m=monAt(tx,ty);
  if(m&&isVisMon(m)){
    G.tgt=m.id;
    if(inReach(m,C.rg)){playerAttack(m);return;}
    var path=findPath(function(x,y){return x===tx&&y===ty;});
    if(path&&path.length>1){doMove(path[0][0]-p.x,path[0][1]-p.y);}
    else{if(UI.refresh)UI.refresh();}
    return;
  }
  var dx=tx-p.x,dy=ty-p.y;
  if(Math.abs(dx)<=1&&Math.abs(dy)<=1){doMove(dx,dy);return;}
  var W=G.map.w;
  if(!G.map.seen[ty*W+tx]){UI.toast('아직 가보지 못한 곳이에요');return;}
  var p2=findPath(function(x,y){return x===tx&&y===ty;});
  if(p2&&p2.length)startTravel(p2,'tile');else UI.toast('갈 수 없는 곳이에요');
}

function dailyState(){var k=todayKey();if(S.daily.key!==k){S.daily.key=k;S.daily.best=0;S.daily.claimed=false;}return S.daily;}
function dailyMuts(){var dr=new RNG(hashStr('dm:'+todayKey()));return dr.shuffle(MUT_IDS.slice()).slice(0,2);}

function tone(f1,f2,dur,type,vol,delay){
  var a=audio();if(!a)return;
  var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);
}

function stepVisuals(dt){
  if(!G||!G.map)return false;
  var k=1-Math.exp(-dt/62),moving=false;
  function sv(o){
    var ex=o.x-o.vx,ey=o.y-o.vy;
    if(Math.abs(ex)<.012&&Math.abs(ey)<.012){o.vx=o.x;o.vy=o.y;return;}
    if(Math.abs(ex)>6||Math.abs(ey)>6){o.vx=o.x;o.vy=o.y;return;}
    o.vx+=ex*k;o.vy+=ey*k;moving=true;
  }
  sv(G.p);for(var i=0;i<G.mons.length;i++)sv(G.mons[i]);
  if(shakeAmt>.2)shakeAmt*=Math.exp(-dt/110);else shakeAmt=0;
  if(hurtFlash>.02)hurtFlash*=Math.exp(-dt/220);else hurtFlash=0;
  return moving;
}

  var dt=Math.min(100,lastTs?now-lastTs:16);lastTs=now;
  var moving=stepVisuals(dt);

      var e=Math.min(1,u*1.6),ax=ox+(f.x0+.5)*T,ay=oy+(f.y0+.5)*T,bx=ox+(f.x1+.5)*T,by=oy+(f.y1+.5)*T;
      var hx=ax+(bx-ax)*e,hy=ay+(by-ay)*e,tx2=ax+(bx-ax)*Math.max(0,e-.25),ty2=ay+(by-ay)*Math.max(0,e-.25);
      ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(tx2,ty2);ctx.lineTo(hx,hy);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,3,0,6.283);ctx.fill();
    }else if(f.k==='line'){
      ctx.globalAlpha=1-u;ctx.strokeStyle=f.col;ctx.lineWidth=4*(1-u)+1;ctx.beginPath();ctx.moveTo(ox+(f.x0+.5)*T,oy+(f.y0+.5)*T);ctx.lineTo(ox+(f.x1+.5)*T,oy+(f.y1+.5)*T);ctx.stroke();ctx.globalAlpha=1;
    }else if(f.k==='ring'){
      ctx.globalAlpha=1-u;ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(ox+(f.x+.5)*T,oy+(f.y+.5)*T,T*(.3+u*1.2),0,6.283);ctx.stroke();ctx.globalAlpha=1;
    }else if(f.k==='slash'){
      var scx=ox+(f.x+.5)*T,scy=oy+(f.y+.5)*T;ctx.globalAlpha=1-u;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';
      var L=T*.4*(.6+u);ctx.beginPath();ctx.moveTo(scx-Math.cos(f.a)*L,scy-Math.sin(f.a)*L);ctx.lineTo(scx+Math.cos(f.a)*L,scy+Math.sin(f.a)*L);ctx.stroke();ctx.globalAlpha=1;
    }else if(f.k==='flash'){
      ctx.globalAlpha=.7*(1-u);ctx.fillStyle=f.col;ctx.fillRect(ox+f.x*T,oy+f.y*T,T,T);ctx.globalAlpha=1;
    }else if(f.k==='burst'){
      ctx.globalAlpha=1-u;ctx.fillStyle=f.col;
      for(var q2=0;q2<f.ps.length;q2++){var pp=f.ps[q2],rr=u*T*pp.s;ctx.beginPath();ctx.arc(ox+(f.x+.5)*T+Math.cos(pp.a)*rr,oy+(f.y+.5)*T+Math.sin(pp.a)*rr,Math.max(1.5,T*.07*(1-u)),0,6.283);ctx.fill();}
      ctx.globalAlpha=1;
    }
  }
  /* 피격 / 독 화면 효과 */
  if(hurtFlash>.02){ctx.fillStyle='rgba(255,40,60,'+(hurtFlash*.28).toFixed(3)+')';ctx.fillRect(0,0,CW,CH);}
  if(ST&&G.p.hp<ST.maxHp*.25){var pl=.08+.05*Math.sin(now/260);var lg2=ctx.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*.3,CW/2,CH/2,Math.max(CW,CH)*.7);lg2.addColorStop(0,'rgba(200,0,30,0)');lg2.addColorStop(1,'rgba(200,0,30,'+(pl+.14).toFixed(3)+')');ctx.fillStyle=lg2;ctx.fillRect(0,0,CW,CH);}
  /* 보스 체력바 */
  var bs=null;for(i=0;i<G.mons.length;i++){var bm=G.mons[i];if(bm.hp>0&&MON[bm.k].boss&&!bm.sl){bs=bm;break;}}
  if(bs){
    var bw=Math.min(CW*.58,360),bx2=8,by2=8;
    ctx.fillStyle='rgba(8,9,20,.78)';ctx.fillRect(bx2,by2,bw,24);ctx.strokeStyle='#ffb347';ctx.lineWidth=1.5;ctx.strokeRect(bx2+.5,by2+.5,bw-1,23);
    ctx.fillStyle=bs.enr?'#ff4d4d':'#c93c55';ctx.fillRect(bx2+3,by2+14,(bw-6)*Math.max(0,bs.hp/bs.mhp),7);
    ctx.fillStyle='#ffe0a0';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(bs.nm+(bs.enr?' (분노)':''),bx2+6,by2+2);
  }

}

function monTraits(k){
  var d=MON[k],t=[];
  if(d.und)t.push('언데드');if(d.phase)t.push('벽을 통과');if(d.erratic)t.push('불규칙하게 움직임');if(d.split)t.push('죽으면 둘로 분열');if(d.explode)t.push('죽으면 폭발');if(d.drain)t.push('피를 빨아먹음');
  if(d.rng)t.push('원거리 공격 (사거리 '+d.rng+')');if(d.kite)t.push('거리를 유지함');
  if(d.spd>1)t.push('빠름');if(d.spd<1)t.push('느림');
  if(d.hit){for(var s in d.hit)t.push({poison:'☠️ 중독',burn:'🔥 화상',slow:'🧊 감속'}[s]+' 공격');}
  if(d.abil){d.abil.forEach(function(a){t.push({summon:'부하 소환',shoot:'원거리 사격',slam:'범위 내려치기 (예고됨)',breath:'직선 브레스 (예고됨)',enrage:'HP가 줄면 분노'}[a.t]);});}
  if(d.boss)t.push('보스');
  return t;
}

function exportCode(){

function importCode(code){
  try{

    case 'mon':openMonInfo(v);break;

    case 'selBag':selI={src:'bag',id:parseInt(v,10)};renderBag();break;

    case 'unequip':if(unequipSlot(v)){selI=null;UI.refresh();renderBag();}break;

    case 'use':{var okU=useCons(v);if(okU)closeSheet();else renderBag();break;}
    case 'perk':{addPerk(v);G.pend.lv--;closeSheet();UI.refresh();saveRun();break;}
    case 'relic':{gainRelic(v);G.pend.relic--;closeSheet();UI.refresh();saveRun();break;}
    case 'victoryExit':closeSheet();endRun(true,'심연 정복');break;
    case 'victoryGo':G.abyss=true;log('🌑 심연으로 더 깊이 내려간다...','info');closeSheet();UI.refresh();saveRun();break;
    case 'shrineyes':if(shrineChoose(shrinePr)){closeSheet();UI.refresh();}break;

    case 'menuBag':closeSheet();openBag('eq');break;
    case 'menuSettings':openSettings(true);break;

    case 'menuGiveUp':confirmBox('모험을 포기할까요?','지금까지 모은 영혼은 그대로 받아요. 하지만 이번 모험은 끝나요.','포기하기',function(){closeSheet();endRun(false,'모험 포기',true);},function(){openMenu();});break;
    case 'toTown':closeSheet();G=null;toTown();break;
    case 'again':{var rr=G&&G.res?G.res:{cls:cs.cls};closeSheet();cs.cls=rr.cls;cs.daily=false;cs.heat=Math.min(rr.heat||0,heatUnlocked());G=null;launchRun();break;}
    case 'tips':openTips();break;

      if(v==='dpad'){S.set.dpad=S.set.dpad===null?true:(S.set.dpad?false:null);}

var KEYDIR={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],q:[-1,-1],e:[1,-1],z:[-1,1],c:[1,1],
  W:[0,-1],S:[0,1],A:[-1,0],D:[1,0],Q:[-1,-1],E:[1,-1],Z:[-1,1],C:[1,1]};
var NUMDIR={Numpad8:[0,-1],Numpad2:[0,1],Numpad4:[-1,0],Numpad6:[1,0],Numpad7:[-1,-1],Numpad9:[1,-1],Numpad1:[-1,1],Numpad3:[1,1]};
function onKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var root=document.documentElement;if(!root.classList.contains('kb'))root.classList.add('kb');
  var k=e.key;
  if(!$('modal').hidden){
    if(k==='Escape'&&sheetClosable){e.preventDefault();closeSheet();}
    return;
  }
  if($('s-game').hidden||!G||G.over)return;
  var d=NUMDIR[e.code]||KEYDIR[k];
  if(d){e.preventDefault();doMove(d[0],d[1]);return;}
  switch(k){
    case ' ':case '.':e.preventDefault();doWait();return;
    case 'f':case 'F':e.preventDefault();doAttackAuto();return;
    case '1':e.preventDefault();doSkill(0);return;
    case '2':e.preventDefault();doSkill(1);return;
    case 'h':case 'H':e.preventDefault();useCons('hp');return;
    case 'm':case 'M':e.preventDefault();useCons('mp');return;
    case 'x':case 'X':e.preventDefault();doExplore();UI.refresh();return;
    case 'Enter':case '>':e.preventDefault();doStairs();UI.refresh();return;
    case 'i':case 'I':case 'b':case 'B':e.preventDefault();openBag();return;
    case 'Escape':e.preventDefault();openMenu();return;
    case 'Tab':e.preventDefault();cycleTarget();return;
  }
  if(e.code==='Numpad5'||e.code==='Numpad0'){e.preventDefault();doWait();}
}
var ptr=null,dpRep=null;
function initInput(){
  document.addEventListener('keydown',onKey);
  document.addEventListener('click',function(e){
    var t=e.target,el=t.closest?t.closest('[data-a]'):null;
    if(el){if(el.disabled)return;handleA(el.getAttribute('data-a'),el.getAttribute('data-v'));if(el.blur)el.blur();return;}
    var ab2=t.closest?t.closest('[data-act]'):null;
    if(ab2){onAct(ab2.getAttribute('data-act'));if(ab2.blur)ab2.blur();}
  });
  $('modal').addEventListener('click',function(e){if(e.target===$('modal')&&sheetClosable&&sheetId!=='confirm')closeSheet();});
  $('clsGo').addEventListener('click',function(){audio();launchRun();});
  $('bBag').addEventListener('click',function(){audio();openBag();});
  $('bMenu').addEventListener('click',function(){audio();openMenu();});
  $('bMini').addEventListener('click',function(){S.set.mini=!S.set.mini;saveMeta();drawMini();});
  var c=$('cv');
  c.addEventListener('pointerdown',function(e){audio();ptr={x:e.clientX,y:e.clientY};});
  c.addEventListener('pointercancel',function(){ptr=null;});
  c.addEventListener('pointerup',function(e){
    if(!ptr)return;var dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr=null;
    if(!G||G.over||UI.busy())return;
    if(Math.hypot(dx,dy)>28){
      var k=Math.round(Math.atan2(dy,dx)/(Math.PI/4));
      var MAP={0:[1,0],1:[1,1],2:[0,1],3:[-1,1],4:[-1,0],'-4':[-1,0],'-3':[-1,-1],'-2':[0,-1],'-1':[1,-1]};
      var m=MAP[k];if(m)doMove(m[0],m[1]);return;
    }
    var r=c.getBoundingClientRect();
    var tx=Math.floor((e.clientX-r.left-view.ox)/T),ty=Math.floor((e.clientY-r.top-view.oy)/T);
    if(inb(tx,ty))tapTile(tx,ty);
  });
  var dp=$('dpad');
  function stopRep(){if(dpRep){clearTimeout(dpRep.t);clearInterval(dpRep.i);dpRep=null;}}
  dp.addEventListener('pointerdown',function(e){
    var b=e.target.closest('button');if(!b)return;e.preventDefault();audio();
    var d=b.getAttribute('data-d').split(',').map(Number);
    if(!G||G.over||UI.busy())return;
    doMove(d[0],d[1]);stopRep();
    dpRep={t:setTimeout(function(){dpRep.i=setInterval(function(){if(!G||G.over||UI.busy()){stopRep();return;}doMove(d[0],d[1]);},150);},320)};
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){dp.addEventListener(ev,stopRep);});
  window.addEventListener('resize',function(){if(!$('s-game').hidden)resizeCanvas();});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&G&&!G.over)saveRun();});
  window.addEventListener('pagehide',function(){if(G&&!G.over)saveRun();});
}

/* ===== 화면 속 이모지 -> 도트 아이콘 자동 치환 (텍스트 노드 감시) ===== */
(function(){
  try{
    var st=document.createElement('style');
    st.textContent='.ei{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain}';
    document.head.appendChild(st);
    var keys=Object.keys(ICO).sort(function(a,b){return b.length-a.length;});
    var RE=new RegExp('('+keys.join('|')+')\\uFE0F?','gu');
    var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,TITLE:1,OPTION:0};
    function fix(n){
      var p=n.parentNode;if(!p||SKIP[p.nodeName]===1)return;
      var t=n.nodeValue;RE.lastIndex=0;if(!RE.test(t))return;
      RE.lastIndex=0;
      var fr=document.createDocumentFragment(),last=0,m;
      while((m=RE.exec(t))){
        if(m.index>last)fr.appendChild(document.createTextNode(t.slice(last,m.index)));
        var u=icoURL(m[1]);
        if(u){var im=new Image();im.className='ei';im.alt=m[1];im.draggable=false;im.src=u;fr.appendChild(im);}
        else fr.appendChild(document.createTextNode(m[0]));
        last=m.index+m[0].length;
      }
      if(last<t.length)fr.appendChild(document.createTextNode(t.slice(last)));
      p.replaceChild(fr,n);
    }
    function walk(root){
      if(root.nodeType===3){fix(root);return;}
      if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
      var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[],n;
      while((n=w.nextNode()))list.push(n);
      for(var i=0;i<list.length;i++)fix(list[i]);
    }
    walk(document.body);
    new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){
        var mu=ms[i];
        if(mu.type==='characterData'){if(mu.target.parentNode)fix(mu.target);}
        else for(var j=0;j<mu.addedNodes.length;j++)walk(mu.addedNodes[j]);
      }
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
  }catch(err){if(window.console)console.warn('icon replace failed',err);}
})();

})();
