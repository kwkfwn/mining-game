과 도전으로 새로운 가치를 창출하는 정신이다.","u":1},{"q":"비관세 장벽에 해당하는 것은?","c":["수입 할당제","수입 관세 인하","자유 무역 협정","관세 철폐","수출 보조금 폐지"],"a":0,"e":"수입 할당제와 각종 규제·인증 요건 등은 관세 외에 수입을 제한하는 비관세 장벽이다.","u":1},{"q":"을이 특강을 선택할 때의 총비용(명시적 비용 + 암묵적 비용)은?","p":"을은 토요일 3시간 동안 학원 특강(수강료 2만 원)을 듣기로 하였다. 같은 시간에 편의점에서 일하면 시간당 1만 원을 받을 수 있다. (다른 비용은 없다)","c":["5만 원","2만 원","3만 원","1만 원","6만 원"],"a":0,"e":"명시적 비용 2만 원과 포기한 아르바이트 수입(암묵적 비용) 3만 원을 더하면 5만 원이다.","u":0},{"q":"합리적 선택의 관점에서 가장 적절한 판단은?","p":"A 시는 공공 시설 건설 사업에 이미 30억 원을 썼으며(회수 불가) 완공까지 20억 원이 더 필요하다. 완공 시 기대 편익은 15억 원이다.","c":["추가 비용 20억 원이 기대 편익 15억 원보다 크므로 사업을 중단한다","이미 쓴 30억 원을 회수하기 위해 사업을 계속한다","이미 쓴 비용이 크므로 중단 여부는 고려할 수 없다","기대 편익이 있으므로 비용과 관계없이 계속한다","사업 규모를 확대하여 매몰 비용을 줄인다"],"a":0,"e":"이미 쓴 30억 원은 매몰 비용이므로 제외하고 추가 비용(20억 원)과 편익(15억 원)을 비교하면 중단이 합리적이다.","u":0},{"q":"다른 조건이 같을 때 프린터 가격이 크게 하락하였다면 프린터의 보완재인 잉크 시장에서 나타나는 변화로 옳은 것은?","c":["수요가 증가하여 균형 가격이 상승하고 균형 거래량이 증가한다","수요가 감소하여 균형 가격이 하락하고 균형 거래량이 감소한다","공급이 증가하여 균형 가격이 하락하고 균형 거래량이 증가한다","공급이 감소하여 균형 가격이 상승하고 균형 거래량이 감소한다","균형 가격과 균형 거래량 모두 변하지 않는다"],"a":0,"e":"프린터 소비가 늘면 보완재인 잉크의 수요가 증가하므로 균형 가격과 거래량이 모두 증가한다.","u":0},{"q":"다음 중 어떤 상품의 수요 곡선 자체를 이동시키지 않는 요인은?","c":["그 상품의 가격 변화","소비자의 소득 변화","소비자의 선호 변화","대체재의 가격 변화","소비자 수의 변화"],"a":0,"e":"그 상품의 가격 변화는 같은 수요 곡선 위의 이동(수요량 변화)이고, 나머지는 수요 곡선 자체를 이동시킨다.","u":0},{"q":"이 정책이 지속될 때 나타날 수 있는 현상으로 옳은 것은?","p":"정부가 임대료 안정을 위해 균형 가격보다 낮은 수준에서 최고 임대료를 정하고 이를 지키게 하였다.","c":["초과 수요가 발생하여 공급 부족과 암시장 거래가 나타날 수 있다","초과 공급이 발생하여 빈집이 쌓인다","균형 거래량이 늘어난다","가격이 자동으로 균형 가격으로 돌아온다","원하는 소비자 모두가 원하는 만큼 구할 수 있다"],"a":0,"e":"균형 가격보다 낮은 최고 가격은 수요량을 늘리고 공급량을 줄여 초과 수요와 암시장을 낳을 수 있다.","u":0},{"q":"이 문제를 완화하기 위한 정부 정책으로 가장 적절한 것은?","p":"한 공장이 오염 물질을 배출하여 인근 주민이 피해를 입지만 공장은 이에 대한 비용을 부담하지 않는다.","c":["오염 물질 배출에 환경 부담금(세금)을 부과한다","공장의 생산량을 무제한 허용한다","피해를 시장에 맡기고 개입하지 않는다","공장에 오염 물질 배출 보조금을 지급한다","해당 상품의 수입 관세를 인하한다"],"a":0,"e":"부정적 외부 효과는 원인 제공자에게 비용을 부담시키는 세금·부담금·규제로 완화할 수 있다.","u":0},{"q":"이 사례에 대한 설명으로 옳은 것은?","p":"마을 주민들이 공동으로 쓸 가로등 설치비를 자발적 기부로 모으려 했으나, 대부분이 '내가 내지 않아도 가로등은 이용할 수 있다'고 생각하여 기부가 거의 이루어지지 않았다.","c":["무임승차 문제로 공공재가 시장에서 과소 공급되는 시장 실패이다","정부의 지나친 개입으로 나타난 정부 실패이다","독과점 기업 때문에 발생한 문제이다","가로등이 사유재이기 때문에 나타난 문제이다","소비자 주권이 지나치게 강해서 나타난 문제이다"],"a":0,"e":"공공재는 비배제성 때문에 무임승차가 생겨 시장에서 적게 공급되며, 이는 시장 실패이다.","u":0},{"q":"다음 설명에 해당하는 개념은?","p":"생산 규모가 클수록 평균 비용이 낮아져 한 기업이 시장 전체를 공급하는 것이 효율적인 경우로, 전력·상수도 사업 등이 해당한다.","c":["자연 독점","담합","정부 실패","긍정적 외부 효과","완전 경쟁"],"a":0,"e":"규모의 경제 때문에 한 기업이 공급하는 것이 효율적인 독점을 자연 독점이라 한다.","u":0},{"q":"(가), (나)에 나타난 입장을 바르게 짝지은 것은?","p":"(가) 정부가 대규모 공공사업을 벌여 일자리를 만들고 유효 수요를 늘린다.<br>(나) 정부가 공기업을 민간에 매각하고 각종 규제를 완화한다.","c":["(가) 신자유주의, (나) 수정 자본주의","(가) 수정 자본주의, (나) 신자유주의","(가) 상업 자본주의, (나) 산업 자본주의","(가) 산업 자본주의, (나) 신자유주의","(가) 수정 자본주의, (나) 상업 자본주의"],"a":1,"e":"정부의 적극적 개입은 수정 자본주의, 민영화와 규제 완화는 신자유주의의 정책이다.","u":0},{"q":"다른 조건이 같을 때 어떤 상품의 수요와 공급이 모두 증가하면 균형 거래량과 균형 가격의 변화로 옳은 것은?","c":["균형 거래량은 증가하고 균형 가격은 수요·공급의 증가 폭에 따라 달라진다","균형 거래량은 감소하고 균형 가격은 상승한다","균형 거래량은 증가하고 균형 가격은 반드시 상승한다","균형 거래량은 증가하고 균형 가격은 반드시 하락한다","균형 거래량과 균형 가격 모두 변하지 않는다"],"a":0,"e":"수요와 공급이 모두 증가하면 거래량은 늘지만 가격은 어느 쪽이 더 크게 늘었는지에 따라 오르거나 내릴 수 있다.","u":0},{"q":"다음 사례에 나타난 가격의 기능은?","p":"배추가 풍작이어서 가격이 크게 하락하자 일부 농가가 다음 해에 배추 대신 가격이 오른 무를 재배하였다.","c":["생산자에게 무엇을 생산할지 알려 주는 신호 역할","정부가 생산량을 직접 할당하는 역할","소득을 평등하게 분배하는 역할","독점 이윤을 보장하는 역할","소비자 선호를 제한하는 역할"],"a":0,"e":"가격 변화는 생산자에게 자원을 어디에 쓸지 알려 주는 신호로 작용한다.","u":0},{"q":"이 변화로 불리해지는 사람은? (다른 조건은 일정)","p":"원/달러 환율이 1,100원에서 1,300원으로 상승하였다.","c":["미국에 유학 중인 자녀에게 매달 1,000달러를 송금하는 부모","미국에 자동차를 수출하는 국내 기업","달러로 받은 임금을 원화로 바꾸는 해외 파견 근로자","한국을 여행하려는 미국인 관광객","달러 표시 자산을 보유한 국내 투자자"],"a":0,"e":"환율 상승으로 같은 달러를 사는 데 더 많은 원화가 들어 달러를 송금하는 부모의 부담이 커진다.","u":1},{"q":"표에 대한 설명으로 옳은 것은?","p":"노동자 1명이 하루 동안 생산할 수 있는 양<br>A국: 자동차 2대 또는 TV 6대<br>B국: 자동차 3대 또는 TV 6대","c":["A국은 TV, B국은 자동차에 비교 우위가 있다","A국은 자동차, B국은 TV에 비교 우위가 있다","A국은 두 재화 모두에 비교 우위가 있다","B국은 두 재화 모두에 비교 우위가 있다","두 나라 모두 비교 우위가 없다"],"a":0,"e":"자동차 1대의 기회비용은 A국 TV 3대, B국 TV 2대이므로 B국이 자동차에, A국이 TV에 비교 우위가 있다.","u":1},{"q":"명목 이자율이 연 4.5 %이고 물가 상승률이 연 2 %일 때 실질 이자율은?","c":["2.5 %","6.5 %","9 %","2.25 %","-2.5 %"],"a":0,"e":"실질 이자율 ≈ 명목 이자율 - 물가 상승률 = 4.5 - 2 = 2.5 %이다.","u":1},{"q":"병에게 해 줄 조언으로 가장 적절한 것은?","p":"병은 월 소득이 200만 원인데 신용 카드 할부와 현금 서비스로 한 달에 300만 원씩 쓰고 있다.","c":["소득 범위 안에서 소비 계획을 세우고 상환 능력에 맞게 신용을 사용한다","다른 카드로 돌려 막기를 하면서 지출을 유지한다","연체해도 신용에는 영향이 없으므로 걱정하지 않는다","대출을 더 받아 소비를 늘린다","신용 정보는 관리할 필요가 없다"],"a":0,"e":"신용은 갚을 수 있는 범위에서 계획적으로 쓰고 연체를 피해야 한다.","u":1},{"q":"갑, 을에게 적절한 금융 자산을 바르게 짝지은 것은?","p":"갑: 2년 뒤 낼 전세 보증금 마련을 위해 원금 손실을 피하고 싶다.<br>을: 30대로 장기간 여유 자금을 굴리며 어느 정도의 손실 위험은 감수할 수 있다.","c":["갑 - 정기 예금, 을 - 주식형 펀드","갑 - 주식형 펀드, 을 - 정기 예금","갑 - 주식, 을 - 요구불 예금","갑 - 주식형 펀드, 을 - 주식형 펀드","갑 - 투기성 파생 상품, 을 - 정기 예금"],"a":0,"e":"안전성을 중시하면 예금, 장기 여유 자금으로 수익성을 추구하면 주식형 펀드가 적절하다.","u":1},{"q":"주식과 채권에 대한 설명으로 옳은 것은?","c":["주식은 만기가 없고 배당과 시세 차익을 기대할 수 있으며, 채권은 정해진 이자와 만기 원금 상환이 약속된다","주식은 발행 기관에 돈을 빌려준 증서이고 채권은 기업 소유권의 일부이다","주식은 원금과 이자를 항상 보장한다","채권은 배당금만 지급하고 이자는 없다","주식과 채권은 모두 예금자 보호 제도의 대상이다"],"a":0,"e":"주식은 소유권 증서, 채권은 빌려준 돈의 증서로 성격이 다르며 둘 다 예금자 보호 대상이 아니다.","u":1},{"q":"이를 통해 알 수 있는 사회 보험의 특징으로 가장 적절한 것은?","p":"국민 건강 보험은 법에 따라 일정한 사람이 의무적으로 가입하고 소득 수준 등에 따라 보험료를 내며, 질병이 생기면 의료비를 지원받는다.","c":["국가가 가입을 의무화하여 위험을 사회 전체가 분담하는 제도이다","가입 여부를 개인이 자유롭게 정하는 민영 보험이다","수익 극대화를 위한 투자 상품이다","납부한 보험료만큼만 정확히 돌려받는다","국가가 개입하지 않는 시장 거래이다"],"a":0,"e":"사회 보험은 국가가 의무 가입으로 운영하여 질병·노후 등의 위험을 사회 전체가 분담한다.","u":1},{"q":"이 사례에서 침해된 노동자의 권리는?","p":"A 회사는 노동조합을 만들려는 직원 갑을 '조합 결성을 주도했다'는 이유로 해고하였다.","c":["단결권","단체 교섭권","단체 행동권","평등권","재산권"],"a":0,"e":"노동조합을 결성할 권리는 단결권이며, 이를 이유로 한 해고는 단결권을 침해한 것이다.","u":1},{"q":"B 씨에게서 확인할 수 있는 것으로 가장 적절한 것은?","p":"B 씨는 버려지는 폐플라스틱으로 가방을 만드는 사업을 시작하였다. 실패 가능성이 있었지만 새로운 시장을 개척하였고, 수익의 일부를 환경 단체에 기부한다.","c":["위험을 감수한 혁신적 도전(기업가 정신)과 사회적 책임의 실천","정부 규제를 피하기 위한 담합","독점 이윤의 극대화","소비자 주권의 침해","시장 실패를 의도적으로 일으키는 행위"],"a":0,"e":"새로운 사업에 도전하는 기업가 정신과 기부를 통한 사회적 책임이 함께 나타난다.","u":1},{"q":"정부가 수입 오렌지에 부과하는 관세율을 크게 높였을 때 나타날 수 있는 현상으로 가장 적절한 것은? (다른 조건은 일정)","c":["수입 오렌지의 국내 가격이 오르고 국내 오렌지 생산자에게 유리해진다","수입 오렌지의 국내 가격이 내려가 소비자 선택의 폭이 넓어진다","국내 오렌지 생산자의 경쟁 압력이 커진다","수입 오렌지 소비량이 늘어난다","수입 대금으로 나가는 외화가 늘어난다"],"a":0,"e":"관세는 수입품의 국내 가격을 높여 수입을 줄이고 국내 생산자를 보호한다.","u":1},{"q":"이 사례에 담긴 지속가능발전의 관점으로 가장 적절한 것은?","p":"어촌 마을은 바다의 어족 자원이 다시 늘어나는 속도를 넘지 않도록 연간 어획량 한도를 정해 지키고 있다.","c":["현재의 경제 활동과 미래 세대의 자원 이용 가능성을 함께 고려한다","단기 이윤을 위해 최대한 많이 잡는다","환경 보전을 위해 경제 활동을 전면 중단한다","미래 세대의 필요는 고려하지 않는다","자원은 무한하다고 보고 소비를 늘린다"],"a":0,"e":"지속가능발전은 현재 세대의 필요를 충족하면서 미래 세대의 이용 가능성도 해치지 않는 것이다.","u":1},{"q":"공급이 감소하고 수요는 변하지 않을 때 균형 가격과 균형 거래량의 변화는?","c":["가격 상승, 거래량 감소","가격 하락, 거래량 증가","가격 상승, 거래량 증가","가격 하락, 거래량 감소","모두 변함없다"],"a":0,"e":"공급 곡선이 왼쪽으로 이동하여 가격은 오르고 거래량은 줄어든다.","u":0},{"q":"다른 조건이 같을 때 어떤 정상재의 수요를 증가시키는 요인으로 옳은 것은?","c":["소비자 소득 증가","생산 기술 발전","원자재 가격 하락","공급자 수 증가","생산 비용 감소"],"a":0,"e":"소득 증가는 수요 요인이고 나머지는 공급 요인이다.","u":1},{"q":"1,000만 원을 연 이자율 3%인 예금에 1년간 맡기면 받는 이자는? (단리)","c":["30만 원","3만 원","300만 원","3,000만 원","10만 원"],"a":0,"e":"1,000만 원 × 0.03 = 30만 원이다.","u":1},{"q":"명목 임금이 4% 오르고 물가가 5% 올랐을 때 실질 임금의 변화는?","c":["약 1% 하락","약 1% 상승","약 9% 상승","변화 없음","약 5% 하락"],"a":0,"e":"실질 임금 상승률 ≈ 명목 임금 상승률 - 물가 상승률 = 4% - 5% = -1%이다.","u":1},{"q":"독과점으로 소비자 피해가 커질 때 정부의 대응으로 옳은 것은?","c":["독과점 규제와 공정 거래 질서 유지","가격 담합 허용","수입 전면 금지","시장 개입 중단","기업 합병 의무화"],"a":0,"e":"정부는 공정 거래법 등으로 독과점의 폐해를 막는다.","u":1},{"q":"보험의 목적으로 가장 적절한 것은?","c":["예상치 못한 사고·질병 등으로 인한 경제적 손실에 대비한다","주식 시세 차익을 얻는다","환율 차익을 얻는다","물가 상승으로 수익을 얻는다","임대 소득을 얻는다"],"a":0,"e":"보험은 위험에 대비해 경제적 손실을 줄이는 금융 상품이다.","u":1}],"hard":[{"q":"위 표에 대한 설명으로 옳은 것은?","p":"노동자 1명이 하루에 생산하는 양<br>A국: 쌀 6, 옷 3 ／ B국: 쌀 2, 옷 2","c":["A국은 쌀, B국은 옷에 비교 우위가 있다","A국은 옷, B국은 쌀에 비교 우위가 있다","B국은 두 재화 모두 절대 우위가 있다","A국은 두 재화 모두 비교 우위가 있다","두 나라 모두 무역으로 이익을 얻을 수 없다"],"a":0,"e":"A국은 쌀 1의 기회비용이 옷 0.5, B국은 옷 1. 옷 1의 기회비용은 A국이 쌀 2, B국이 쌀 1이므로 A국은 쌀, B국은 옷에 비교 우위가 있다. 절대 우위는 A국이 둘 다 가진다.","u":1},{"q":"무역 시 각국이 특화해야 할 재화로 옳은 것은?","p":"1개를 생산하는 데 걸리는 시간<br>A국: 사과 1시간, 배 2시간 ／ B국: 사과 3시간, 배 4시간","c":["A국 - 사과, B국 - 배","A국 - 배, B국 - 사과","A국 - 두 재화 모두","B국 - 두 재화 모두","특화할 필요가 없다"],"a":0,"e":"사과 1개의 기회비용은 A국이 배 0.5개, B국이 배 0.75개이므로 A국은 사과에 비교 우위가 있고, B국은 배에 비교 우위가 있다.","u":1},{"q":"순편익(편익 - 총비용)이 가장 큰 합리적 선택은?","p":"(단위: 만 원)<br>A: 편익 100, 명시적 비용 30, 암묵적 비용 40<br>B: 편익 90, 명시적 비용 20, 암묵적 비용 30<br>C: 편익 60, 명시적 비용 10, 암묵적 비용 20","c":["A","B","C","A와 C","선택하지 않는다"],"a":1,"e":"총비용은 명시적 비용과 암묵적 비용의 합이다. 순편익은 A 30, B 40, C 30이므로 B를 선택한다.","u":0},{"q":"원/달러 환율이 1,100원에서 1,300원으로 상승할 때의 영향으로 옳은 것은?","c":["수출품의 가격 경쟁력이 높아져 수출에 유리하다","수입 원자재 가격이 하락한다","해외 여행 비용이 감소한다","외채 상환 부담이 감소한다","수입품 가격이 하락한다"],"a":0,"e":"환율 상승은 원화 가치 하락으로 수출에는 유리하고 수입·해외 여행·외채 상환에는 불리하다.","u":1},{"q":"(가)~(라)를 자본주의 발달 순서대로 바르게 나열한 것은?","p":"(가) 대공황과 뉴딜 정책<br>(나) 지리상 발견과 중상주의<br>(다) 석유 파동과 스태그플레이션<br>(라) 산업 혁명과 자유방임","c":["(라)-(나)-(가)-(다)","(나)-(가)-(라)-(다)","(나)-(라)-(가)-(다)","(나)-(라)-(다)-(가)","(가)-(나)-(라)-(다)"],"a":2,"e":"중상주의(15~18세기) → 산업 혁명(18세기 후반) → 대공황·뉴딜(1930년대) → 석유 파동 이후 신자유주의(1970년대) 순이다.","u":0},{"q":"정부 실패의 사례로 옳은 것은?","c":["정부의 지나친 규제나 개입이 오히려 비효율과 부작용을 낳는 경우","공해와 같은 외부 효과의 발생","독과점 기업의 시장 지배","정보의 비대칭","공공재의 과소 공급"],"a":0,"e":"나머지는 모두 시장 실패의 사례이다.","u":0},{"q":"다음 무역 방식이 지속가능발전에 기여하는 방법으로 옳은 것은?","p":"커피 농가에 정당한 가격을 지급하고, 노동 환경과 환경 보호 기준을 지키도록 하는 무역","c":["소비자가 윤리적 소비를 실천하여 생산자의 생계와 환경을 함께 지키게 한다","수입 관세를 대폭 인상한다","생산자의 이익을 줄이고 가격을 낮춘다","환경 규제를 폐지한다","대기업만 이익을 얻게 한다"],"a":0,"e":"공정 무역은 생산자의 소득과 인권, 환경을 보호하여 지속가능발전에 기여한다.","u":1},{"q":"생애 주기에 따른 금융 설계로 옳은 것은?","p":"소득은 중년기에 가장 많고 청년기와 노년기에는 소비가 소득보다 많은 경향이 있다.","c":["소득이 많은 시기에 노후와 위험에 대비해 저축·보험 등을 준비한다","소득이 높은 시기에는 저축을 하지 않는다","노후 준비는 은퇴 후에 시작한다","소비만 늘려 생활 수준을 높인다","보험은 필요하지 않다"],"a":0,"e":"생애 주기별 소득과 지출 차이를 고려해 미리 저축과 보험으로 대비해야 한다.","u":1},{"q":"위 상황에 대한 설명으로 옳은 것은?","p":"예금 금리는 연 2%, 물가 상승률은 연 4%이다.","c":["실질 이자율이 -2%이므로 화폐의 실질 가치가 감소한다","실질 이자율이 6%이다","명목 이자율이 -2%이다","실질 이자율은 2%이다","물가는 이자율과 무관하다"],"a":0,"e":"실질 이자율은 2% - 4% = -2%로, 저축의 실질 구매력이 줄어든다.","u":1},{"q":"분산 투자에 대한 설명으로 옳지 않은 것은?","c":["서로 다른 성격의 자산에 나누어 투자한다","위험을 줄이는 효과가 있다","수익이 항상 보장된다","투자 대상을 여러 개로 나눈다","한 곳에 모든 자금을 투자하는 것보다 위험이 작다"],"a":2,"e":"분산 투자는 위험을 줄일 뿐 수익을 보장하지는 않는다.","u":1},{"q":"자유 무역 확대에 따른 문제로 옳은 것은?","c":["경쟁력이 낮은 국내 산업이 피해를 입어 실업과 소득 격차가 생길 수 있다","모든 국가가 똑같은 이익을 얻는다","소비자의 선택 폭이 줄어든다","수입 상품의 가격이 반드시 상승한다","국제 분업이 사라진다"],"a":0,"e":"무역은 이익이 크지만 경쟁력이 낮은 산업의 구조 조정과 피해 계층 보호가 과제가 된다.","u":1},{"q":"시장 참여자와 그 역할을 바르게 연결하지 않은 것은?","c":["소비자 - 윤리적 소비 실천","기업 - 사회적 책임 이행","노동자 - 노동권 보장 요구","정부 - 시장 실패 보완과 공정한 거래 질서 유지","정부 - 이윤 극대화를 위해 독점을 적극 허용"],"a":4,"e":"정부는 독과점을 규제하여 공정한 경쟁 질서를 유지하는 역할을 한다.","u":1},{"q":"시장 가격이 균형 가격보다 높을 때 나타나는 현상으로 옳은 것은?","c":["초과 공급이 발생하여 가격이 하락하려는 압력이 생긴다","초과 수요가 발생하여 가격이 상승한다","수요량과 공급량이 일치한다","거래가 중단된다","공급량이 0이 된다"],"a":0,"e":"가격이 균형 가격보다 높으면 공급량이 수요량보다 많아 가격이 내려가 균형으로 돌아간다.","u":0},{"q":"시장 가격이 균형 가격보다 낮을 때 나타나는 현상으로 옳은 것은?","c":["초과 수요가 발생하여 가격이 상승하려는 압력이 생긴다","초과 공급이 발생하여 가격이 하락한다","수요량과 공급량이 일치한다","수요가 0이 된다","공급이 무한해진다"],"a":0,"e":"가격이 균형 가격보다 낮으면 수요량이 공급량보다 많아 가격이 오르게 된다.","u":0},{"q":"인플레이션으로 일반적으로 유리해지는 경제 주체는?","c":["돈을 빌린 채무자","돈을 빌려준 채권자","현금만 보유한 사람","고정 급여 생활자","저금리 예금 가입자"],"a":0,"e":"물가가 오르면 화폐 가치가 떨어져 빚의 실질 부담이 줄어 채무자에게 유리하다.","u":1},{"q":"원/달러 환율이 하락(원화 가치 상승)할 때의 영향으로 옳은 것은?","c":["수입 원자재 가격이 낮아지고 해외 여행·유학 비용 부담이 줄어든다","수출품의 가격 경쟁력이 높아진다","수입 물가가 오른다","외채 상환 부담이 늘어난다","해외 여행 비용이 증가한다"],"a":0,"e":"환율 하락은 수입, 해외 여행, 외채 상환에 유리하고 수출에는 불리하다.","u":1},{"q":"자유 무역 협정(FTA)의 영향으로 옳지 않은 것은?","c":["관세 인하로 수입품 가격이 낮아질 수 있다","소비자의 선택 폭이 넓어질 수 있다","경쟁력이 낮은 산업은 피해를 볼 수 있다","모든 산업이 동일하게 이익을 얻는다","수출 시장이 확대될 수 있다"],"a":3,"e":"FTA는 산업별로 이익과 손실이 다르게 나타나며 피해 산업에 대한 보완책이 필요하다.","u":1},{"q":"경제 주체와 역할의 연결이 옳지 않은 것은?","c":["가계 - 노동과 자본을 제공하고 소득을 얻어 소비한다","기업 - 상품을 생산하여 이윤을 추구한다","정부 - 조세를 거두어 공공재를 공급한다","정부 - 시장 실패를 보완하는 정책을 시행한다","가계 - 생산 활동을 통해 이윤을 추구하는 것이 주된 역할이다"],"a":4,"e":"이윤을 추구하며 생산하는 주체는 기업이고, 가계는 소비와 생산 요소 제공의 주체이다.","u":1},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 희소성은 선택의 문제를 발생시킨다.<br>ㄴ. 기회비용은 선택으로 포기한 대안 중 가장 가치가 큰 것의 가치이다.<br>ㄷ. 매몰 비용은 합리적 선택을 할 때 반드시 비용에 포함해야 한다.<br>ㄹ. 경제적으로 풍요로운 사회에서는 희소성이 나타나지 않는다.","c":["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"a":2,"e":"ㄷ 매몰 비용은 고려하지 않고, ㄹ 희소성은 모든 사회에서 나타난다.","u":0},{"q":"표는 어떤 상품의 가격별 수요량과 공급량이다. 분석으로 옳은 것은?","p":"가격 1,000원: 수요량 90개, 공급량 10개<br>가격 2,000원: 수요량 70개, 공급량 30개<br>가격 3,000원: 수요량 50개, 공급량 50개<br>가격 4,000원: 수요량 30개, 공급량 70개<br>가격 5,000원: 수요량 10개, 공급량 90개","c":["균형 가격은 3,000원이며 가격이 4,000원일 때 초과 공급이 40개이다","균형 가격은 3,000원이며 가격이 4,000원일 때 초과 수요가 40개이다","균형 가격은 3,000원이며 가격이 4,000원일 때 초과 공급이 20개이다","균형 가격은 4,000원이며 가격이 2,000원일 때 초과 수요가 40개이다","균형 가격은 5,000원이며 가격이 2,000원일 때 초과 공급이 40개이다"],"a":0,"e":"3,000원에서 수요량과 공급량이 같고, 4,000원에서는 공급량 70개가 수요량 30개보다 40개 많다.","u":0},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"정부가 균형 가격보다 낮은 최고 가격을 정하고 이를 지키도록 강제하였다.<br>ㄱ. 초과 수요가 발생한다.<br>ㄴ. 암시장이 형성될 수 있다.<br>ㄷ. 공급량이 균형 거래량보다 늘어난다.<br>ㄹ. 원하는 소비자 모두가 최고 가격에 구입할 수 있다.","c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":0,"e":"최고 가격이 균형 가격보다 낮으면 공급량은 줄고 수요량은 늘어 초과 수요와 암시장이 생기므로 ㄷ, ㄹ은 옳지 않다.","u":0},{"q":"최저 임금이 균형 임금보다 높게 정해졌을 때에 대한 설명으로 옳지 않은 것은? (다른 조건은 일정)","c":["노동 수요량이 노동 공급량보다 많아져 구인난이 심해진다","노동 공급량이 노동 수요량보다 많아져 실업이 발생할 수 있다","일자리를 유지한 노동자의 임금은 균형 임금보다 높아진다","노동자의 소득 보장 효과와 고용 감소 우려가 함께 논의된다","노동 시장에서 가격 하한제의 한 사례이다"],"a":0,"e":"균형 임금보다 높은 최저 임금은 노동 공급량을 늘리고 수요량을 줄이므로 초과 공급(실업)이 생긴다.","u":0},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 과수원 주변의 양봉은 긍정적 외부 효과의 사례이다.<br>ㄴ. 공장 폐수로 인한 하천 오염은 부정적 외부 효과의 사례이다.<br>ㄷ. 부정적 외부 효과가 있는 재화는 사회적 최적 수준보다 과소 생산되는 경향이 있다.<br>ㄹ. 긍정적 외부 효과가 있는 재화는 보조금 지급으로 생산·소비를 늘리도록 유도할 수 있다.","c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":4,"e":"ㄷ 부정적 외부 효과가 있는 재화는 사회적 최적 수준보다 과다 생산되는 경향이 있다.","u":0},{"q":"공공재에 대한 설명으로 옳지 않은 것은?","c":["대가를 내지 않은 사람도 이용을 막기 어렵다","한 사람이 소비해도 다른 사람이 쓸 수 있는 양이 줄지 않는다","무임승차 문제 때문에 시장에서 적정 수준보다 적게 공급되기 쉽다","정부가 조세로 재원을 마련해 공급하는 경우가 많다","대가를 지불한 사람만 이용할 수 있도록 소비를 쉽게 배제할 수 있다"],"a":4,"e":"공공재는 비배제성을 지니므로 대가를 낸 사람만 이용하게 배제하기 어렵다.","u":0},{"q":"정부 실패의 사례만을 고른 것은?","p":"ㄱ. 정부가 특정 이익 집단의 로비를 받아 보조금을 비효율적으로 배분하였다.<br>ㄴ. 소수의 기업이 가격 인상에 합의하여 소비자가 피해를 입었다.<br>ㄷ. 과도한 규제로 신규 기업의 시장 진입이 어려워져 경쟁이 약해졌다.<br>ㄹ. 마을 공원의 관리 비용을 아무도 부담하려 하지 않아 공원이 방치되었다.","c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":1,"e":"ㄱ, ㄷ은 정부 개입이 낳은 비효율(정부 실패)이고, ㄴ은 담합, ㄹ은 공공재의 무임승차로 시장 실패이다.","u":0},{"q":"(가)~(라)를 시간 순서대로 바르게 나열한 것은?","p":"(가) 영국과 미국에서 규제 완화와 공기업 민영화를 추진하는 정부가 등장하였다.<br>(나) 대공황 이후 케인스 이론에 따라 정부가 재정 지출을 늘려 유효 수요를 창출하였다.<br>(다) 증기 기관과 방적기의 발명으로 공장제 기계 공업이 확산되었다.<br>(라) 대항해 시대에 상인들이 해외 무역으로 부를 축적하였다.","c":["(다)-(라)-(나)-(가)","(라)-(나)-(다)-(가)","(나)-(다)-(라)-(가)","(라)-(다)-(나)-(가)","(라)-(다)-(가)-(나)"],"a":3,"e":"대항해 시대(상업) → 산업 혁명(산업) → 대공황 이후 수정 자본주의 → 1970~80년대 신자유주의 순이다.","u":0},{"q":"다음 표와 같은 시장에서 소비자 선호가 높아져 모든 가격에서 수요량이 40개씩 증가하였다. 새로운 균형 가격과 균형 거래량은?","p":"가격 1,000원: 수요량 90개, 공급량 10개<br>가격 2,000원: 수요량 70개, 공급량 30개<br>가격 3,000원: 수요량 50개, 공급량 50개<br>가격 4,000원: 수요량 30개, 공급량 70개<br>가격 5,000원: 수요량 10개, 공급량 90개","c":["4,000원, 70개","3,000원, 50개","3,000원, 70개","4,000원, 50개","5,000원, 90개"],"a":0,"e":"수요량이 40개씩 늘면 4,000원에서 수요량 70개, 공급량 70개로 일치한다.","u":0},{"q":"어떤 상품 시장에서 균형 가격은 상승하고 균형 거래량은 감소하였다. 다른 조건이 같을 때 이러한 변화의 원인으로 가장 적절한 것은?","c":["생산에 필요한 원자재 가격의 상승","소비자 소득의 증가(정상재)","대체재 가격의 상승","생산 기술의 발전","공급자 수의 증가"],"a":0,"e":"가격 상승·거래량 감소는 공급 감소의 결과이며, 원자재 가격 상승이 공급을 줄인다.","u":0},{"q":"문제 상황과 정부 대응의 연결로 옳지 않은 것은?","c":["부정적 외부 효과 - 환경 부담금 부과","긍정적 외부 효과 - 보조금 지급","공공재의 과소 공급 - 정부가 조세로 직접 공급","독과점의 폐해 - 공정 거래 법규에 따른 감독과 시정","정부 실패 - 시장 개입을 무조건 확대하여 해결"],"a":4,"e":"정부 실패는 정부 개입이 낳은 비효율이므로 개입을 무조건 확대하는 것은 해결책이 아니다.","u":0},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 예금은 일반적으로 안전성이 높지만 수익성은 상대적으로 낮다.<br>ㄴ. 채권은 만기 전에 매각하여 시세 차익을 얻을 수도 있다.<br>ㄷ. 주식은 배당과 시세 차익을 기대할 수 있고 원금이 보장된다.<br>ㄹ. 펀드는 전문가가 운용하므로 원금 손실 가능성이 없다.","c":["ㄱ, ㄷ","ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"a":1,"e":"ㄷ 주식은 원금이 보장되지 않고, ㄹ 펀드도 원금 손실 가능성이 있다.","u":1},{"q":"표의 A~C에 해당하는 자산으로 가장 적절한 것은?","p":"자산 / 안전성 / 수익성 / 유동성<br>A / 높음 / 낮음 / 높음<br>B / 낮음 / 높음 / 높음<br>C / 보통 / 보통 / 낮음","c":["A - 예금, B - 주식, C - 부동산","A - 주식, B - 예금, C - 부동산","A - 예금, B - 부동산, C - 주식","A - 부동산, B - 예금, C - 주식","A - 주식, B - 부동산, C - 예금"],"a":0,"e":"안전성과 유동성이 높고 수익성이 낮은 A는 예금, 수익성과 유동성이 높고 안전성이 낮은 B는 주식, 유동성이 낮은 C는 부동산이다.","u":1},{"q":"환율 변화에 따른 A 기업의 원화 수입 변화는?","p":"A 기업은 대당 2만 달러인 자동차를 100대 수출하였다. 수출 대금 전액을 원화로 바꾸며, 환율은 1달러당 1,100원에서 1,300원으로 변하였다.","c":["4억 원 증가","4억 원 감소","2억 원 증가","40억 원 증가","4,000만 원 증가"],"a":0,"e":"수출액은 200만 달러이므로 2,000,000 × (1,300 - 1,100) = 4억 원 증가한다.","u":1},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"원/엔 환율이 100엔당 900원에서 1,000원으로 변하였다(다른 조건은 일정).<br>ㄱ. 한국인의 일본 여행 경비가 원화 기준으로 증가한다.<br>ㄴ. 일본산 수입품의 원화 가격이 상승한다.<br>ㄷ. 일본인의 한국 여행 경비가 엔화 기준으로 증가한다.<br>ㄹ. 한국의 대일본 수출품의 엔화 표시 가격이 하락할 수 있다.","c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ"],"a":3,"e":"엔화 가치가 오르고 원화 가치는 내렸으므로 ㄷ은 반대로 일본인의 한국 여행 경비가 엔화 기준으로 감소한다.","u":1},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"1단위 생산에 필요한 노동 시간<br>A국: 반도체 2시간, 선박 6시간<br>B국: 반도체 3시간, 선박 4시간<br>ㄱ. A국의 반도체 1단위 생산의 기회비용은 선박 1/3단위이다.<br>ㄴ. B국의 반도체 1단위 생산의 기회비용은 선박 3/4단위이다.<br>ㄷ. A국은 선박, B국은 반도체에 비교 우위가 있다.<br>ㄹ. 두 나라가 교역하면 어느 나라도 이익을 얻을 수 없다.","c":["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":2,"e":"반도체의 기회비용이 A국 1/3, B국 3/4이므로 A국은 반도체, B국은 선박에 비교 우위가 있고 특화·교역으로 양국이 이익을 얻을 수 있다.","u":1},{"q":"인플레이션에 대한 설명으로 옳지 않은 것은?","c":["물가가 지속적으로 상승하는 현상이다","화폐의 구매력이 떨어진다","고정 이자를 받는 채권 보유자의 실질 수익이 줄어들 수 있다","실물 자산의 가치는 상대적으로 오를 수 있다","화폐의 가치가 올라 현금 저축이 항상 유리해진다"],"a":4,"e":"인플레이션에서는 화폐 가치가 떨어져 현금 저축의 실질 가치가 줄어든다.","u":1},{"q":"실질 이자율에 대한 설명으로 옳은 것은? (실질 이자율 = 명목 이자율 - 물가 상승률)","p":"(단위: %)<br>갑: 명목 이자율 5, 물가 상승률 2<br>을: 명목 이자율 3, 물가 상승률 0<br>병: 명목 이자율 4, 물가 상승률 3","c":["갑과 을의 실질 이자율은 같다","병의 실질 이자율이 가장 높다","을의 실질 이자율이 갑보다 높다","갑의 실질 이자율이 병보다 낮다","병의 실질 이자율은 2 %이다"],"a":0,"e":"실질 이자율은 갑 3 %, 을 3 %, 병 1 %이므로 갑과 을이 같다.","u":1},{"q":"윤리적 소비에 해당하는 것만 고른 것은?","p":"ㄱ. 이동 거리가 짧은 지역 농산물(로컬 푸드)을 구입하여 환경 부담을 줄인다.<br>ㄴ. 노동 착취가 알려진 기업의 제품을 구매하지 않는다.<br>ㄷ. 유행에 맞춰 멀쩡한 옷을 자주 버리고 새로 산다.<br>ㄹ. 환경에 끼치는 영향과 관계없이 가격이 가장 낮은 상품만 구입한다.","c":["ㄱ, ㄷ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄹ","ㄱ, ㄴ"],"a":4,"e":"윤리적 소비는 환경·인권·공정성을 고려하는 소비이므로 ㄱ, ㄴ이 해당한다.","u":1},{"q":"기업의 사회적 책임에 대한 설명으로 옳지 않은 것은?","c":["법과 윤리를 지키며 공정하게 거래한다","환경 오염을 줄이기 위해 친환경 생산 방식을 도입한다","지역 사회에 이익의 일부를 환원하는 사회 공헌 활동을 한다","소비자에게 상품의 정보를 정확히 제공한다","사회적 책임은 법적 의무만을 뜻하므로 자발적 사회 공헌은 포함되지 않는다"],"a":4,"e":"기업의 사회적 책임은 법적 의무를 넘어 자발적 사회 공헌과 윤리 경영까지 포함한다.","u":1},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 단결권은 노동자가 노동조합을 결성하고 가입할 수 있는 권리이다.<br>ㄴ. 단체 행동권은 노동자가 사용자와 근로 조건을 협상할 수 있는 권리이다.<br>ㄷ. 단체 교섭권은 파업 등 쟁의 행위를 할 수 있는 권리이다.<br>ㄹ. 최저 임금제는 국가가 임금의 최저 수준을 정해 노동자의 생활을 보호하는 제도이다.","c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":3,"e":"ㄴ은 단체 교섭권, ㄷ은 단체 행동권의 설명이다.","u":1},{"q":"관세 부과 후 가격만을 기준으로 할 때 옳은 것은?","p":"수입 사과 1상자의 수입 가격은 8만 원이고 국산 사과 1상자는 9만 원이다. 정부가 수입 사과에 25 %의 관세를 부과하였다. (운송비 등 다른 비용은 없다)","c":["수입 사과는 10만 원이 되어 국산 사과가 더 저렴하다","수입 사과는 10만 원이 되어 여전히 수입 사과가 더 저렴하다","수입 사과는 9만 원이 되어 가격이 같아진다","수입 사과는 8만 5천 원이 되어 수입 사과가 더 저렴하다","수입 사과는 11만 원이 되어 국산 사과가 더 저렴하다"],"a":0,"e":"8만 원 × 1.25 = 10만 원이므로 국산 사과(9만 원)가 더 저렴해진다.","u":1},{"q":"두 나라가 1단위를 생산하는 데 드는 노동 시간이 다음과 같을 때 옳은 것은?","p":"1단위 생산에 필요한 노동 시간<br>A국: 반도체 2, 자동차 4<br>B국: 반도체 3, 자동차 3","c":["A국 - 반도체, B국 - 자동차","A국 - 자동차, B국 - 반도체","A국 - 두 재화 모두","B국 - 두 재화 모두","무역으로 이익이 없다"],"a":0,"e":"반도체의 기회비용은 A국 자동차 0.5, B국 1이고 자동차의 기회비용은 A국 반도체 2, B국 1이므로 A국은 반도체, B국은 자동차에 비교 우위가 있다.","u":1},{"q":"순편익이 가장 큰 선택은? (총비용 = 명시적 비용 + 암묵적 비용)","p":"(단위: 만 원)<br>갑: 편익 80, 명시적 비용 25, 암묵적 비용 35<br>을: 편익 70, 명시적 비용 15, 암묵적 비용 25<br>병: 편익 50, 명시적 비용 10, 암묵적 비용 5","c":["갑","을","병","갑과 을","을과 병"],"a":2,"e":"순편익은 갑 80-25-35=20, 을 70-15-25=30, 병 50-10-5=35이므로 병이다.","u":0},{"q":"원/달러 환율이 1,200원에서 1,000원으로 하락했을 때의 영향으로 옳은 것은?","c":["미국 여행 비용이 감소한다","수출 기업의 가격 경쟁력이 높아진다","외채 상환 부담이 증가한다","수입 물가가 상승한다","달러 보유자에게 유리하다"],"a":0,"e":"환율 하락은 원화 가치 상승으로 수입·해외 여행에는 유리하고 수출에는 불리하다.","u":1},{"q":"시장 실패의 사례를 모두 고른 것은?","p":"ㄱ. 공해로 인한 피해<br>ㄴ. 독과점 기업의 높은 가격<br>ㄷ. 공공재의 과소 공급<br>ㄹ. 정부 규제로 인한 비효율","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄹ 정부의 지나친 규제로 인한 비효율은 정부 실패이다.","u":1},{"q":"원금 1,000만 원을 명목 이자율 6%, 물가 상승률 2%인 상황에서 1년간 예금했을 때 실질 이자 수익(구매력 증가분)은?","c":["40만 원","60만 원","20만 원","80만 원","100만 원"],"a":0,"e":"실질 이자율은 6% - 2% = 4%이므로 40만 원이다.","u":1},{"q":"국제 무역에 대한 설명으로 옳지 않은 것은?","c":["비교 우위에 따른 특화로 양국 모두 이익을 얻을 수 있다","관세는 수입품의 국내 가격을 높인다","FTA는 체결국 간 관세 등 무역 장벽을 낮춘다","보호 무역은 국내 산업 보호가 목적이다","절대 우위가 없는 나라는 무역으로 이익을 얻을 수 없다"],"a":4,"e":"절대 우위가 없어도 비교 우위가 있는 재화에 특화하면 무역으로 이익을 얻을 수 있다.","u":1}],"ultra":[{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 암묵적 비용은 화폐로 직접 지불하지 않아도 선택 때문에 포기한 가치이다.<br>ㄴ. 편익이 같다면 총비용이 더 작은 선택이 합리적이다.<br>ㄷ. 환불할 수 없는 계약금은 매몰 비용이므로 앞으로의 선택에서는 추가로 드는 비용과 편익만 비교한다.<br>ㄹ. 무료로 제공되는 서비스를 이용하는 선택에는 기회비용이 전혀 발생하지 않는다.","c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":3,"e":"ㄹ 무료 서비스도 이용하는 데 쓰는 시간 등 포기한 대안이 있으므로 기회비용이 발생한다.","u":0},{"q":"표와 같은 시장에서 생산 비용 상승으로 모든 가격에서 공급량이 40개씩 감소하였다(공급량은 0 미만이 될 수 없다). 균형 판매액(가격 × 거래량)의 변화로 옳은 것은?","p":"가격 1,000원: 수요량 100개, 공급량 20개<br>가격 2,000원: 수요량 80개, 공급량 40개<br>가격 3,000원: 수요량 60개, 공급량 60개<br>가격 4,000원: 수요량 40개, 공급량 80개<br>가격 5,000원: 수요량 20개, 공급량 100개","c":["20,000원 감소","20,000원 증가","40,000원 감소","변화 없음","10,000원 증가"],"a":0,"e":"기존 균형은 3,000원×60개=180,000원이고, 공급 감소 후 균형은 4,000원×40개=160,000원이므로 20,000원 감소한다.","u":0},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 공공재는 비배제성 때문에 무임승차가 나타나 시장에서 과소 공급되기 쉽다.<br>ㄴ. 긍정적 외부 효과가 있으면 사회적 편익이 사적 편익보다 크다.<br>ㄷ. 부정적 외부 효과가 있으면 사적 비용이 사회적 비용보다 크다.<br>ㄹ. 정부 실패는 시장 실패를 바로잡으려는 정부 개입이 오히려 비효율을 낳는 현상이다.","c":["ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":2,"e":"ㄷ 부정적 외부 효과가 있으면 사적 비용이 사회적 비용보다 작다.","u":0},{"q":"시장 경제와 가격 기능에 대한 설명으로 옳지 않은 것은?","c":["가격 상승은 생산자에게 공급을 늘리라는 신호가 될 수 있다","가격 상승은 소비자에게 해당 재화의 소비를 늘리라는 신호이다","가격은 희소한 자원이 어디에 쓰일지를 알려 주는 정보를 제공한다","시장 경제는 사유 재산권과 자유로운 경쟁을 바탕으로 가격 기능이 작동한다","가격 기능이 잘 작동하면 자원이 효율적으로 배분될 수 있다"],"a":1,"e":"가격 상승은 소비자에게 소비를 줄이라는 신호이다.","u":0},{"q":"자본주의의 발달에 대한 설명으로 옳지 않은 것은?","c":["상업 자본주의는 중상주의 아래 해외 무역과 상인의 자본 축적이 중심이었다","산업 자본주의는 산업 혁명으로 공장제 기계 공업이 발달하며 노동 문제와 빈부 격차가 나타났다","수정 자본주의는 대공황을 계기로 정부의 적극적인 시장 개입과 복지 확대를 강조하였다","신자유주의는 1970년대 이후 정부 실패 비판과 함께 규제 완화와 민영화를 강조하였다","신자유주의는 대공황 극복을 위해 정부의 재정 지출 확대를 강조하며 등장하였다"],"a":4,"e":"대공황 극복을 위해 정부의 재정 지출 확대를 강조한 것은 수정 자본주의이다.","u":0},{"q":"합리적 선택에서 오늘 놀이공원에 가는 선택의 순편익(편익 - 총비용)은?","p":"갑은 놀이공원 연간 이용권을 12만 원에 샀으며 환불할 수 없다. 오늘 놀이공원에 가면 5만 원어치의 만족을 얻고 교통비 1만 원이 든다. 같은 시간에 아르바이트를 하면 3만 원을 벌 수 있다.","c":["1만 원","-11만 원","2만 원","4만 원","-7만 원"],"a":0,"e":"12만 원은 매몰 비용이므로 제외하고 5 - (1 + 3) = 1만 원이다.","u":0},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 예금자 보호 제도는 금융 기관이 영업 정지나 파산을 할 때 일정 한도 안에서 예금을 보호한다.<br>ㄴ. 분산 투자는 자산 종류를 나누어 위험을 줄이는 방법이지만 수익을 보장하지는 않는다.<br>ㄷ. 정기 예금은 만기 전에 해지하면 약정 이자를 받지 못하는 등 불이익이 있어 요구불 예금보다 유동성이 낮다.<br>ㄹ. 채권은 발행 기관의 신용 위험이 없으므로 항상 원금이 보장된다.","c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":0,"e":"ㄹ 채권은 발행 기관이 부도나면 원금과 이자를 못 받을 수 있다.","u":1},{"q":"원금 5,000만 원을 명목 이자율 연 4 %로 1년간 예금하였고 같은 기간 물가 상승률이 연 6 %이다. 구매력을 기준으로 한 실질 손익을 근사하여 구하면?","c":["약 100만 원 감소","약 100만 원 증가","약 200만 원 증가","약 300만 원 감소","약 500만 원 감소"],"a":0,"e":"실질 이자율은 4 - 6 = -2 %이므로 5,000만 원 × (-0.02) = 약 -100만 원이다.","u":1},{"q":"원/달러 환율이 1달러당 1,200원, 원/유로 환율이 1유로당 1,500원일 때 80유로를 달러로 바꾸면 몇 달러인가?","c":["100달러","64달러","96달러","125달러","150달러"],"a":0,"e":"80유로는 80 × 1,500 = 120,000원이고 이를 1,200원으로 나누면 100달러이다.","u":1},{"q":"두 나라가 쌀과 옷을 교환할 때 양국 모두 이익을 얻을 수 있는 교환 비율은?","p":"노동자 1명이 하루 동안 생산할 수 있는 양<br>A국: 쌀 4 kg 또는 옷 2벌<br>B국: 쌀 2 kg 또는 옷 2벌","c":["쌀 1 kg = 옷 0.8벌","쌀 1 kg = 옷 0.3벌","쌀 1 kg = 옷 0.4벌","쌀 1 kg = 옷 1.2벌","쌀 1 kg = 옷 1.5벌"],"a":0,"e":"쌀 1 kg의 기회비용이 A국 옷 0.5벌, B국 옷 1벌이므로 교환 비율이 0.5벌과 1벌 사이여야 양국이 모두 이익을 얻는다.","u":1},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 관세는 수입품의 국내 가격을 높여 국내 산업을 보호하는 효과가 있다.<br>ㄴ. 자유 무역 협정(FTA)은 협정 체결국 사이의 관세와 무역 장벽을 낮추거나 없애는 협정이다.<br>ㄷ. 자유 무역이 확대되면 모든 산업과 모든 노동자가 똑같이 이익을 얻는다.<br>ㄹ. 경쟁력이 낮은 산업이 피해를 볼 수 있어 정부가 지원책을 마련하기도 한다.","c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":4,"e":"ㄷ 무역 확대의 이익과 피해는 산업과 계층에 따라 다르게 나타난다.","u":1},{"q":"옳은 것만을 있는 대로 고른 것은?","p":"ㄱ. 1987년 '우리 공동의 미래' 보고서를 통해 지속가능발전 개념이 널리 알려졌다.<br>ㄴ. 지속가능발전목표(SDGs)는 선진국에만 적용된다.<br>ㄷ. 경제 성장, 사회 통합, 환경 보호의 조화를 추구한다.<br>ㄹ. 유엔은 2015년에 2030년까지 달성할 17개의 지속가능발전목표를 채택하였다.","c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":2,"e":"ㄴ 지속가능발전목표는 선진국과 개발 도상국 모두에 적용되는 보편적 목표이다.","u":1},{"q":"자본주의의 발달에 대한 설명으로 옳은 것을 모두 고른 것은?","p":"ㄱ. 상업 자본주의는 중상주의와 해외 무역을 바탕으로 하였다.<br>ㄴ. 산업 자본주의는 산업 혁명 이후 자유방임을 강조하였다.<br>ㄷ. 수정 자본주의는 대공황 이후 정부의 시장 개입을 강조하였다.<br>ㄹ. 신자유주의는 정부의 시장 개입 확대를 주장하였다.","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄹ 신자유주의는 정부의 시장 개입 축소와 규제 완화를 주장한다.","u":1},{"q":"합리적 선택에 대한 설명으로 옳지 않은 것은?","c":["기회비용에는 명시적 비용과 암묵적 비용이 포함된다","매몰 비용은 합리적 선택에서 고려하지 않는다","편익이 비용보다 클 때 선택한다","순편익은 편익에서 총비용을 뺀 값이다","암묵적 비용은 실제로 지출한 비용이다"],"a":4,"e":"암묵적 비용은 선택하지 않은 대안의 가치로, 실제로 지출하지 않은 비용이다.","u":0},{"q":"환율이 1달러 = 1,300원에서 1,100원으로 하락할 때 20달러짜리 상품을 수입하는 데 드는 원화 비용의 변화는?","c":["4,000원 감소","4,000원 증가","2,000원 감소","200원 감소","변화 없음"],"a":0,"e":"26,000원에서 22,000원으로 4,000원 감소한다.","u":1},{"q":"금융 자산에 대한 설명으로 옳은 것을 모두 고른 것은?","p":"ㄱ. 분산 투자는 위험을 줄이는 방법이다.<br>ㄴ. 주식은 시세 차익과 배당 수익을 기대할 수 있다.<br>ㄷ. 채권은 만기에 원금과 이자를 받으나 발행자의 신용 위험이 있다.<br>ㄹ. 예금은 수익성이 가장 높은 금융 자산이다.","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄹ 예금은 안전성이 높지만 수익성은 상대적으로 낮다.","u":1},{"q":"두 나라의 1단위 생산에 필요한 노동 시간이 다음과 같을 때 옳은 것은?","p":"A국: X재 6시간, Y재 3시간<br>B국: X재 5시간, Y재 10시간","c":["A국 - Y재, B국 - X재","A국 - X재, B국 - Y재","A국 - 두 재화 모두","B국 - 두 재화 모두","특화할 필요가 없다"],"a":0,"e":"X재의 기회비용은 A국 Y 2개, B국 Y 0.5개이므로 B국이 X재에, A국이 Y재에 비교 우위가 있다.","u":1},{"q":"지속가능발전에 대한 설명으로 옳지 않은 것은?","c":["경제 성장, 사회 통합, 환경 보전의 조화를 추구한다","미래 세대의 필요를 충족할 능력을 해치지 않는다","국제 사회는 지속가능발전 목표(SDGs)를 채택하였다","재생 에너지 확대는 지속가능발전에 기여한다","경제 성장을 위해 환경 훼손은 감수해야 한다"],"a":4,"e":"지속가능발전은 경제와 환경의 균형을 추구한다.","u":1}]};

  ta.forEach(function(w){if(tb.indexOf(w)>=0)c++;});
  return c*3+(tOf(a)===tOf(b)?2:0)+(a.u===b.u?1:0);
}

function similar(ids){
  var wq=shuf(ids).slice(0,10).map(function(id){return BYID[id];}),used={},out=[],round=0;
  var cand=ALL.filter(function(q){return ids.indexOf(q.id)<0;});
  while(out.length<10&&round<10&&cand.length){
    for(var i=0;i<wq.length&&out.length<10;i++){
      var w=wq[i],best=null,bs=-1;
      for(var j=0;j<cand.length;j++){var c=cand[j];if(used[c.id])continue;var sc=sim(w,c)+Math.random()*1.5;if(sc>bs){bs=sc;best=c;}}
      if(best){used[best.id]=1;out.push(best);}
    }
    round++;
  }
  return shuf(out);
}

  sv(PFX+"hqs_"+k,JSON.stringify(seen));
  return shuf(pick).map(function(x){return pool[x];});
}
function start(k){
  cur=LV.filter(function(l){return l.k===k;})[0];
  list=pickSet(k,curU);idx=0;ok=0;wrong=[];
  hideAll();$("play").hidden=false;
  $("lvn").textContent=(curU<0?"전체":UN[curU].no+"단원")+" · "+cur.n;
  show();
}
function show(){
  var q=list[idx];
  q._o=/^(ㄱ|ㄴ|ㄷ|ㄹ|\()/.test(q.c[0])&&/^(ㄱ|ㄴ|ㄷ|ㄹ|\()/.test(q.c[4])?[0,1,2,3,4]:shuf([0,1,2,3,4]);q._k=q._o.indexOf(q.a);
  $("cnt").textContent=(idx+1)+" / "+list.length;
  $("bf").style.width=(idx/list.length*100)+"%";
  $("nx").hidden=true;
  var h='<div class="qn">문제 '+(idx+1)+(q.s?' · 사료 분석':'')+'</div><p class="qt">'+q.q+'</p>';
  if(q.p||q.img)h+='<div class="box">'+(q.s?'<b style="color:var(--yellow)">[사료]</b><br>':'')+(q.p||'')+(q.img?'<div class="pic">'+q.img+'</div>':'')+'</div>';
  h+='<div class="ch">';
  q._o.forEach(function(oi,i){h+='<button class="c" data-i="'+i+'" type="button"><em>'+NUM[i]+'</em><span>'+q.c[oi]+'</span></button>';});
  h+='</div><div id="exp"></div>';
  $("qb").innerHTML=h;
  [].forEach.call($("qb").querySelectorAll(".c"),function(b){b.onclick=function(){pick(+b.getAttribute("data-i"));};});
  window.scrollTo(0,0);
}
function pick(i){
  var q=list[idx],bs=$("qb").querySelectorAll(".c"),good=i===q._k;
  [].forEach.call(bs,function(b,n){b.disabled=true;if(n===q._k)b.className="c ok";else if(n===i)b.className="c no";});
  if(good){ok++;delWrong(q.id);}else{wrong.push({q:q,my:i});if(!q.gen)addWrong(q);}
  $("exp").innerHTML='<div class="ex"><b>'+(good?"정답입니다! ⭕":"오답입니다. ❌ 정답은 "+NUM[q._k])+'</b>'+q.e+'</div>';
  $("bf").style.width=((idx+1)/list.length*100)+"%";
  $("nx").textContent=idx+1<list.length?"다음 문제 ▶":"결과 보기 ▶";
  $("nx").hidden=false;
}
$("nx").onclick=function(){idx++;if(idx<list.length)show();else finish();};
function finish(){
  hideAll();$("end").hidden=false;if(cur.sp==="i"){infTot+=list.length;infOk+=ok;}
  var sc=Math.round(ok/list.length*100),old=cur.sp?0:+(sv(bk(cur.k,curU))||0);
  if(!cur.sp&&sc>old)sv(bk(cur.k,curU),String(sc));
  var m=sc===100?"만점! "+(SB==="k"?"한국사":SB==="s"?"통합과학2":SB==="o"?"통합사회":"공통국어2")+" 완전 정복 🏆":sc>=75?"훌륭해요! 1등급 도전 가능 👍":sc>=50?"좋아요, 틀린 문제만 복습해 봐요 📖":"기본 개념부터 다시 다져 봐요 💪";
  var h='<h1>'+cur.n+' 결과</h1><div class="score">'+sc+'점</div><p class="sub">'+list.length+'문제 중 '+ok+'문제 정답 · '+m+(cur.sp==="i"?'<br>이번 접속 누적 '+infTot+'문제 중 '+infOk+'문제 정답':'')+'</p>';
  if(wrong.length){h+='<div class="rev"><b>이번 판 오답</b>';wrong.forEach(function(w){h+='<div class="q"><p class="qt" style="font-size:15px">'+w.q.q+'</p>'+(w.q.p||w.q.img?'<div class="box">'+(w.q.p||'')+(w.q.img?'<div class="pic">'+w.q.img+'</div>':'')+'</div>':'')+'<small>내 답: '+NUM[w.my]+' '+w.q.c[w.q._o[w.my]]+'<br>정답: '+NUM[w.q._k]+' '+w.q.c[w.q.a]+'<br>'+w.q.e+'</small></div>';});h+='</div>';}
  h+='<div class="row"><button class="btn o" id="re" type="button">'+(cur.sp==="v"?'새 변형 문제 풀기':cur.sp==="i"?'새 10문제 계속 풀기':'다시 풀기')+'</button>'+(cur.sp?'':'<button class="btn b" id="hm" type="button">난이도 선택</button>')+'<button class="btn" id="hu" type="button">단원 선택</button><button class="btn r" id="nb" type="button">📕 오답노트 ('+wrongList().length+')</button></div>';
  $("end").innerHTML=h;
  $("re").onclick=function(){if(cur.sp==="i")startInf();else if(cur.sp)startSp(cur.sp);else start(cur.k);};
  if($("hm"))$("hm").onclick=function(){lvPick(curU);};
  $("hu").onclick=home;$("nb").onclick=notes;
  window.scrollTo(0,0);
}
subjects();
try{parent.postMessage("gm-ready",location.origin);}catch(e){}
})();
</script>
