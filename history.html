<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한국사 퀴즈 · 대한민국의 발전</title>
<style>
:root{--navy:#0a0d2a;--card:#141b4d;--orange:#ff9d2e;--yellow:#ffe45c;--green:#32d546;--red:#ff5c6c;--text:#eaf0ff;--muted:#9fb0e6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(900px 500px at 50% -10%,rgba(120,80,255,.45),transparent 62%),linear-gradient(180deg,#140b44,#0a0d2a 60%,#05061a);
  background-attachment:fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
#app{max-width:760px;margin:0 auto;padding:18px 14px 40px;}
h1{font-size:24px;margin:6px 0 4px;text-align:center;}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.5;}
.btn{border:2px solid #0d5a1a;border-radius:12px;padding:12px 22px;font-weight:900;font-size:16px;color:#fff;cursor:pointer;font-family:inherit;
  background:linear-gradient(#8cff86,#2fcf42 48%,#1aa22c 52%,#38d94b);text-shadow:0 1px 0 #0d5a1a;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #0d5a1a;}
.btn.o{border-color:#7a3a05;color:#3a1a02;text-shadow:none;background:linear-gradient(#ffe08a,#ff9d2e);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 #7a3a05;}
.btn.b{border-color:#10236b;background:linear-gradient(#5c74ff,#2b3a8f);text-shadow:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 #10236b;}
.btn:active{transform:translateY(2px);}
.lv{display:flex;flex-direction:column;gap:12px;}
.lvc{border:3px solid #6b7bff;border-radius:16px;background:var(--card);padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;}
.lvc:hover{border-color:var(--yellow);}
.lvc b{font-size:19px;display:block;}.lvc span{color:var(--muted);font-size:13px;line-height:1.5;display:block;margin-top:4px;}
.lvc i{float:right;font-style:normal;font-size:12px;color:var(--yellow);font-weight:800;}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:800;}
.bar{flex:1;height:10px;border-radius:9px;background:#0a0d2a;border:2px solid #2b3a8f;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe45c,#ff9d2e);transition:width .25s;}
.q{background:var(--card);border:3px solid #2b3a8f;border-radius:16px;padding:16px;}
.qn{color:var(--orange);font-weight:900;font-size:14px;margin-bottom:6px;}
.qt{font-size:17px;font-weight:800;line-height:1.6;margin:0 0 10px;}
.box{border:2px solid #6b7bff;border-radius:10px;background:rgba(10,13,42,.7);padding:10px 12px;margin:0 0 12px;font-size:14.5px;line-height:1.75;color:#dfe7ff;}
.ch{display:flex;flex-direction:column;gap:8px;}
.c{display:flex;gap:10px;text-align:left;border:2px solid #3a4aa8;border-radius:12px;background:#0f1640;color:var(--text);padding:11px 12px;font-size:15px;line-height:1.5;cursor:pointer;font-family:inherit;}
.c:hover:not([disabled]){border-color:var(--yellow);}
.c em{font-style:normal;font-weight:900;color:var(--yellow);flex:none;}
.c.ok{border-color:var(--green);background:rgba(50,213,70,.16);}
.c.no{border-color:var(--red);background:rgba(255,92,108,.16);}
.c[disabled]{cursor:default;}
.ex{margin-top:12px;border-radius:12px;padding:11px 12px;font-size:14px;line-height:1.7;background:rgba(255,228,92,.08);border:2px dashed #b8a43a;}
.ex b{display:block;margin-bottom:3px;}
.nx{text-align:center;margin-top:14px;}
.res{text-align:center;}
.score{font-size:58px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 #3a1a02;margin:6px 0 0;}
.rev{margin:16px 0;text-align:left;}
.rev .q{margin-bottom:10px;padding:12px;}
.rev small{color:var(--muted);display:block;line-height:1.6;margin-top:4px;}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.pic{margin-top:10px;text-align:center;}.pic svg{display:block;margin:0 auto;width:100%;height:auto;border-radius:8px;}
.tag{display:inline-block;font-size:12px;font-weight:800;color:#3a1a02;background:var(--yellow);border-radius:8px;padding:1px 8px;margin-left:8px;}
.btn.s{padding:6px 14px;font-size:13px;border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 #10236b;}
.btn.r{border-color:#7a1020;background:linear-gradient(#ff9aa6,#d6283f);text-shadow:0 1px 0 #7a1020;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #7a1020;}
.nt .q{margin-bottom:10px;padding:12px;}
.nt small{color:var(--muted);display:block;line-height:1.6;margin-top:4px;}
.c.sel{border-color:var(--yellow);background:rgba(255,228,92,.16);}
.tm{font-size:22px;font-weight:900;color:var(--yellow);letter-spacing:1px;margin-left:auto;}
.gd{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:14px 0 4px;}
.gd button{border:2px solid #3a4aa8;border-radius:8px;background:#0f1640;color:var(--text);font-weight:800;font-size:13px;padding:6px 0;cursor:pointer;font-family:inherit;}
.gd button.dn{background:#2b3a8f;border-color:#6b7bff;}
.gd button.cu{border-color:var(--yellow);color:var(--yellow);}
.exn{display:flex;gap:10px;justify-content:space-between;margin-top:14px;}
[hidden]{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <section id="home">
    <h1 id="hh">한국사 퀴즈</h1>
    <p class="sub" id="hs">한국사 2 · 대한민국의 발전 ~ 오늘날의 대한민국<br>5지 선다 · 사료 분석 · 시기 순서 · ㄱㄴㄷㄹ 고르기 (한 판 10문항 · 푼 문제는 최대한 다시 안 나와요)</p>
    <div class="lv" id="lv"></div>
  </section>
  <section id="play" hidden>
    <div class="top"><span id="lvn"></span><div class="bar"><i id="bf"></i></div><span id="cnt"></span></div>
    <div class="q" id="qb"></div>
    <div class="nx"><button class="btn o" id="nx" hidden>다음 문제 &#9654;</button></div>
  </section>
  <section id="exam" hidden></section>
  <section id="notes" class="nt" hidden></section>
  <section id="end" class="res" hidden></section>
</div>
<script>
(function(){
"use strict";
var LV=[
 {k:"easy",n:"초보",d:"기본 개념과 핵심 사건을 묻는 문제예요. 한국사 근현대사 입문용!"},
 {k:"mid",n:"중수",d:"자료를 읽고 정부·시기를 판단하고, 사건 순서를 맞히는 시험 유형이에요."},
 {k:"hard",n:"고수",d:"헌법 개정, 사건 사이 시기, 옳지 않은 것 고르기 등 상위 유형에 사료(글·사진·그림·지도·그래프) 분석이 섞여 나와요."},
 {k:"ultra",n:"초고수",d:"세부 단어까지 따지는 ㄱㄴㄷㄹ, 순서 배열, 옳지 않은 것 문제예요. 시험 공부용이라 모의고사에는 나오지 않아요."}
];
var Q={
easy:[
{q:"광복 직후 38도선 이남 지역에 군정을 실시한 나라는?",c:["소련","미국","영국","중국","프랑스"],a:1,e:"광복 직후 38도선을 경계로 이북에는 소련군이, 이남에는 미군이 진주하여 군정을 실시하였다."},
{q:"1948년 제헌 국회에서 초대 대통령으로 선출된 인물은?",c:["김구","여운형","김규식","이승만","조봉암"],a:3,e:"5·10 총선거로 구성된 제헌 국회는 헌법을 제정하고 이승만을 초대 대통령으로 선출하였다. 이어 1948년 8월 15일 대한민국 정부 수립이 선포되었다."},
{q:"6·25 전쟁 중 국군과 유엔군이 서울을 되찾는 계기가 된 작전은?",c:["흥남 철수 작전","평양 탈환 작전","인천 상륙 작전","1·4 후퇴","낙동강 방어선 구축"],a:2,e:"1950년 9월 인천 상륙 작전으로 전세가 역전되어 서울을 수복하였다."},
{q:"4·19 혁명의 직접적인 계기가 된 사건은?",c:["5·16 군사 정변","3·15 부정 선거","10월 유신 선포","박종철 고문 치사 사건","12·12 사태"],a:1,e:"이승만 정부의 3·15 부정 선거에 항의하는 시위가 전국으로 확산되어 4·19 혁명이 일어났고, 이승만 대통령은 하야하였다."},
{q:"다음 중 박정희 정부 시기에 있었던 일은?",c:["금융 실명제 실시","서울 올림픽 개최","경부 고속 국도 개통","6·15 남북 공동 선언","IMF 구제 금융 신청"],a:2,e:"경부 고속 국도는 1970년 개통되었다. 금융 실명제(1993)는 김영삼, 서울 올림픽(1988)은 노태우, 6·15 선언(2000)은 김대중 정부 때의 일이다."},
{q:"1980년 5월, 신군부의 비상계엄 확대에 맞서 시민들이 일어난 민주화 운동이 전개된 지역은?",c:["부산","마산","대구","광주","제주"],a:3,e:"5·18 민주화 운동은 1980년 5월 광주에서 전개되었다."},
{q:"1987년 6월 민주 항쟁의 결과 이루어진 개헌의 핵심 내용은?",c:["대통령 간선제","대통령 직선제","내각 책임제","대통령 7년 단임제","국회 양원제"],a:1,e:"6월 민주 항쟁으로 6·29 민주화 선언이 발표되고, 대통령 직선제(5년 단임)로 헌법이 개정되었다."},
{q:"2000년 평양에서 남북 정상 회담을 열고 6·15 남북 공동 선언을 발표한 대통령은?",c:["노태우","김영삼","김대중","노무현","전두환"],a:2,e:"김대중 대통령은 햇볕 정책을 바탕으로 2000년 최초의 남북 정상 회담을 열고 6·15 남북 공동 선언을 발표하였다."}
],
mid:[
{q:"다음 결정이 발표된 이후 국내 상황으로 옳은 것은?",p:"한반도에 임시 민주 정부를 수립하기 위해 미·소 공동 위원회를 설치한다. … 최고 5년 기간의 4개국 신탁 통치 협정을 작성한다. (1945.12, 모스크바 3국 외상 회의)",c:["즉각적인 독립이 보장되어 좌우 갈등이 사라졌다","신탁 통치를 둘러싼 찬탁·반탁 논쟁으로 좌우익의 대립이 심해졌다","남북 협상으로 통일 정부가 수립되었다","미 군정이 종료되고 한국인이 정부를 세웠다","5·10 총선거가 곧바로 실시되었다"],a:1,e:"모스크바 3국 외상 회의 결정이 알려지자 신탁 통치 찬성(좌익)과 반대(우익)로 갈려 갈등이 심화되었다."},
{q:"이 정책의 결과로 옳은 것은?",p:"정부는 지주의 농지를 유상으로 사들여 소작농에게 유상으로 나누어 주고, 한 가구당 농지 소유 상한을 3정보로 제한하였다.",c:["지주 중심의 대토지 소유가 강화되었다","농지가 무상으로 분배되어 농민의 부담이 없었다","소작제가 부활하였다","소작 농민이 자영농으로 전환되어 지주제가 약화되었다","농민의 농지 소유가 금지되었다"],a:3,e:"농지 개혁법(1949 제정, 1950 시행)은 유상 매수·유상 분배 방식이었고, 소작 농민이 자영농이 되면서 지주제가 약화되었다."},
{q:"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?",p:"(가) 4·19 혁명　(나) 5·16 군사 정변<br>(다) 6·25 전쟁　(라) 유신 헌법 공포",c:["(가)-(나)-(다)-(라)","(다)-(가)-(나)-(라)","(다)-(나)-(가)-(라)","(가)-(다)-(나)-(라)","(다)-(가)-(라)-(나)"],a:1,e:"6·25 전쟁(1950) → 4·19 혁명(1960) → 5·16 군사 정변(1961) → 유신 헌법 공포(1972) 순이다."},
{q:"밑줄 친 성명이 발표된 정부 시기에 있었던 일은?",p:"남과 북은 자주, 평화, 민족 대단결의 3대 통일 원칙에 합의하였다. (7·4 남북 공동 성명)",c:["금융 실명제 실시","6월 민주 항쟁","서울 올림픽 개최","부·마 민주 항쟁","6·15 남북 공동 선언"],a:3,e:"7·4 남북 공동 성명(1972)은 박정희 정부 때 발표되었다. 부·마 민주 항쟁(1979)도 박정희 정부 말기의 일이다."},
{q:"6월 민주 항쟁에 대한 설명으로 옳은 것을 모두 고른 것은?",p:"ㄱ. 박종철 고문 치사 사건이 은폐된 사실이 알려지며 확산되었다.<br>ㄴ. 4·13 호헌 조치의 철회를 요구하였다.<br>ㄷ. 6·29 민주화 선언이 발표되는 결과를 낳았다.<br>ㄹ. 유신 헌법을 폐지시켰다.",c:["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],a:3,e:"유신 헌법은 박정희 사후 1980년 신군부의 집권 과정에서 사실상 폐지되었으며, 6월 민주 항쟁(1987)과는 관련이 없다."},
{q:"1980년대 중·후반 우리 경제의 호황을 이끈 '3저' 요인을 바르게 짝지은 것은?",c:["저물가·저임금·저환율","저유가·고금리·저달러","저유가·저금리·저달러","저금리·저성장·저달러","저임금·저환율·저물가"],a:2,e:"저유가·저금리·저달러(달러 약세, 엔화 강세)의 3저 호황으로 1986~1988년 무역 수지 흑자를 기록하였다."},
{q:"다음 업적을 이룬 정부는?",p:"서울 올림픽 개최, 북방 외교 추진, 남북한 유엔 동시 가입, 남북 기본 합의서 채택",c:["박정희 정부","전두환 정부","노태우 정부","김영삼 정부","김대중 정부"],a:2,e:"노태우 정부는 1988년 서울 올림픽을 개최하고 북방 외교를 추진하였으며, 1991년 남북한 유엔 동시 가입과 남북 기본 합의서 채택을 이루었다."},
{q:"밑줄 친 선언이 발표된 정부 시기에 있었던 일은?",p:"남과 북은 나라의 통일 문제를 그 주인인 우리 민족끼리 서로 힘을 합쳐 자주적으로 해결하기로 하였다. (6·15 남북 공동 선언)",c:["7·4 남북 공동 성명 발표","금강산 관광 사업 시작","남북 기본 합의서 채택","10·4 남북 공동 선언 발표","한·미 자유 무역 협정(FTA) 체결"],a:1,e:"6·15 선언(2000)은 김대중 정부 때이며, 금강산 관광은 1998년 시작되었다. 7·4 성명은 박정희, 기본 합의서는 노태우, 10·4 선언과 한·미 FTA는 노무현 정부 때다."}
],
hard:[
{q:"(가) 개헌의 내용으로 옳은 것은?",p:"임시 수도 부산에 계엄령이 선포된 가운데 야당 의원이 탄 통근 버스가 연행되는 등 정치적 혼란이 이어졌고, (가) 개헌안은 국회에서 기립 표결로 통과되었다.",c:["초대 대통령에 한하여 중임 제한을 철폐하였다","대통령 직선제와 국회 양원제를 내용으로 하였다","내각 책임제와 양원제를 채택하였다","대통령의 3선 연임을 허용하였다","통일 주체 국민 회의에서 대통령을 선출하게 하였다"],a:1,e:"1952년 발췌 개헌(부산 정치 파동)이다. 초대 대통령 중임 제한 철폐는 사사오입 개헌(1954), 내각 책임제는 4·19 이후(1960), 3선 개헌은 1969년, 통일 주체 국민 회의는 유신 체제다."},
{q:"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?",p:"(가) 5·18 민주화 운동　(나) 10·26 사태<br>(다) 12·12 사태　(라) 부·마 민주 항쟁",c:["(가)-(나)-(다)-(라)","(나)-(라)-(다)-(가)","(라)-(나)-(다)-(가)","(라)-(다)-(나)-(가)","(다)-(라)-(나)-(가)"],a:2,e:"부·마 민주 항쟁(1979.10) → 10·26 사태(1979.10) → 12·12 사태(1979.12) → 5·18 민주화 운동(1980.5) 순이다."},
{q:"(가)와 (나) 사이에 있었던 사실로 옳은 것은?",p:"(가) 6·25 전쟁 정전 협정 체결(1953)<br>(나) 4·19 혁명(1960)",c:["발췌 개헌 통과","사사오입 개헌 통과","5·16 군사 정변","거창 양민 학살 사건","반민 특위 해체"],a:1,e:"사사오입 개헌은 1954년이다. 발췌 개헌(1952)과 거창 사건(1951)은 전쟁 중, 반민 특위 해체(1949)는 그 이전, 5·16(1961)은 4·19 이후의 일이다."},
{q:"유신 헌법의 내용으로 옳은 것을 모두 고른 것은?",p:"ㄱ. 통일 주체 국민 회의에서 대통령을 간접 선출하였다.<br>ㄴ. 대통령에게 긴급 조치권을 부여하였다.<br>ㄷ. 국회 의원 정수의 3분의 1을 대통령이 사실상 추천하였다.<br>ㄹ. 대통령 직선제와 5년 단임제를 규정하였다.",c:["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],a:2,e:"유신 헌법은 대통령의 권한을 크게 강화하였다(임기 6년, 중임 제한 없음). 직선제와 5년 단임제는 1987년 개정 헌법의 내용이다."},
{q:"5·18 민주화 운동에 대한 설명으로 옳지 않은 것은?",c:["신군부의 비상계엄 전국 확대에 맞서 일어났다","시민들이 시민군을 조직하여 대응하였다","2011년 관련 기록물이 유네스코 세계 기록 유산에 등재되었다","박정희 정부의 유신 체제 철폐를 요구하며 전개되었다","1990년대에 5·18 특별법이 제정되어 책임자 처벌이 이루어졌다"],a:3,e:"5·18은 박정희 사망 이후 신군부가 권력을 장악하는 과정에서 계엄 철폐와 민주화를 요구하며 일어났다. 유신 체제는 이미 박정희 사망(1979)으로 막을 내린 뒤였다."},
{q:"6월 민주 항쟁 이후 개정된 헌법(1987)의 내용으로 옳은 것은?",c:["대통령 7년 단임제와 대통령 선거인단 간선","대통령 직선제와 5년 단임제","국회 양원제와 내각 책임제","대통령 임기 6년, 중임 제한 없음","대통령 3선 허용"],a:1,e:"1987년 개정 헌법은 대통령 직선제·5년 단임제를 규정하고, 헌법 재판소를 도입하였다. 7년 단임·선거인단 간선은 1980년 헌법이다."},
{q:"(가) 시기의 모습으로 옳은 것은?",p:"(가) 대기업의 연쇄 부도와 외환 보유액 부족으로 정부가 국제 통화 기금(IMF)에 구제 금융을 요청하였다. (1997)",c:["저유가·저금리·저달러의 3저 호황이 이어졌다","금융 실명제가 처음 실시되었다","새마을 운동이 시작되었다","OECD 가입으로 위기가 곧바로 해소되었다","IMF 관리 아래 기업·금융 구조 조정과 정리 해고제 도입이 추진되었다"],a:4,e:"외환 위기 이후 구조 조정이 추진되고 정리 해고제가 법제화되었으며, 비정규직 근로자가 늘어났다. 국민의 금 모으기 운동도 전개되었다."},
{q:"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?",p:"(가) 6·15 남북 공동 선언　(나) 7·4 남북 공동 성명<br>(다) 10·4 남북 공동 선언　(라) 남북 기본 합의서 채택",c:["(나)-(가)-(라)-(다)","(나)-(라)-(가)-(다)","(가)-(나)-(라)-(다)","(나)-(라)-(다)-(가)","(라)-(나)-(가)-(다)"],a:1,e:"7·4 남북 공동 성명(1972) → 남북 기본 합의서(1991) → 6·15 남북 공동 선언(2000) → 10·4 남북 공동 선언(2007) 순이다."}
]};
Q.easy=Q.easy.concat([
{q:"6·25 전쟁이 일어난 해는?",c:["1945년","1948년","1950년","1953년","1960년"],a:2,e:"북한의 남침으로 1950년 6월 25일 전쟁이 시작되었고, 1953년 정전 협정이 체결되었다."},
{q:"6·25 전쟁 정전 이후 체결되어 미군의 한국 주둔 근거가 된 조약은?",c:["한·일 기본 조약","한·미 상호 방위 조약","한·미 자유 무역 협정","남북 기본 합의서","조·중 상호 원조 조약"],a:1,e:"1953년 한·미 상호 방위 조약이 조인되어(1954 발효) 미군이 한반도에 주둔하는 근거가 되었다."},
{q:"1961년 5·16 군사 정변을 주도한 인물은?",c:["박정희","전두환","노태우","윤보선","장면"],a:0,e:"박정희 등 군부 세력이 4·19 이후의 장면 내각을 무너뜨리고 정권을 장악하였다."},
{q:"1960년대 박정희 정부가 수출 주도형 공업화를 위해 추진한 계획은?",c:["국민 교육 헌장","경제 개발 5개년 계획","농지 개혁","3저 호황","금 모으기 운동"],a:1,e:"1962년부터 경제 개발 5개년 계획이 추진되어 경공업 중심의 수출 주도형 성장이 이루어졌다."},
{q:"1970년대 농촌 근대화를 목표로 정부 주도로 추진된 운동은?",c:["물산 장려 운동","국채 보상 운동","새마을 운동","금 모으기 운동","브나로드 운동"],a:2,e:"새마을 운동은 1970년대 '잘살아 보세' 구호 아래 농촌 환경 개선과 소득 증대를 목표로 전개되었다."},
{q:"1972년 박정희 정부가 장기 집권을 위해 선포한 체제는?",c:["10월 유신","3선 개헌","발췌 개헌","6·29 선언","12·12 사태"],a:0,e:"박정희 정부는 1972년 10월 유신을 선포하고 유신 헌법을 공포하였다."},
{q:"1979년 전두환 등 신군부가 군사 반란을 일으킨 사건은?",c:["4·3 사건","10·26 사태","12·12 사태","5·16 군사 정변","6·3 시위"],a:2,e:"박정희 대통령 피격(10·26) 이후 신군부 세력은 12·12 사태로 군권을 장악하였다."},
{q:"6월 민주 항쟁 당시 직선제 개헌 수용 등을 담은 6·29 민주화 선언을 발표한 인물은?",c:["노태우","김영삼","김대중","전두환","김종필"],a:0,e:"6월 민주 항쟁 결과 당시 민정당 대표 노태우가 6·29 민주화 선언을 발표하였다."},
{q:"1993년 출범하여 군사 정권을 끝내고 '문민정부'로 불린 정부는?",c:["노태우 정부","김영삼 정부","김대중 정부","노무현 정부","박정희 정부"],a:1,e:"김영삼 정부는 금융 실명제 실시, 하나회 해체, 역사 바로 세우기 등을 추진하였다."},
{q:"우리나라가 국제 통화 기금(IMF)에 구제 금융을 요청한 해는?",c:["1987년","1993년","1997년","2000년","2002년"],a:2,e:"1997년 외환 위기로 정부는 IMF에 구제 금융을 요청하였다."},
{q:"외환 위기를 극복하기 위해 국민이 참여한 운동은?",c:["국채 보상 운동","금 모으기 운동","새마을 운동","물산 장려 운동","6월 민주 항쟁"],a:1,e:"1998년 국민들이 가정의 금붙이를 내놓는 금 모으기 운동으로 외채 상환에 힘을 보탰다."},
{q:"2002년 우리나라가 일본과 공동으로 개최한 국제 대회는?",c:["서울 올림픽","FIFA 월드컵","대전 엑스포","평창 동계 올림픽","세계 육상 선수권"],a:1,e:"2002년 한·일 월드컵이 공동 개최되었다. 서울 올림픽은 1988년, 평창 동계 올림픽은 2018년이다."}

Q.mid=Q.mid.concat([
{q:"5·10 총선거에 대한 설명으로 옳은 것은?",c:["북한 지역에서도 함께 실시되었다","만 21세 이상 남녀에게 선거권이 주어진 최초의 보통 선거였다","김구와 김규식이 적극 참여하였다","신탁 통치 실시를 위해 치러졌다","제헌 국회의 임기는 4년이었다"],a:1,e:"1948년 5·10 총선거는 남한 지역에서만 실시되었고, 김구·김규식 등 남북 협상파는 불참하였다. 제헌 국회 임기는 2년이었다."},
{q:"(가) 위원회에 대한 설명으로 옳은 것은?",p:"제헌 국회는 반민족 행위 처벌법을 제정하고, 일제 강점기 친일 행위자를 조사·처벌하기 위한 (가)를 설치하였다.",c:["이승만 정부의 적극 지원으로 친일파 대부분이 처벌되었다","농지 개혁을 위해 구성되었다","미 군정이 설치하였다","신탁 통치 반대를 위해 조직되었다","반민족 행위 특별 조사 위원회로, 방해 속에 활동이 위축되어 성과가 제한적이었다"],a:4,e:"반민 특위(1948)는 정부의 소극적 태도와 반민 특위 습격 사건 등으로 활동이 위축되어 친일파 청산이 제대로 이루어지지 못하였다."},
{q:"4·19 혁명 이후 개정된 헌법의 내용으로 옳은 것은?",c:["내각 책임제와 양원제 채택","대통령 직선제와 5년 단임제","통일 주체 국민 회의 설치","대통령 3선 허용","대통령 간선제와 7년 단임제"],a:0,e:"이승만 하야 후 개헌으로 내각 책임제·양원제가 도입되어 장면 내각이 출범하였다."},
{q:"(가) 조약에 대한 설명으로 옳은 것은?",p:"(가) 정부는 1965년 일본과 국교를 정상화하는 조약을 체결하였다. 이에 반대하는 대학생과 시민들이 6·3 시위 등을 전개하였다.",c:["이승만 정부가 체결하였다","일본의 사과와 배상이 명확히 규정되었다","박정희 정부가 체결하였으며 받은 경제 협력 자금을 경제 개발에 활용하였다","일본군 '위안부' 문제 해결을 명시하였다","독도 영유권 문제를 해결하였다"],a:2,e:"한·일 협정(1965)은 박정희 정부 때 체결되었고 청구권 자금 등이 경제 개발에 쓰였으나, 식민 지배에 대한 사과와 배상이 불분명하다는 비판을 받았다."},
{q:"1970년대 박정희 정부의 경제 정책으로 옳은 것은?",c:["금융 실명제 도입","철강·조선·석유 화학 등 중화학 공업 육성","3저 호황 속 무역 수지 흑자 달성","외환 자유화와 시장 개방 추진","정리 해고제 도입"],a:1,e:"1970년대에는 중화학 공업 육성 정책으로 수출 구조가 고도화되었고, 1977년 수출 100억 달러를 달성하였다."},
{q:"전두환 정부 시기에 있었던 일은?",c:["야간 통행 금지 해제","금융 실명제 실시","남북 기본 합의서 채택","서울 올림픽 개최","6·15 남북 공동 선언"],a:0,e:"1982년 야간 통행 금지가 해제되고 프로 야구가 출범하였다. 올림픽은 유치(1981)는 전두환 정부, 개최(1988)는 노태우 정부 때다."},
{q:"노태우 정부의 북방 외교로 새로 수교한 나라가 아닌 것은?",c:["헝가리","소련","중국","미국","폴란드"],a:3,e:"헝가리·폴란드(1989), 소련(1990), 중국(1992)과 수교하였다. 미국은 그 이전부터 외교 관계가 있었다."},
{q:"다음 설명에 해당하는 정부에서 있었던 일은?",p:"(가) 정부는 전직 대통령들을 구속·기소하는 '역사 바로 세우기'를 추진하고 군 내부 사조직인 하나회를 해체하였다.",c:["남북 기본 합의서 채택","6·15 남북 공동 선언","새마을 운동 추진","금융 실명제 실시","중화학 공업 육성"],a:3,e:"김영삼 정부는 1993년 금융 실명제를 실시하고 1995년 지방 자치 단체장 선거를 실시하였다."},
{q:"김대중 정부 시기에 있었던 일은?",c:["금융 실명제 실시","남북 기본 합의서 채택","김대중 대통령의 노벨 평화상 수상","5·18 특별법 제정","서울 올림픽 개최"],a:2,e:"김대중 대통령은 남북 화해 협력 노력을 인정받아 2000년 노벨 평화상을 받았다. 5·18 특별법(1995)은 김영삼 정부 때 제정되었다."},
{q:"2007년 평양에서 열린 남북 정상 회담에서 10·4 남북 공동 선언을 발표한 대통령은?",c:["김대중","노무현","이명박","김영삼","노태우"],a:1,e:"노무현 대통령은 2007년 제2차 남북 정상 회담을 열고 10·4 남북 공동 선언을 발표하였다."},
{q:"부·마 민주 항쟁에 대한 설명으로 옳은 것은?",c:["5·18의 영향으로 시작되었다","YH 무역 사건과 김영삼 의원직 제명 등을 계기로 부산·마산에서 일어났다","6·29 선언으로 이어졌다","3·15 부정 선거에 항의하며 일어났다","전두환 정부가 진압하였다"],a:1,e:"부·마 민주 항쟁(1979.10)은 유신 체제 말기에 일어났으며, 곧이어 10·26 사태로 박정희 정권이 무너졌다."},

{q:"4·19 혁명 이후 장면 내각 시기의 모습으로 옳지 않은 것은?",c:["내각 책임제 아래 국무총리로 장면이 선출되었다","교원 노조 결성 등 사회 각 분야의 요구가 분출되었다","학생 중심의 통일 운동이 전개되었다","언론의 자유가 확대되어 신문·잡지가 늘어났다","국가 재건 최고 회의를 설치하여 입법·행정권을 행사하였다"],a:4,e:"국가 재건 최고 회의는 5·16 군사 정변(1961) 이후 군부가 설치한 기구다."},
{q:"다음 사건이 사회에 미친 영향으로 옳은 것은?",p:"서울 평화 시장의 재단사 전태일은 근로 기준법 준수를 요구하며 분신하였다. (1970)",c:["유신 헌법 제정의 직접적 원인이 되었다","노동 문제에 대한 사회적 관심이 높아지고 노동 운동이 활발해졌다","새마을 운동이 시작되는 계기가 되었다","한·일 협정 반대 운동으로 발전하였다","6월 민주 항쟁의 직접적 계기가 되었다"],a:1,e:"전태일 분신 사건은 열악한 노동 현실을 알리고 이후 노동 운동이 확산되는 계기가 되었다."},
{q:"전두환 정부 시기의 모습으로 옳은 것을 모두 고른 것은?",p:"ㄱ. 삼청 교육대가 운영되었다.<br>ㄴ. 언론 통폐합이 단행되었다.<br>ㄷ. 프로 야구가 출범하였다.<br>ㄹ. 금융 실명제가 실시되었다.",c:["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],a:3,e:"금융 실명제는 1993년 김영삼 정부 때 실시되었다."},
{q:"정부와 그 정부의 정책을 옳게 연결한 것은?",c:["노태우 정부 - 금융 실명제 실시","김영삼 정부 - 남북 기본 합의서 채택","김대중 정부 - 햇볕 정책 추진","전두환 정부 - 경제 개발 5개년 계획 시작","박정희 정부 - 3저 호황"],a:2,e:"금융 실명제는 김영삼, 남북 기본 합의서는 노태우, 경제 개발 5개년 계획은 박정희 정부 때다. 3저 호황은 1980년대 중·후반이다."},
{q:"남북 기본 합의서에 대한 설명으로 옳은 것은?",c:["7·4 남북 공동 성명보다 앞서 채택되었다","김대중 정부 때 정상 회담의 결과로 채택되었다","채택된 해에 남북한이 유엔에 동시 가입하였다","남북 이산가족 상봉이 처음 성사된 합의이다","개성 공단 건설을 합의하였다"],a:2,e:"남북 기본 합의서는 1991년 노태우 정부 때 채택되었고, 같은 해 남북한이 유엔에 동시 가입하였다."},
{q:"외환 위기의 배경으로 옳지 않은 것은?",c:["대기업의 과도한 차입 경영과 부실","금융 기관의 부실 대출","외환 보유액의 부족","3저 호황으로 인한 경상 수지 흑자","외국 단기 자본의 급격한 유출"],a:3,e:"외환 위기 직전에는 경상 수지 적자가 이어졌다. 3저 호황은 1980년대 중·후반의 일이다."},
{q:"지방 자치제에 대한 설명으로 옳은 것은?",c:["유신 헌법에 의해 전면 실시되었다","5·16 군사 정변 이후 중단되었다가 1991년 지방 의회 선거로 부활하였고, 1995년 단체장 선거까지 실시되었다","전두환 정부 때 지방 의회 선거가 처음 실시되었다","김대중 정부 때 처음 도입되었다","6·25 전쟁 중 최초 실시된 후 계속 유지되었다"],a:1,e:"지방 자치제는 5·16 이후 중단되었다가 노태우 정부 때 지방 의회 선거로 부활하고, 김영삼 정부 때 단체장 선거로 전면 실시되었다."},
{q:"시기별 경제 상황으로 옳은 것을 모두 고른 것은?",p:"ㄱ. 1960년대: 경공업 중심의 수출 주도형 성장<br>ㄴ. 1970년대: 중화학 공업 육성과 수출 100억 달러 달성<br>ㄷ. 1980년대 후반: 3저 호황으로 무역 수지 흑자<br>ㄹ. 1990년대 초: 한·미 자유 무역 협정(FTA) 체결",c:["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],a:1,e:"한·미 FTA는 2000년대 후반(노무현 정부, 2007)에 체결되었다."},
{q:"김대중 정부 시기 남북 교류의 모습으로 옳지 않은 것은?",c:["남북 이산가족 상봉이 이루어졌다","경의선 철도 연결 사업이 추진되었다","금강산 관광이 시작되었다","남북 기본 합의서가 채택되었다","남북 정상 회담이 개최되었다"],a:3,e:"남북 기본 합의서(1991)는 노태우 정부 때 채택되었다."},
{q:"(가)와 (나) 사이에 있었던 사실로 옳은 것은?",p:"(가) 6월 민주 항쟁(1987)<br>(나) 외환 위기와 IMF 구제 금융 요청(1997)",c:["서울 올림픽 개최","5·18 민주화 운동","유신 헌법 공포","6·15 남북 공동 선언","부·마 민주 항쟁"],a:0,e:"서울 올림픽은 1988년이다. 5·18(1980)과 유신 헌법(1972), 부·마 항쟁(1979)은 이전, 6·15 선언(2000)은 이후다."},
{q:"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?",p:"(가) 3선 개헌　(나) 사사오입 개헌<br>(다) 유신 헌법　(라) 발췌 개헌",c:["(나)-(라)-(가)-(다)","(라)-(나)-(가)-(다)","(라)-(나)-(다)-(가)","(나)-(가)-(라)-(다)","(라)-(가)-(나)-(다)"],a:1,e:"발췌 개헌(1952) → 사사오입 개헌(1954) → 3선 개헌(1969) → 유신 헌법(1972) 순이다."},
{q:"4·19 혁명과 6월 민주 항쟁의 공통점으로 옳은 것은?",c:["대통령이 하야하였다","개헌으로 내각 책임제가 도입되었다","신군부의 퇴진을 요구하였다","국민의 직접 참여로 민주주의를 발전시킨 시민 항쟁이다","대통령 직선제 쟁취가 목적이었다"],a:3,e:"4·19는 이승만 하야와 내각 책임제 개헌, 6월 항쟁은 직선제 개헌을 이끌어 냈다. 두 운동 모두 시민의 직접 참여로 독재에 맞선 민주화 운동이다."}
]);

{q:"대통령 선출 방식에 대한 설명으로 옳은 것은?",c:["제헌 헌법 - 국민의 직접 선거로 대통령 선출","발췌 개헌 - 대통령 직선제","유신 헌법 - 대통령 직선제와 5년 단임","1980년 헌법 - 대통령 직선제와 7년 단임","1987년 개정 헌법 - 대통령 선거인단 간선"],a:1,e:"제헌 헌법은 국회 간선, 유신은 통일 주체 국민 회의 간선, 1980년 헌법은 선거인단 간선(7년 단임), 1987년 헌법은 직선제(5년 단임)다."},

{q:"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?",p:"(가) 한·일 협정 체결　(나) 경부 고속 국도 개통<br>(다) 제1차 경제 개발 5개년 계획 시작　(라) 3선 개헌",c:["(다)-(가)-(라)-(나)","(다)-(가)-(나)-(라)","(가)-(다)-(라)-(나)","(다)-(라)-(가)-(나)","(가)-(다)-(나)-(라)"],a:0,e:"경제 개발 5개년 계획(1962) → 한·일 협정(1965) → 3선 개헌(1969) → 경부 고속 국도 개통(1970) 순이다."},
{q:"신군부의 집권 과정을 순서대로 바르게 나열한 것은?",p:"(가) 5·17 비상계엄 전국 확대<br>(나) 전두환의 대통령 선출(1980.8)<br>(다) 12·12 사태　(라) 5·18 민주화 운동",c:["(다)-(가)-(라)-(나)","(다)-(라)-(가)-(나)","(가)-(다)-(라)-(나)","(다)-(가)-(나)-(라)","(라)-(다)-(가)-(나)"],a:0,e:"12·12 사태(1979) → 5·17 비상계엄 확대 → 5·18 민주화 운동 → 전두환 대통령 선출 순이다."},
{q:"1987년 13대 대통령 선거에 대한 설명으로 옳은 것은?",c:["간선제로 전두환이 재선되었다","직선제로 실시되었으나 야권 후보 분열 속에 노태우가 당선되었다","김영삼이 당선되었다","김대중이 당선되었다","국민 투표로 내각 책임제가 채택되었다"],a:1,e:"개헌 후 직선제로 치러진 선거에서 야권이 김영삼·김대중으로 나뉜 가운데 노태우가 당선되었다."},
{q:"남북 기본 합의서가 채택된 무렵 남북이 함께 발표한 선언은?",c:["한반도 비핵화 공동 선언","6·15 남북 공동 선언","7·4 남북 공동 성명","10·4 남북 공동 선언","판문점 선언"],a:0,e:"1991년 남북 기본 합의서와 함께 한반도 비핵화 공동 선언이 채택되었다."},
{q:"외환 위기 이후 나타난 사회 모습으로 옳은 것을 모두 고른 것은?",p:"ㄱ. 정리 해고제가 법제화되었다.<br>ㄴ. 비정규직 근로자가 늘어났다.<br>ㄷ. 금 모으기 운동이 전개되었다.<br>ㄹ. 3저 호황이 시작되었다.",c:["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],a:1,e:"3저 호황은 1980년대 중·후반의 일로 외환 위기와 무관하다."},
{q:"금융 실명제에 대한 설명으로 옳은 것은?",c:["박정희 정부 때 처음 실시되었다","1993년 김영삼 정부 때 실시되어 금융 거래의 투명성을 높였다","김대중 정부가 외환 위기 때 도입하였다","전두환 정부 때 시행되었다","노태우 정부 때 시행되었다"],a:1,e:"금융 실명제는 1993년 긴급 재정 경제 명령으로 실시되어 지하 경제를 양성화하는 데 기여하였다."},
{q:"6월 민주 항쟁 이후 노동 운동에 대한 설명으로 옳은 것은?",c:["YH 무역 사건이 일어났다","노동자 대투쟁이 전개되어 노동조합 결성이 활발해졌다","전태일이 분신하였다","근로 기준법이 처음 제정되었다","국가 총동원법이 공포되었다"],a:1,e:"1987년 여름 노동자 대투쟁이 일어나 노동조합이 늘고 임금 인상 요구가 확산되었다."},
{q:"사사오입 개헌에 대한 설명으로 옳은 것은?",c:["대통령 직선제를 도입하였다","정족수 계산에 사사오입 논리를 적용해 부결을 번복하고 통과를 선포하였다","내각 책임제를 도입하였다","대통령 3선 연임을 허용하였다","통일 주체 국민 회의를 설치하였다"],a:1,e:"1954년 초대 대통령에 한하여 중임 제한을 철폐하는 개헌안이 사사오입 논리로 통과된 것으로 선포되었다."},
{q:"유신 체제의 긴급 조치에 대한 설명으로 옳은 것은?",c:["대통령이 국민의 자유와 권리를 제한할 수 있는 권한으로, 정부 비판을 탄압하는 데 쓰였다","국회의 승인을 반드시 받아야 하였다","일반 법원의 재판만 받게 하였다","민주화 운동을 지원하는 제도였다","장면 내각이 처음 도입하였다"],a:0,e:"긴급 조치는 유신 헌법이 대통령에게 부여한 권한으로 반유신 운동을 억압하는 데 사용되었다."},
{q:"유신 체제 말기의 사건을 순서대로 바르게 나열한 것은?",p:"(가) 부·마 민주 항쟁　(나) YH 무역 사건<br>(다) 김영삼 의원직 제명　(라) 10·26 사태",c:["(나)-(다)-(가)-(라)","(나)-(가)-(다)-(라)","(다)-(나)-(가)-(라)","(가)-(나)-(다)-(라)","(나)-(다)-(라)-(가)"],a:0,e:"YH 무역 사건(1979.8) → 김영삼 의원직 제명 → 부·마 민주 항쟁(10월) → 10·26 사태 순이다."},
{q:"산업화 과정의 부작용으로 옳지 않은 것은?",c:["도시와 농촌의 격차 확대","노동자의 저임금·장시간 노동","빈부 격차 심화","환경 오염 문제 대두","농촌 인구의 급증"],a:4,e:"산업화로 이촌향도가 나타나 도시 인구가 급증하고 농촌 인구는 감소하였다."},
{q:"1990년대 이후 한국 사회의 변화로 옳은 것은?",c:["언론 통폐합이 단행되었다","삼청 교육대가 운영되었다","시민 단체의 활동이 활발해져 환경·인권 문제 등에 목소리를 내었다","국가 보위 입법 회의가 설치되었다","정부가 검열을 강화하였다"],a:2,e:"민주화 이후 시민 사회가 성장하면서 다양한 시민 단체가 사회 문제에 참여하였다. 나머지는 1980년대 초의 일이다."},
{q:"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?",p:"(가) 6·15 남북 공동 선언　(나) 판문점 선언(2018)<br>(다) 남북 기본 합의서　(라) 7·4 남북 공동 성명",c:["(라)-(가)-(다)-(나)","(다)-(라)-(가)-(나)","(라)-(다)-(가)-(나)","(라)-(다)-(나)-(가)","(가)-(라)-(다)-(나)"],a:2,e:"7·4 성명(1972) → 남북 기본 합의서(1991) → 6·15 선언(2000) → 판문점 선언(2018) 순이다."},
{q:"정부와 통일 정책이 바르게 연결되지 않은 것은?",c:["박정희 정부 - 7·4 남북 공동 성명","노태우 정부 - 남북 기본 합의서","김영삼 정부 - 10·4 남북 공동 선언","김대중 정부 - 6·15 남북 공동 선언","노무현 정부 - 개성 공단 착공"],a:2,e:"10·4 남북 공동 선언(2007)은 노무현 정부 때 발표되었다."},
{q:"(가)와 (나) 사이에 있었던 사실로 옳은 것은?",p:"(가) 12·12 사태(1979)<br>(나) 6월 민주 항쟁(1987)",c:["5·18 민주화 운동","부·마 민주 항쟁","6·15 남북 공동 선언","금융 실명제 실시","외환 위기"],a:0,e:"5·18은 1980년이다. 부·마 민주 항쟁은 1979년 10월로 12·12 이전이며, 나머지는 1987년 이후의 일이다."},
{q:"1990년대 우리 경제에 대한 설명으로 옳은 것은?",c:["중화학 공업 육성 정책이 시작되었다","1996년 OECD에 가입하였으나 1997년 외환 위기로 IMF 구제 금융을 요청하였다","3저 호황으로 무역 수지 흑자가 이어졌다","경제 개발 5개년 계획이 처음 시작되었다","한·미 FTA가 체결되었다"],a:1,e:"1990년대 중반 OECD에 가입하였으나 1997년 외환 위기를 맞았다."},
{q:"1997년 대통령 선거의 의의로 옳은 것은?",c:["처음으로 직선제 대통령 선거가 실시되었다","헌정 사상 처음으로 평화적인 여야 정권 교체가 이루어졌다","군인 출신 대통령이 당선되었다","국민 투표로 내각 책임제가 채택되었다","대통령 간선제가 부활하였다"],a:1,e:"1997년 김대중 후보가 당선되어 헌정 사상 처음으로 여야 간 평화적 정권 교체가 이루어졌다."}
]);

{s:1,q:"위 사료가 나타내는 사건으로 옳은 것은?",p:"마산에서 시작된 시위가 전국으로 번졌다. 학생과 시민들은 부정 선거 무효와 독재 타도를 외치며 거리로 나섰고, 결국 대통령은 물러났다.",c:["4·19 혁명","5·18 민주화 운동","6월 민주 항쟁","부·마 민주 항쟁","5·16 군사 정변"],a:0,e:"3·15 부정 선거에 항의한 시위가 4·19 혁명으로 이어져 이승만이 하야하였다."},
{s:1,q:"위 사료가 나타내는 사건으로 옳은 것은?",p:"계엄군이 시민들에게 총을 쏘자 시민들은 무기를 들고 시민군을 조직하였다. 시민들은 도청을 중심으로 질서를 지키며 항쟁하였다.",c:["4·19 혁명","5·18 민주화 운동","6·3 시위","부·마 민주 항쟁","6월 민주 항쟁"],a:1,e:"1980년 5월 광주에서 신군부의 비상계엄 확대에 맞서 일어난 5·18 민주화 운동이다."},
{s:1,q:"위 사료의 선언을 발표한 남측 대통령은?",p:"남과 북은 나라의 통일 문제를 그 주인인 우리 민족끼리 서로 힘을 합쳐 자주적으로 해결해 나가기로 하였다. (2000년 6월)",c:["노태우","김영삼","김대중","노무현","박정희"],a:2,e:"6·15 남북 공동 선언은 2000년 김대중 대통령과 김정일 국방위원장이 발표하였다."},
{s:1,q:"위 사료의 회의로 옳은 것은?",p:"한반도에 임시 민주 정부를 세우기 위해 미·소 공동 위원회를 열고, 최고 5년 동안 4개국이 신탁 통치를 한다는 내용이 발표되었다. (1945.12)",c:["모스크바 3국 외상 회의","카이로 회담","얄타 회담","포츠담 회담","제네바 회담"],a:0,e:"1945년 12월 모스크바 3국 외상 회의의 결정 내용이다."},
{s:1,q:"위 사료의 제도를 실시한 정부는?",p:"금융 거래에서 가명이나 차명이 아닌 실제 이름을 쓰도록 하는 제도를 긴급 명령으로 실시한다.",c:["박정희 정부","전두환 정부","노태우 정부","김영삼 정부","김대중 정부"],a:3,e:"금융 실명제는 1993년 김영삼 정부 때 실시되었다."},
{s:1,q:"위 사료의 헌법을 공포한 정부는?",p:"대통령은 통일 주체 국민 회의에서 선출한다. 대통령은 긴급 조치를 내릴 수 있으며 국회 의원 정수의 3분의 1을 추천한다.",c:["이승만 정부","박정희 정부","전두환 정부","노태우 정부","김영삼 정부"],a:1,e:"유신 헌법(1972)의 내용으로 박정희 정부 때 공포되었다."},
{s:1,q:"위 사료의 개혁이 실시된 정부는?",p:"정부는 지주의 농지를 사들여 소작농에게 나누어 주었고, 한 가구당 농지 소유는 3정보로 제한하였다.",c:["이승만 정부","박정희 정부","장면 정부","전두환 정부","김대중 정부"],a:0,e:"농지 개혁법은 1949년 제정되어 1950년 시행되었다(이승만 정부)."},
{s:1,q:"위 사료가 나타내는 시기로 옳은 것은?",p:"외환 보유액이 바닥나자 정부는 국제 통화 기금에 도움을 요청하였고, 국민들은 장롱 속 금붙이를 모아 나라의 빚을 갚는 데 나섰다.",c:["외환 위기(1997)","3저 호황","석유 파동","6·25 전쟁","금융 실명제 실시"],a:0,e:"1997년 외환 위기와 이를 극복하려는 금 모으기 운동을 나타낸다."},
{s:1,q:"위 사료의 합의서가 채택된 정부는?",p:"남과 북은 서로 상대방의 체제를 인정하고 존중하며, 무력을 사용하지 않고 불가침을 지키기로 하였다. 교류·협력도 확대한다.",c:["박정희 정부","노태우 정부","김대중 정부","노무현 정부","전두환 정부"],a:1,e:"남북 기본 합의서는 1991년 노태우 정부 때 채택되었다."}
]);
Q.mid=Q.mid.concat([
{s:1,q:"위 주장에 대한 중도 세력의 대응으로 옳은 것은?",p:"이승만은 정읍에서 미·소 공동 위원회가 재개될 가망이 없으니 남한만이라도 임시 정부나 위원회를 조직해야 한다고 주장하였다. (1946.6)",c:["좌우 합작 위원회를 결성하여 중도 통일 정부 수립을 추진하였다","5·10 총선거에 적극 참여하였다","미 군정에 협조하며 단독 정부 수립을 지지하였다","북한 정권 수립에 참여하였다","신탁 통치를 적극 찬성하였다"],a:0,e:"여운형·김규식 등 중도 세력은 좌우 합작 위원회를 결성하여 통일 정부 수립을 시도하였다."},
{s:1,q:"위 선거에 대한 반발로 전개된 운동은?",p:"야당 의원 후보 등록이 방해받았고, 투표장에서는 3인조·9인조로 조를 짜서 공개 투표를 하도록 강요하였다.",c:["4·19 혁명","5·18 민주화 운동","6월 민주 항쟁","부·마 민주 항쟁","6·3 시위"],a:0,e:"1960년 3·15 부정 선거에 항의하여 4·19 혁명이 일어났다."},
{s:1,q:"위 정부 시기의 모습으로 옳은 것은?",p:"정부는 한·일 국교 정상화를 추진하였다. 학생과 시민들이 굴욕 외교라며 시위를 벌이자 계엄령을 선포하여 탄압하였다.",c:["베트남에 국군을 파병하였다","금융 실명제를 실시하였다","서울 올림픽을 개최하였다","6·15 남북 공동 선언을 발표하였다","3저 호황을 맞았다"],a:0,e:"한·일 협정(1965)을 체결한 박정희 정부는 1964년부터 베트남에 국군을 파병하였다."},
{s:1,q:"위 헌법이 제정된 이후의 사실로 옳은 것은?",p:"대통령은 통일 주체 국민 회의에서 토론 없이 선출한다. 대통령은 긴급 조치권을 가지며 국회 의원 정수의 3분의 1을 추천한다.",c:["부·마 민주 항쟁이 일어났다","6월 민주 항쟁이 일어났다","4·19 혁명이 일어났다","5·16 군사 정변이 일어났다","6·3 시위가 일어났다"],a:0,e:"유신 헌법(1972) 이후인 1979년에 부·마 민주 항쟁이 일어났다. 6·3 시위(1964), 5·16(1961), 4·19(1960)는 그 이전이다."},
{s:1,q:"위 선언이 발표된 직후의 모습으로 옳은 것은?",p:"여당 대표는 대통령 직선제로의 개헌, 김대중 사면·복권, 구속자 석방, 언론의 자유 보장 등을 약속하였다.",c:["직선제 대통령 선거가 실시되어 노태우가 당선되었다","유신 헌법이 공포되었다","5·18 민주화 운동이 일어났다","국가 재건 최고 회의가 설치되었다","내각 책임제로 개헌되었다"],a:0,e:"6·29 민주화 선언 이후 개헌이 이루어졌고, 1987년 12월 직선제로 대통령 선거가 실시되었다."},
{s:1,q:"위 사건의 이후 영향으로 옳은 것은?",p:"계엄군이 물러간 도청에서 시민 수습 위원회가 조직되었고 시민군이 구성되었다. 5월 27일 계엄군이 도청을 다시 진압하였다.",c:["민주화 운동의 정신적 바탕이 되었고 2011년 기록물이 유네스코 세계 기록 유산에 등재되었다","이승만이 하야하였다","유신 헌법 폐지가 결정되었다","대통령 직선제가 즉시 도입되었다","국가 보안법이 제정되었다"],a:0,e:"5·18 민주화 운동은 이후 민주화 운동에 큰 영향을 주었고 2011년 관련 기록물이 유네스코 세계 기록 유산이 되었다."},
{s:1,q:"위 합의서가 채택된 해의 사실로 옳은 것은?",p:"남과 북은 서로 상대방의 체제를 인정하고 존중하며 상대방에 대하여 무력을 사용하지 않는다.",c:["남북한이 유엔에 동시 가입하였다","서울 올림픽이 개최되었다","6·15 남북 공동 선언이 발표되었다","금융 실명제가 실시되었다","외환 위기가 발생하였다"],a:0,e:"남북 기본 합의서가 채택된 1991년에 남북한이 유엔에 동시 가입하였다."},
{s:1,q:"위 사료가 나타내는 시기의 모습으로 옳은 것은?",p:"1970년대 정부는 수출 주도형 공업화를 이어 가며 중화학 공업을 육성하였다. 1977년에는 수출 100억 달러를 달성하였다.",c:["새마을 운동이 전개되었다","금 모으기 운동이 전개되었다","3저 호황이 나타났다","금융 실명제가 실시되었다","IMF 관리 체제가 시작되었다"],a:0,e:"1970년대 박정희 정부는 새마을 운동과 중화학 공업 육성을 추진하였다."},
{s:1,q:"위 사료가 나타내는 정책은?",p:"정부는 대북 화해·협력 정책을 추진하여 금강산 관광을 시작하였고, 평양에서 남북 정상 회담을 개최하였다.",c:["햇볕 정책","북방 외교","선건설 후통일론","멸공 통일론","북진 통일론"],a:0,e:"김대중 정부는 햇볕 정책으로 남북 교류와 협력을 확대하였다."},
{s:1,q:"위 사료의 시기에 나타난 사회 모습으로 옳은 것은?",p:"1997년 말 정부는 국제 통화 기금에 구제 금융을 요청하였다. 이후 기업 구조 조정과 금융 개혁이 추진되고 정리 해고제가 도입되었다.",c:["실업자와 비정규직 근로자가 늘어났다","3저 호황으로 흑자가 이어졌다","새마을 운동이 전개되었다","금융 실명제가 처음 실시되었다","경제 개발 5개년 계획이 시작되었다"],a:0,e:"구조 조정 과정에서 대량 실업이 발생하고 비정규직이 늘어났다."}
]);
Q.hard=Q.hard.concat([
{s:1,q:"(가)에 들어갈 사건으로 옳은 것은?",p:"유엔 총회는 유엔 감시 아래 남북한 총선거로 통일 정부를 세우라고 결의하였다. 그러나 소련과 북한이 유엔 한국 임시 위원단의 입북을 거부하여 (가)이/가 실시되었다.",c:["남한 지역에서만 5·10 총선거","북한 지역을 포함한 총선거","1950년 제2대 국회의원 선거","남북 협상","제헌 헌법 개정"],a:0,e:"유엔 결의에도 북한 지역에서 선거가 불가능해지자 1948년 남한에서만 5·10 총선거가 실시되었다."},
{s:1,q:"위 사건이 일어난 무렵 이승만 정부에 대한 설명으로 옳은 것은?",p:"평화 통일론을 주장한 진보당의 간부들이 구속되었고(1958), 당수 조봉암은 간첩 혐의로 사형당하였다(1959).",c:["국가 보안법 개정(2·4 파동) 등으로 독재 체제가 강화되었다","내각 책임제로 운영되었다","한·일 협정을 체결하였다","새마을 운동을 시작하였다","금융 실명제를 실시하였다"],a:0,e:"1950년대 후반 이승만 정부는 진보당 사건, 국가 보안법 개정 등으로 야당과 언론을 탄압하였다."},
{s:1,q:"위 공약을 발표한 사건 이후의 모습으로 옳은 것은?",p:"반공을 국시의 제일로 삼고, 부패와 구악을 일소하며, 민생고를 해결한다. 이 과업이 성취되면 군은 본연의 임무로 돌아간다.",c:["국가 재건 최고 회의가 설치되었다","4·19 혁명이 일어났다","6월 민주 항쟁이 일어났다","12·12 사태가 일어났다","제주 4·3 사건이 일어났다"],a:0,e:"5·16 군사 정변(1961) 직후 군사 정부는 국가 재건 최고 회의를 설치하였다."},
{s:1,q:"위 성명 발표 이후 남북 체제의 변화로 옳은 것은?",p:"남과 북은 자주, 평화, 민족 대단결의 3대 원칙에 합의하고 서로 상대방을 비방하지 않으며 직통 전화를 설치하기로 하였다. (1972)",c:["남한은 유신 체제가, 북한은 주석제를 둔 사회주의 헌법이 성립되었다","통일 정부가 수립되었다","남북 기본 합의서가 곧바로 채택되었다","남북이 유엔에 동시 가입하였다","남북 동시 총선거가 실시되었다"],a:0,e:"7·4 남북 공동 성명 이후에도 남북은 각각 유신 체제와 사회주의 헌법으로 권력을 강화하였다."},
{s:1,q:"위 사건 이후 전개된 일로 옳은 것은?",p:"경찰은 조사 중 책상을 탁 치자 억 하고 쓰러져 죽었다고 발표하였으나, 이후 고문 사실이 드러났다. (1987)",c:["6·10 국민 대회가 열리고 6월 민주 항쟁이 전개되었다","5·18 민주화 운동이 일어났다","부·마 민주 항쟁이 일어났다","4·19 혁명이 일어났다","12·12 사태가 일어났다"],a:0,e:"박종철 고문 치사 사건의 은폐 사실이 알려져 6·10 국민 대회가 열리고 6월 민주 항쟁이 확산되었다."},
{s:1,q:"위 헌법 아래 처음 실시된 대통령 선거의 당선자는?",p:"대통령은 국민이 직접 선거하며 임기는 5년으로 하고 중임할 수 없다. 헌법 재판소를 둔다.",c:["노태우","김영삼","김대중","전두환","박정희"],a:0,e:"1987년 개정 헌법에 따라 같은 해 12월 직선제 대선에서 노태우가 당선되었다."},
{s:1,q:"위 호황의 배경으로 옳은 것은?",p:"1986년 경상 수지가 사상 처음 흑자를 기록하였고, 1988년에는 서울 올림픽이 개최되었다.",c:["저유가·저금리·저달러","석유 파동","한·일 협정에 따른 청구권 자금","금 모으기 운동","중동 건설 시장 진출"],a:0,e:"1980년대 중·후반 저유가·저금리·저달러(3저) 호황이 나타났다."},
{s:1,q:"위 정부에 대한 설명으로 옳은 것은?",p:"정부는 동유럽 국가들과 수교한 데 이어 1990년 소련, 1992년 중국과 국교를 맺었다. 남북한은 유엔에 동시 가입하였다.",c:["여소야대 국회에서 5공 청문회가 열렸고 남북 기본 합의서를 채택하였다","금융 실명제를 실시하였다","6·15 남북 공동 선언을 발표하였다","IMF에 구제 금융을 요청하였다","경제 개발 5개년 계획을 시작하였다"],a:0,e:"노태우 정부는 북방 외교를 추진하고 남북 기본 합의서를 채택하였다."},
{s:1,q:"위 상황 이후 정부가 취한 조치로 옳은 것은?",p:"1997년 한보 철강, 기아 자동차 등 대기업이 잇따라 부도를 내고 외국 자본이 빠져나가면서 외환 보유액이 급감하였다.",c:["IMF에 구제 금융을 요청하고 구조 조정을 추진하였다","새마을 운동을 시작하였다","3저 호황을 이어 갔다","금융 실명제를 처음 실시하였다","경제 개발 5개년 계획을 수립하였다"],a:0,e:"1997년 말 정부는 IMF에 구제 금융을 요청하고 기업·금융 구조 조정을 추진하였다."},
{s:1,q:"위 선언이 발표될 당시의 대통령은?",p:"남과 북은 한반도에 더 이상 전쟁은 없을 것이며 새로운 평화의 시대가 열렸음을 선언하고, 완전한 비핵화를 통해 핵 없는 한반도를 실현하기로 하였다. (2018.4)",c:["문재인","박근혜","이명박","노무현","김대중"],a:0,e:"2018년 4월 판문점 선언은 문재인 대통령과 김정은 국무위원장이 발표하였다."}
]);

Q.ultra=[{q:"헌법 개정에 대한 설명으로 옳은 것을 모두 고른 것은?",p:"ㄱ. 발췌 개헌(1952)은 대통령 직선제와 국회 단원제를 골자로 하였다.<br>ㄴ. 사사오입 개헌(1954)은 재적 의원 203명 중 135명이 찬성하여 처음에는 부결이 선포되었으나, 이후 가결로 번복되었다.<br>ㄷ. 3선 개헌(1969)은 대통령의 계속 재임을 3기까지 허용하였고, 이후 유신 헌법(1972)은 대통령의 중임 제한을 두지 않았다.<br>ㄹ. 1987년 개정 헌법은 대통령 직선제와 5년 단임제를 규정하면서 대통령에게 국회 해산권을 부여하였다.",c:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],a:2,e:"ㄱ(×) 발췌 개헌은 직선제와 '양원제'(및 국무위원 불신임제)를 골자로 하였다. ㄴ(○) 203명의 3분의 2는 135.33…이라 136표가 필요하므로 135표는 부결이었으나, 사사오입 논리로 번복되었다. ㄷ(○) 3선 개헌은 '계속 재임 3기', 유신 헌법은 임기 6년에 중임 제한이 없었다. ㄹ(×) 1987년 헌법은 대통령의 국회 해산권을 삭제하고 헌법 재판소를 도입하였다."},

{q:"유신 헌법의 내용으로 옳지 않은 것은?",c:["통일 주체 국민 회의에서 대통령을 토론 없이 선출하였다","통일 주체 국민 회의가 대통령이 추천한 후보를 국회 의원 정수의 3분의 1로 일괄 선출하였다","대통령이 발한 긴급 조치는 사법적 심사의 대상이 되지 않았다","대통령은 국회를 해산할 수 있는 권한을 가졌다","대통령의 임기는 4년이며 중임에 제한이 없었다"],a:4,e:"유신 헌법의 대통령 임기는 6년이고 중임 제한이 없었다. 대통령에게 긴급 조치권·국회 해산권 등 강력한 권한을 주었다."},

{q:"전두환 정부 시기의 사실로 옳은 것을 모두 고른 것은?",p:"ㄱ. 7년 단임의 대통령 선거인단 간선제 헌법에 따라 대통령이 선출되었다.<br>ㄴ. 12대 총선에서 신한 민주당이 제1야당으로 부상하였다.<br>ㄷ. 야당과 재야가 중심이 되어 직선제 개헌 서명 운동을 벌였다.<br>ㄹ. 4·13 호헌 조치를 통해 직선제 개헌 요구를 수용하였다.",c:["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],a:2,e:"4·13 호헌 조치는 개헌 논의를 중단하고 현행 헌법(간선제)으로 정권을 이양하겠다는 것이었다. 직선제를 수용한 것은 6·29 민주화 선언이다."},
{q:"노태우 정부 시기의 사실로 옳은 것을 모두 고른 것은?",p:"ㄱ. 13대 총선(1988)에서 여당인 민정당이 과반 의석을 차지하였다.<br>ㄴ. 3당 합당으로 민주 자유당이 출범하였다.<br>ㄷ. 지방 의회 의원 선거가 다시 실시되었다.<br>ㄹ. 중국과 수교하면서 대만과는 단교하였다.",c:["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],a:2,e:"13대 총선에서는 여소야대 국회가 구성되었다. 이후 3당 합당(1990), 지방 의회 선거(1991), 중국 수교와 대만 단교(1992)가 이어졌다."},
{q:"다음 중 시행된 정부가 나머지와 다른 것은?",c:["하나회 해체","금융 실명제 실시","경제 협력 개발 기구(OECD) 가입","금강산 관광 사업 시작","지방 자치 단체장 선거 실시"],a:3,e:"금강산 관광은 1998년 김대중 정부 때 시작되었다. 나머지는 모두 김영삼 정부 때의 일이다."},
{q:"외환 위기 이후 김대중 정부의 대응으로 옳지 않은 것은?",c:["노사정 위원회가 구성되어 사회적 합의를 모색하였다","정리 해고제와 근로자 파견제가 법제화되었다","환율을 고정하는 고정 환율제로 전환하였다","금 모으기 운동이 전개되어 외채 상환에 보탬이 되었다","IMF 차입금을 2001년 조기 상환하였다"],a:2,e:"외환 위기 직후 환율 변동 폭을 없애는 변동 환율제를 채택하였다."},
{s:1,q:"위 선언이 발표된 해에 있었던 일로 옳은 것은?",p:"남과 북은 서해 평화 협력 특별 지대를 설치하고 해주 지역과 주변 해역을 포괄하는 경제 특구를 건설하기로 하였다. 개성 공단 2단계 개발과 문산-봉동 간 화물 철도 운행을 추진한다. (2007.10)",c:["금강산 관광 사업이 시작되었다","한·미 자유 무역 협정(FTA)이 서명되었다","개성 공단 착공식이 열렸다","6·15 남북 공동 선언이 발표되었다","남북 기본 합의서가 발효되었다"],a:1,e:"10·4 남북 공동 선언(2007)의 내용이다. 한·미 FTA는 2007년 6월 서명되었다. 금강산 관광(1998), 개성 공단 착공식(2003), 6·15 선언(2000), 기본 합의서 발효(1992)이다."},
{q:"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?",p:"(가) 13대 대통령 선거<br>(나) 6·29 민주화 선언<br>(다) 노동자 대투쟁<br>(라) 개정 헌법 국민 투표 확정",c:["(나)-(다)-(라)-(가)","(나)-(라)-(다)-(가)","(다)-(나)-(라)-(가)","(나)-(다)-(가)-(라)","(다)-(라)-(나)-(가)"],a:0,e:"6·29 선언(1987.6) → 노동자 대투쟁(7~9월) → 개정 헌법 국민 투표 확정(10월) → 13대 대통령 선거(12월) 순이다."},

{q:"4·19 혁명 이후와 5·16 군사 정변 이후의 헌법 개정에 대한 설명으로 옳은 것을 모두 고른 것은?",p:"ㄱ. 1960년 6월 개헌으로 대통령 직선제가 도입되었다.<br>ㄴ. 1960년 11월 개헌으로 부정 선거 관련자와 반민주 행위자를 처벌할 소급 입법의 근거가 마련되었다.<br>ㄷ. 1962년 헌법은 국회를 양원제로 구성하였다.<br>ㄹ. 1962년 헌법은 국민 투표로 확정되었으며 대통령 중심제로 복귀하였다.",c:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄴ, ㄷ"],a:2,e:"1960년 6월 개헌은 내각 책임제·양원제이며 대통령은 국회에서 선출하였다. 1962년 헌법은 대통령 중심제·단원제이다."},

 있을 가능성이 높아 멸종 위험이 낮다."},{"u":0,"l":"hard","q":"산화 환원 반응에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄷ 전자를 잃으면 산화이다.","p":"ㄱ. 산화되는 물질이 있으면 환원되는 물질도 있다.<br>ㄴ. 물질이 산소를 얻으면 산화된 것이다.<br>ㄷ. 물질이 전자를 잃으면 환원된 것이다.<br>ㄹ. 철이 녹스는 것은 철의 산화이다."},{"u":0,"l":"hard","q":"다음 중 산화 환원 반응이 아닌 것은?","c":["HCl + NaOH → NaCl + H₂O","CH₄ + 2O₂ → CO₂ + 2H₂O","2Mg + O₂ → 2MgO","Zn + 2HCl → ZnCl₂ + H₂","2H₂O → 2H₂ + O₂"],"a":0,"e":"중화 반응은 전자의 이동이 없어 산화 환원 반응이 아니다. 연소, 금속과 산의 반응, 물의 전기 분해는 산화 환원 반응이다."},{"u":0,"l":"hard","q":"Zn + 2HCl → ZnCl₂ + H₂ 반응에서 환원되는 입자는?","c":["H⁺","Zn","Cl⁻","Zn²⁺","H₂"],"a":0,"e":"Zn은 전자를 잃어 Zn²⁺이 되며 산화되고, H⁺은 전자를 얻어 H₂가 되며 환원된다."},{"u":0,"l":"hard","q":"pH가 3인 묽은 염산 10 mL에 물을 넣어 전체 부피를 100 mL로 만들면 용액의 pH는?","c":["4","2","3","5","6"],"a":0,"e":"부피가 10배가 되면 H⁺ 농도가 1/10이 되므로 pH는 1 증가하여 4가 된다."},{"u":0,"l":"hard","q":"중화 반응에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄹ 혼합 용액이 반드시 중성인 것은 아니다. 산과 염기의 양에 따라 산성, 중성, 염기성이 될 수 있다.","p":"ㄱ. 산의 H⁺과 염기의 OH⁻이 반응하여 물이 생성된다.<br>ㄴ. 중화열이 발생한다.<br>ㄷ. 염이 생성된다.<br>ㄹ. 혼합 용액은 항상 중성이다."},{"u":0,"l":"hard","q":"산과 염기에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄷ 염기 수용액은 푸른 리트머스 종이의 색을 변화시키지 않는다. 푸른 리트머스를 붉게 하는 것은 산이다.","p":"ㄱ. 산성 수용액의 pH는 7보다 작다.<br>ㄴ. 염기성 수용액에 BTB 용액을 떨어뜨리면 파란색이 된다.<br>ㄷ. 염기 수용액은 푸른 리트머스 종이를 붉게 한다.<br>ㄹ. 산은 마그네슘과 반응하여 수소를 발생시킨다."},{"u":0,"l":"hard","q":"발열 반응과 흡열 반응에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄹ"],"a":2,"e":"ㄷ 흡열 반응은 주위의 온도를 낮춘다. ㄹ 중화 반응은 발열 반응이다.","p":"ㄱ. 발열 반응은 열을 방출한다.<br>ㄴ. 연소 반응은 발열 반응이다.<br>ㄷ. 흡열 반응은 주위의 온도를 높인다.<br>ㄹ. 중화 반응은 흡열 반응이다."},{"u":0,"l":"hard","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?","c":["(라)-(나)-(다)-(가)","(가)-(다)-(나)-(라)","(라)-(다)-(나)-(가)","(나)-(라)-(다)-(가)","(다)-(나)-(라)-(가)"],"a":0,"e":"최초 생명체(선캄브리아 시대) → 삼엽충(고생대) → 공룡(중생대) → 매머드(신생대) 순이다.","p":"(가) 매머드가 번성하였다.<br>(나) 삼엽충이 번성하였다.<br>(다) 공룡이 번성하였다.<br>(라) 최초의 생명체가 나타났다."},{"u":0,"l":"hard","q":"지질 시대의 대멸종에 대한 설명으로 옳은 것은?","c":["고생대 말의 대멸종이 가장 큰 규모였다","대멸종은 한 번도 일어나지 않았다","대멸종 후에는 새로운 생물이 번성할 수 없었다","중생대 말 대멸종으로 삼엽충이 사라졌다","신생대 초에 공룡이 번성하였다"],"a":0,"e":"고생대 말에 가장 큰 대멸종이 있었고, 중생대 말에는 공룡과 암모나이트가 사라졌다. 대멸종 이후 새로운 생물군이 번성하였다."},{"u":0,"l":"hard","q":"자연 선택설에 대한 설명으로 옳지 않은 것은?","c":["개체가 일생 동안 얻은 형질이 자손에게 유전된다","같은 종의 개체들 사이에 변이가 존재한다","생존 경쟁이 일어난다","환경에 유리한 변이를 가진 개체가 더 많이 살아남는다","살아남은 개체의 변이가 자손에게 전달된다"],"a":0,"e":"후천적으로 얻은 형질이 유전된다는 것은 라마르크의 용불용설이다."},{"u":0,"l":"hard","q":"생물 다양성에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄹ 외래종 유입은 토착종을 위협해 생물 다양성을 감소시킬 수 있다.","p":"ㄱ. 같은 종 안에서 형질이 다양한 것은 유전적 다양성이다.<br>ㄴ. 종의 수가 많고 고르게 분포하면 종 다양성이 높다.<br>ㄷ. 숲, 습지, 사막 등 다양한 서식지는 생태계 다양성이다.<br>ㄹ. 외래종 유입은 생물 다양성을 항상 높인다."},{"u":0,"l":"hard","q":"HCl과 NaOH의 중화 반응에서 반응에 참여하지 않는 구경꾼 이온은?","c":["Na⁺, Cl⁻","H⁺, OH⁻","H⁺, Na⁺","OH⁻, Cl⁻","H⁺, Cl⁻"],"a":0,"e":"H⁺과 OH⁻이 물이 되고 Na⁺과 Cl⁻은 용액에 그대로 남는다."},{"u":0,"l":"hard","q":"다음 중 생물 다양성 감소의 원인과 사례를 잘못 짝지은 것은?","c":["국립공원 지정 - 서식지 파괴","벌목으로 숲이 사라짐 - 서식지 파괴","배스와 황소개구리의 유입 - 외래종","멸종 위기 동물의 과도한 사냥 - 남획","도로 건설로 서식지가 나뉨 - 서식지 단편화"],"a":0,"e":"국립공원 지정은 서식지를 보호하는 보전 방안이다."},{"u":0,"l":"ultra","q":"지질 시대에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄷ 속씨식물은 신생대에 번성하였다.","p":"ㄱ. 고생대에는 삼엽충, 필석이 번성하였다.<br>ㄴ. 중생대에는 암모나이트와 공룡이 번성하였다.<br>ㄷ. 신생대에는 겉씨식물이 번성하였다.<br>ㄹ. 선캄브리아 시대는 지질 시대 중 가장 길다."},{"u":0,"l":"ultra","q":"Fe₂O₃ + 3CO → 2Fe + 3CO₂ 반응에 대한 설명으로 옳지 않은 것은?","c":["CO는 산소를 잃어 환원된다","Fe₂O₃는 산소를 잃어 환원된다","CO는 산소를 얻어 산화된다","Fe₂O₃는 CO에게 산소를 준다","산화와 환원이 동시에 일어난다"],"a":0,"e":"CO는 산소를 얻어 CO₂가 되므로 산화된다. 산화철은 산소를 잃어 환원된다."},{"u":0,"l":"ultra","q":"(가)~(라)를 항생제 내성 세균이 증가하는 과정 순서대로 나열한 것은?","c":["(나)-(가)-(다)-(라)","(가)-(나)-(다)-(라)","(나)-(다)-(가)-(라)","(가)-(다)-(나)-(라)","(나)-(가)-(라)-(다)"],"a":0,"e":"집단에 내성 변이가 있음 → 항생제 처리로 일반 세균이 죽음 → 살아남은 내성 세균이 증식 → 내성 세균의 비율이 높은 집단 순이다.","p":"(가) 항생제 처리로 일반 세균이 대부분 죽는다.<br>(나) 세균 집단에 항생제에 견디는 변이를 가진 개체가 있다.<br>(다) 살아 에서 열로 손실되는 에너지가 줄어든다."},{"u":1,"l":"hard","q":"생태계에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3,"e":"ㄴ 에너지는 순환하지 않고 한 방향으로 흐른다.","p":"ㄱ. 생산자는 빛에너지를 화학 에너지로 전환한다.<br>ㄴ. 에너지는 생태계 안에서 순환한다.<br>ㄷ. 분해자는 사체와 배설물을 무기물로 분해한다.<br>ㄹ. 먹이 그물은 여러 먹이 사슬이 얽힌 것이다."},{"u":1,"l":"hard","q":"온실 효과와 지구 온난화에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄹ 자연적인 온실 효과는 인간 활동 이전에도 있었다. 인간 활동은 온실 기체를 늘려 온실 효과를 강화하였다.","p":"ㄱ. 온실 기체는 지구 복사 에너지를 흡수한 뒤 재방출한다.<br>ㄴ. 온실 기체의 증가는 지구 온난화의 주요 원인이다.<br>ㄷ. 지구 온난화로 극지방 빙하가 줄어든다.<br>ㄹ. 온실 효과는 인간 활동으로 처음 나타난 현상이다."},{"u":1,"l":"hard","q":"공급한 에너지가 100 J이고 유용한 에너지가 30 J인 기계 A와 공급한 에너지가 80 J이고 유용한 에너지가 32 J인 기계 B가 있다. 에너지 효율을 옳게 비교한 것은?","c":["A는 30 %, B는 40 %로 B가 더 높다","A는 30 %, B는 40 %로 A가 더 높다","A와 B의 효율이 같다","A는 70 %, B는 60 %이다","A는 30 %, B는 32 %로 B가 약간 높다"],"a":0,"e":"A = 30 ÷ 100 = 30 %, B = 32 ÷ 80 = 40 %이다. 공급한 에너지의 양이 다르므로 비율로 비교해야 한다."},{"u":1,"l":"hard","q":"풍력 발전에 대한 설명으로 옳지 않은 것은?","c":["날씨나 바람의 세기와 관계없이 항상 일정한 양의 전기를 생산한다","발전 과정에서 이산화 탄소를 거의 배출하지 않는다","재생 가능한 에너지이다","설치 지역이 제한될 수 있다","바람의 운동 에너지를 전기 에너지로 전환한다"],"a":0,"e":"풍력 발전은 바람의 세기에 따라 발전량이 달라진다."},{"u":1,"l":"hard","q":"원자력 발전과 화력 발전에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄹ 방사성 폐기물은 원자력 발전의 문제이다. 화력 발전은 이산화 탄소 배출이 문제이다.","p":"ㄱ. 원자력 발전은 핵분열 에너지를 이용한다.<br>ㄴ. 화력 발전은 화석 연료 연소 시 이산화 탄소를 배출한다.<br>ㄷ. 원자력 발전은 방사성 폐기물 처리가 문제이다.<br>ㄹ. 화력 발전은 방사성 폐기물을 많이 배출한다."},{"u":1,"l":"hard","q":"탄소 순환에 대한 설명으로 옳지 않은 것은?","c":["화석 연료의 연소는 대기 중 이산화 탄소를 줄인다","광합성은 대기 중 이산화 탄소를 줄인다","호흡은 대기 중 이산화 탄소를 늘린다","생물의 사체는 분해되어 탄소가 순환한다","화석 연료는 오랜 시간 쌓인 생물의 유해에서 만들어졌다"],"a":0,"e":"화석 연료를 태우면 이산화 탄소가 대기로 방출되어 농도가 증가한다."},{"u":1,"l":"hard","q":"수력 발전소에서 질량 1,000 kg인 물이 높이 10 m에서 떨어질 때 위치 에너지가 모두 운동 에너지로 전환되고 이 중 80 %가 전기 에너지가 된다면 생산되는 전기 에너지는? (g = 10 m/s²)","c":["80,000 J","100,000 J","8,000 J","10,000 J","800,000 J"],"a":0,"e":"위치 에너지 = 1,000 × 10 × 10 = 100,000 J이고 80 %는 80,000 J이다."},{"u":1,"l":"hard","q":"기후 변화를 줄이기 위한 노력으로 옳지 않은 것은?","c":["화석 연료 사용량을 계속 늘린다","에너지 효율이 높은 제품을 사용한다","신재생 에너지의 비중을 늘린다","대중교통을 이용한다","숲을 보호하고 가꾼다"],"a":0,"e":"온실 기체 배출을 줄이는 것이 기후 변화 대응의 핵심이다."},{"u":1,"l":"hard","q":"핵분열과 핵융합에 대한 설명으로 옳은 것은?","c":["핵분열은 무거운 핵이 쪼개지고 핵융합은 가벼운 핵이 합쳐지는 반응이다","핵분열은 가벼운 핵이 합쳐지고 핵융합은 무거운 핵이 쪼개진다","두 반응 모두 질량이 늘어난다","두 반응 모두 에너지가 흡수된다","핵분열은 태양에서 일어난다"],"a":0,"e":"원자력 발전은 핵분열, 태양의 에너지 생성은 핵융합이다."},{"u":1,"l":"ultra","q":"지구 온난화의 영향으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1,"e":"ㄷ 해수의 pH는 낮아지는 쪽이다. 이산화 탄소가 많이 녹으면 해양이 산성화된다.","p":"ㄱ. 극지방의 빙하가 감소한다.<br>ㄴ. 해수면이 상승한다.<br>ㄷ. 바닷물의 pH가 높아진다.<br>ㄹ. 생물의 서식지가 변한다."},{"u":1,"l":"ultra","q":"어떤 화력 발전소에서 연료가 가진 화학 에너지 1,000 J이 열에너지 400 J으로 전환되었고, 이 중 전기 에너지가 300 J 생산되었다. 연료에 대한 전체 에너지 효율은?","c":["30 %","40 %","75 %","70 %","300 %"],"a":0,"e":"전체 효율 = 전기 에너지 ÷ 연료의 화학 에너지 × 100 = 300 ÷ 1,000 × 100 = 30 %이다."},{"u":1,"l":"ultra","q":"신재생 에너지에 대한 설명으로 옳지 않은 것은?","c":["지열 발전은 화석 연료를 태워 열을 얻는다","태양광 발전은 태양 전지를 이용한다","조력 발전은 밀물과 썰물의 차를 이용한다","바이오 에너지는 생물 자원을 이용한다","수소 연료 전지는 수소와 산소의 반응을 이용한다"],"a":0,"e":"지열 발전은 지구 내부의 열에너지를 이용한다."},{"u":1,"l":"ultra","q":"(가)~(라)를 화력 발전에서 전기가 만들어지는 순서대로 나열한 것은?","c":["(나)-(다)-(가)-(라)","(가)-(나)-(다)-(라)","(나)-(가)-(다)-(라)","(다)-(나)-(가)-(라)","(나)-(다)-(라)-(가)"],"a":0,"e":"연료 연소로 열 발생 → 물이 수증기로 변함 → 터빈 회전 → 발전기에서 전기 생산 순이다.","p":"(가) 터빈이 회전한다.<br>(나) 연료가 연소하며 열에너지가 발생한다.<br>(다) 물이 수증기로 변한다.<br>(라) 발전기에서 전기 에너지가 생산된다."},{"u":1,"l":"ultra","q":"생태계 평형에 대한 설명으로 옳지 않은 것은?","c":["먹이 그물이 단순할수록 평형이 잘 유지된다","먹이 사슬의 한 단계가 변해도 다른 단계의 변화로 평형이 회복될 수 있다","천적이 사라지면 피식자의 수가 증가할 수 있다","환경 변화가 너무 크면 평형이 깨질 수 있다","먹이 그물이 복잡할수록 평형이 잘 유지된다"],"a":0,"e":"먹이 그물이 복잡할수록 한 종이 사라져도 다른 먹이원이 있어 평형이 잘 유지된다."},{"u":1,"l":"ultra","q":"에너지 전환과 효율에 대한 설명으로 옳은 것을 모두 고른 것은?","c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄹ"],"a":1,"e":"ㄱ 에너지는 전환되어도 총량이 보존되며 사라지지 않고, ㄷ 열로 방출된 에너지도 소멸한 것이 아니라 이용하기 어려운 형태가 된 것이다.","p":"ㄱ. 에너지가 전환될 때 일부는 사라진다.<br>ㄴ. 에너지 효율이 높을수록 같은 일에 필요한 에너지가 줄어든다.<br>ㄷ. 열로 방출된 에너지는 소멸한 것이다.<br>ㄹ. 에너지 효율은 100 %를 넘을 수 없다."},{"u":0,"l":"mid","q":"그림은 HCl 수용액 (가)와 NaOH 수용액 (나)에 들어 있는 이온을 모형으로 나타낸 것이다. 두 용액을 모두 섞었을 때 (다)에 대한 설명으로 옳은 것은?","img":"<svg viewBox=\"0 0 520 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif\" style=\"max-width:520px\"><defs><marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#223\"/></marker><marker id=\"arr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#c0272d\"/></marker></defs><rect width=\"520\" height=\"200\" rx=\"8\" fill=\"#f7f9ff\" stroke=\"#c5cdea\"/><rect x=\"20\" y=\"34\" width=\"140\" height=\"120\" rx=\"4\" fill=\"#eef6ff\" stroke=\"#4a6fa5\" stroke-width=\"1.5\"/><text x=\"90\" y=\"28\" font-size=\"12\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">(가) HCl</text><circle cx=\"42\" cy=\"58\" r=\"11\" fill=\"#ffcdd2\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"42\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">H⁺</text><circle cx=\"90\" cy=\"58\" r=\"11\" fill=\"#c8e6c9\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"90\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">Cl⁻</text><circle cx=\"138\" cy=\"58\" r=\"11\" fill=\"#ffcdd2\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"138\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">H⁺</text><circle cx=\"42\" cy=\"88\" r=\"11\" fill=\"#c8e6c9\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"42\" y=\"92\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">Cl⁻</text><circle cx=\"90\" cy=\"88\" r=\"11\" fill=\"#ffcdd2\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"90\" y=\"92\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">H⁺</text><circle cx=\"138\" cy=\"88\" r=\"11\" fill=\"# ],"a":0,"e":"H⁺ 3개와 OH⁻ 2개가 반응하여 물 2분자가 생성되고 H⁺ 1개가 남으므로 산성이다. Na⁺과 Cl⁻은 반응에 참여하지 않는 구경꾼 이온이다."},{"u":0,"l":"hard","q":"위 그림에서 (가)와 (나)를 모두 섞은 용액 (다)에 들어 있는 이온의 종류와 수를 옳게 나타낸 것은?","img":"<svg viewBox=\"0 0 520 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif\" style=\"max-width:520px\"><defs><marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#223\"/></marker><marker id=\"arr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#c0272d\"/></marker></defs><rect width=\"520\" height=\"200\" rx=\"8\" fill=\"#f7f9ff\" stroke=\"#c5cdea\"/><rect x=\"20\" y=\"34\" width=\"140\" height=\"120\" rx=\"4\" fill=\"#eef6ff\" stroke=\"#4a6fa5\" stroke-width=\"1.5\"/><text x=\"90\" y=\"28\" font-size=\"12\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">(가) HCl</text><circle cx=\"42\" cy=\"58\" r=\"11\" fill=\"#ffcdd2\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"42\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">H⁺</text><circle cx=\"90\" cy=\"58\" r=\"11\" fill=\"#c8e6c9\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"90\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">Cl⁻</text><circle cx=\"138\" cy=\"58\" r=\"11\" fill=\"#ffcdd2\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"138\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">H⁺</text><circle cx=\"42\" cy=\"88\" r=\"11\" fill=\"#c8e6c9\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"42\" y=\"92\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">Cl⁻</text><circle cx=\"90\" cy=\"88\" r=\"11\" fill=\"#ffcdd2\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"90\" y=\"92\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">H⁺</text><circle cx=\"138\" cy=\"88\" r=\"11\" fill=\"#c8e6c9\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"138\" y=\"92\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">Cl⁻</text><text x=\"180\" y=\"100\" font-size=\"24\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">+</text><rect x=\"200\" y=\"34\" width=\"140\" height=\"120\" rx=\"4\" fill=\"#eef6ff\" stroke=\"#4a6fa5\" stroke-width=\"1.5\"/><text x=\"270\" y=\"28\" font-size=\"12\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">(나) NaOH</text><circle cx=\"222\" cy=\"58\" r=\"11\" fill=\"#bbdefb\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"222\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">Na⁺</text><circle cx=\"270\" cy=\"58\" r=\"11\" fill=\"#fff59d\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"270\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">OH⁻</text><circle cx=\"318\" cy=\"58\" r=\"11\" fill=\"#bbdefb\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"318\" y=\"62\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">Na⁺</text><circle cx=\"222\" cy=\"88\" r=\"11\" fill=\"#fff59d\" stroke=\"#334\" stroke-width=\"1\"/><text x=\"222\" y=\"92\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">OH⁻</text><text x=\"365\" y=\"100\" font-size=\"24\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">→</text><rect x=\"385\" y=\"34\" width=\"120\" height=\"120\" rx=\"4\" fill=\"#fff\" stroke=\"#4a6fa5\" stroke-width=\"1.5\"/><text x=\"445\" y=\"100\" font-size=\"30\" fill=\"#c0272d\" text-anchor=\"middle\" font-weight=\"700\">?</text><text x=\"445\" y=\"28\" font-size=\"12\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">(다) 혼합 용액</text><text x=\"260\" y=\"185\" font-size=\"11\" fill=\"#445\" text-anchor=\"middle\" font-weight=\"400\">HCl 수용액과 NaOH 수용액을 모두 섞는다</text></svg>","c":["H⁺ 1개, Cl⁻ 3개, Na⁺ 2개","H⁺ 3개, Cl⁻ 3개, Na⁺ 2개","Cl⁻ 3개, Na⁺ 2개","H⁺ 1개, Cl⁻ 3개, Na⁺ 2개, OH⁻ 2 \" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#223\"/></marker><marker id=\"arr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#c0272d\"/></marker></defs><rect width=\"440\" height=\"200\" rx=\"8\" fill=\"#f7f9ff\" stroke=\"#c5cdea\"/><rect x=\"20\" y=\"90\" width=\"70\" height=\"24\" rx=\"2\" fill=\"#ef5350\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"90\" width=\"70\" height=\"24\" rx=\"2\" fill=\"#42a5f5\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"55\" y=\"107\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\">N</text><text x=\"125\" y=\"107\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\">S</text><line x1=\"170\" y1=\"102\" x2=\"225\" y2=\"102\" stroke=\"#222\" stroke-width=\"3\" marker-end=\"url(#arr)\"/><text x=\"198\" y=\"88\" font-size=\"11\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"400\">접근</text><path d=\"M240 60 q30 -16 30 0 t0 24 q-30 16 -30 0 t0 -24 M240 84 q30 -16 30 0 t0 24 q-30 16 -30 0 t0 -24 M240 108 q30 -16 30 0 t0 24 q-30 16 -30 0 t0 -24\" fill=\"none\" stroke=\"#b8860b\" stroke-width=\"3\"/><line x1=\"240\" y1=\"128\" x2=\"240\" y2=\"170\" stroke=\"#222\" stroke-width=\"2\"/><line x1=\"270\" y1=\"128\" x2=\"270\" y2=\"170\" stroke=\"#222\" stroke-width=\"2\"/><line x1=\"240\" y1=\"170\" x2=\"300\" y2=\"170\" stroke=\"#222\" stroke-width=\"2\"/><circle cx=\"340\" cy=\"150\" r=\"34\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><line x1=\"340\" y1=\"150\" x2=\"358\" y2=\"134\" stroke=\"#c0272d\" stroke-width=\"3\"/><text x=\"340\" y=\"198\" font-size=\"11\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"400\">검류계</text><line x1=\"300\" y1=\"170\" x2=\"300\" y2=\"150\" stroke=\"#222\" stroke-width=\"2\"/><line x1=\"300\" y1=\"150\" x2=\"306\" y2=\"150\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"255\" y=\"42\" font-size=\"11\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">코일</text></svg>","c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":3,"e":"ㄹ 자석을 정지시키면 자기장이 변하지 않아 유도 전류가 흐르지 않는다. ㄱ 더 빠르게, ㄴ 더 센 자석, ㄷ 코일을 더 많이 감으면 유도 전류가 커진다.","p":"ㄱ. 자석을 더 빠르게 움직인다.<br>ㄴ. 더 센 자석을 사용한다.<br>ㄷ. 코일의 감은 수를 늘린다.<br>ㄹ. 자석을 코일 속에 가만히 둔다."},{"u":1,"l":"mid","q":"그림은 원자력 발전에서 일어나는 반응을 모형으로 나타낸 것이다. 이 반응과 (가)에 대한 설명으로 옳은 것은?","img":"<svg viewBox=\"0 0 460 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif\" style=\"max-width:460px\"><defs><marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#223\"/></marker><marker id=\"arr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#c0272d\"/></marker></defs><rect width=\"460\" height=\"170\" rx=\"8\" fill=\"#f7f9ff\" stroke=\"#c5cdea\"/><circle cx=\"40\" cy=\"85\" r=\"6\" fill=\"#555\" stroke=\"none\" stroke-width=\"1\"/><text x=\"40\" y=\"70\" font-size=\"11\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"400\">중성자</text><line x1=\"50\" y1=\"85\" x2=\"120\" y2=\"85\" stroke=\"#222\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><circle cx=\"150\" cy=\"85\" r=\"28\" fill=\"#ffb74d\" stroke=\"#e65100\" stroke-width=\"2\"/><text x=\"150\" y=\"90\" font-size=\"12\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">U-235</text><text x=\"210\" y=\"90\" font-size=\"22\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">→</text><circle cx=\"260\" cy=\"50\" r=\"18\" fill=\"#a5d6a7\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"260\" y=\"55\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">핵</text><circle cx=\"260\" cy=\"125\" r=\"18\" fill=\"#a5d6a7\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"260\" y=\"130\" font-size=\"10\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">핵</text><circle cx=\"330\" cy=\"40\" r=\"5\" fill=\"#555\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"340\" cy=\"85\" r=\"5\" fill=\"#555\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"330\" cy=\"135\" r=\"5\" fill=\"#555\" stroke=\"none\" stroke-width=\"1\"/><text x=\"385\" y=\"90\" font-size=\"13\" fill=\"#c0272d\" text-anchor=\"middle\" font-weight=\"700\">(가)</text><text x=\"385\" y=\"108\" font-size=\"10\" fill=\"#c0272d\" text-anchor=\"middle\" font-weight=\"400\">막대한 에너지</text><text x=\"230\" y=\"160\" font-size=\"10\" fill=\"#445\" text-anchor=\"middle\" font-weight=\"400\">중성자 3개 방출</text></svg>","c":["무거운 원자핵이 분열하며 질량이 줄어든 만큼 막대한 에너지가 방출된다","가벼운 원자핵이 합쳐지는 핵융합이다","화학 반응으로 연료가 연소하는 것이다","에너지가 새로 만들어지는 것이므로 에너지 보존 법칙이 성립하지 않는다","반응 후 질량이 늘어난다"],"a":0,"e":"우라늄-235 같은 무거운 핵이 분열하는 핵분열이며, 질량 결손에 해당하는 에너지(E = mc²)가 방출된다. 에너지 보존 법칙은 성립한다."},{"u":1,"l":"mid","q":"그림은 연료 전지의 구성을 나타낸 것이다. (가)와 (나)에 들어가는 물질을 옳게 짝지은 것은?","img":"<svg viewBox=\"0 0 420 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif\" style=\"max-width:420px\"><defs><marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#223\"/></marker><marker id=\"arr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0L9,4.5L0,9z\" fill=\"#c0272d\"/></marker></defs><rect width=\"420\" height=\"200\" rx=\"8\" fill=\"#f7f9ff\" stroke=\"#c5cdea\"/><rect x=\"110\" y=\"40\" width=\"200\" height=\"110\" rx=\"8\" fill=\"#eef6ff\" stroke=\"#4a6fa5\" stroke-width=\"1.5\"/><text x=\"210\" y=\"95\" font-size=\"13\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"700\">연료 전지</text><line x1=\"30\" y1=\"70\" x2=\"110\" y2=\"70\" stroke=\"#222\" stroke-width=\"3\" marker-end=\"url(#ar)\"/><text x=\"30\" y=\"58\" font-size=\"12\" fill=\"#222\" text-anchor=\"start\" font-weight=\"700\">(가)</text><line x1=\"30\" y1=\"120\" x2=\"110\" y2=\"120\" stroke=\"#222\" stroke-width=\"3\" marker-e var QO={"easy":[{"q":"인간의 욕구에 비해 이를 충족시킬 자원이 부족한 상태를 무엇이라 하는가?","c":["희소성","효용","생산성","유동성","경쟁"],"a":0,"e":"자원은 한정되어 있는데 욕구는 무한하므로 희소성이 나타나고, 이 때문에 선택의 문제가 생긴다.","u":0},{"q":"어떤 선택으로 포기한 대안 중 가장 가치가 큰 것의 가치를 무엇이라 하는가?","c":["기회비용","매몰 비용","명시적 비용","한계 효용","물가"],"a":0,"e":"기회비용은 선택으로 포기한 대안 중 가장 큰 가치를 말한다.","u":0},{"q":"아담 스미스가 개인의 이익 추구가 시장의 가격 기능을 통해 사회 전체의 이익으로 이어진다고 설명하며 쓴 표현은?","c":["보이지 않는 손","유효 수요","규모의 경제","비교 우위","수정 자본주의"],"a":0,"e":"애덤 스미스는 '보이지 않는 손'으로 시장의 자율 조정 기능을 설명하였다.","u":0},{"q":"시장 경제의 특징으로 옳은 것은?","c":["사유 재산권이 보장되고 경제 활동의 자유가 인정된다","정부가 모든 생산과 분배를 결정한다","생산 수단을 국가가 소유한다","경쟁이 금지된다","가격은 법으로만 정해진다"],"a":0,"e":"시장 경제는 사유 재산권 보장, 경제 활동의 자유, 경쟁, 가격 기능을 바탕으로 한다.","u":0},{"q":"1929년 대공황 이후 정부의 시장 개입을 강조하게 된 자본주의로, 뉴딜 정책이 대표적인 것은?","c":["수정 자본주의","상업 자본주의","산업 자본주의","신자유주의","정보 자본주의"],"a":0,"e":"대공황 이후 정부가 재정 지출 등으로 시장에 개입하는 수정 자본주의가 등장하였다.","u":0},{"q":"1970년대 석유 파동 이후 작은 정부, 규제 완화, 공기업 민영화를 강조하며 등장한 경제 사상은?","c":["신자유주의","중상주의","수정 자본주의","사회주의","보호 무역주의"],"a":0,"e":"스태그플레이션 이후 정부 개입의 한계를 비판하며 신자유주의가 확산되었다.","u":1},{"q":"소비자가 환경, 인권, 공정성 등을 고려하여 상품을 선택하는 소비를 무엇이라 하는가?","c":["윤리적 소비","과시 소비","충동 소비","모방 소비","과소비"],"a":0,"e":"윤리적 소비는 소비가 사회와 환경에 미치는 영향을 고려하는 소비 방식이다.","u":1},{"q":"기업이 이윤 추구와 함께 사회와 환경에 대한 책임을 다하는 것을 무엇이라 하는가?","c":["기업의 사회적 책임(CSR)","독점","담합","합병","차명 거래"],"a":0,"e":"기업은 법을 지키고 환경 보호, 공정한 거래, 노동자 권리 보호 등 사회적 책임을 다해야 한다.","u":1},{"q":"금융 자산을 선택하는 기준 중, 필요할 때 쉽게 현금으로 바꿀 수 있는 정도를 무엇이라 하는가?","c":["유동성","수익성","안전성","생산성","효율성"],"a":0,"e":"자산 선택의 기준은 수익성, 안전성, 유동성이다.","u":1},{"q":"예금, 주식, 채권 중 일반적으로 높은 수익을 기대할 수 있지만 원금 손실 위험도 큰 자산은?","c":["주식","예금","국채","적금","현금"],"a":0,"e":"주식은 수익성이 높은 대신 안전성이 낮은 대표적인 자산이다.","u":1},{"q":"각 나라가 더 잘 생산할 수 있는 재화에 특화하여 교환하는 것을 무엇이라 하는가?","c":["국제 분업","국제 담합","관세 부과","자급자족","환율 조정"],"a":0,"e":"국가마다 자원, 기술, 노동력이 달라 특화와 교환(국제 분업)이 이루어진다.","u":1},{"q":"국가 간 관세 등 무역 장벽을 낮추어 자유 무역을 확대하기로 맺는 협정은?","c":["자유 무역 협정(FTA)","군사 동맹","상호 방위 조약","정전 협정","환경 협약"],"a":0,"e":"FTA는 체결국 사이의 관세와 비관세 장벽을 줄이거나 없애는 협정이다.","u":1},{"q": function similar(ids){
  var wq=shuf(ids).slice(0,10).map(function(id){return BYID[id];}),used={},out=[],round=0;
  var cand=ALL.filter(function(q){return ids.indexOf(q.id)<0;});
  while(out.length<10&&round<10&&cand.length){
    for(var i=0;i<wq.length&&out.length<10;i++){
      var w=wq[i],best=null,bs=-1;
      for(var j=0;j<cand.length;j++){var c=cand[j];if(used[c.id])continue;var sc=sim(w,c)+Math.random()*1.5;if(sc>bs){bs=sc;best=c;}}
      if(best){used[best.id]=1;out.push(best);}
    }
    round++;
  }
  return shuf(out);
}

  var ids=wrongList(),h='<h1>📕 오답노트</h1><p class="sub">'+(ids.length?'틀린 문제 '+ids.length+'개 · 다시 맞히면 자동으로 사라져요':'아직 틀린 문제가 없어요.<br>퀴즈를 풀다 틀리면 여기에 자동으로 모여요!')+'</p>';
  h+='<div class="row" style="margin:0 0 14px"><button class="btn b" id="nbk" type="button">&#9664; 처음으로</button>';
  if(ids.length)h+='<button class="btn o" id="nre" type="button">틀린 문제 다시 풀기</button><button class="btn" id="nva" type="button">변형 문제 풀기</button>';
  h+='</div>';
  if(ids.length)h+='<p class="sub" style="margin:0 0 12px">변형 문제 = 틀린 문제와 같은 유형·같은 주제의 비슷한 문제 10개</p>';
  ids.slice().reverse().forEach(function(id){
    var q=BYID[id];
    h+='<div class="q"><div class="qn">'+UN[q.u].no+'단원<span class="tag">'+tOf(q)+'</span></div><p class="qt" style="font-size:15px">'+q.q+'</p>'+(q.p||q.img?'<div class="box">'+(q.p||'')+(q.img?'<div class="pic">'+q.img+'</div>':'')+'</div>':'')+'<small>정답: '+NUM[q.a]+' '+q.c[q.a]+'<br>'+q.e+'</small><div style="text-align:right;margin-top:8px"><button class="btn b s" data-d="'+id+'" type="button">삭제</button></div></div>';
  });
  if(ids.length)h+='<div class="row"><button class="btn r s" id="nall" type="button">오답노트 비우기</button></div>';
  $("notes").innerHTML=h;
  $("nbk").onclick=home;
  if($("nre"))$("nre").onclick=function(){startSp("w");};
  if($("nva"))$("nva").onclick=function(){startSp("v");};
  [].forEach.call($("notes").querySelectorAll("[data-d]"),function(b){b.onclick=function(){delWrong(b.getAttribute("data-d"));notes();};});
  if($("nall")){var armed=false;$("nall").onclick=function(){if(!armed){armed=true;$("nall").textContent="정말 비울까요? 한 번 더 누르세요";}else{setWrong([]);notes();}};}
  window.scrollTo(0,0);
}
function home(){
  hideAll();$("home").hidden=false;
  var ks=SB==="k";$("hh").textContent=ks?"한국사 퀴즈":SB==="s"?"통합과학2 퀴즈":"통합사회 퀴즈";$("hs").innerHTML=ks?"한국사 2 · 대한민국의 발전 ~ 오늘날의 대한민국<br>먼저 단원(2단원·3단원·전체)을 고르고, 그다음 초보·중수·고수·초고수를 골라요":SB==="s"?"통합과학2 · 변화와 다양성 ~ 환경과 에너지<br>먼저 단원을 고르고, 그다음 난이도를 골라요":"통합사회 · Ⅲ 시장경제와 지속가능발전<br>먼저 단원을 고르고, 그다음 난이도를 골라요";
  var h='<button class="btn b" id="sbk" type="button" style="align-self:flex-start">&#9664; 과목 선택</button>'+'<button class="lvc" id="exbtn" type="button" style="border-color:#ffe45c"><i>50분 · 23문항</i><b>📝 실전 모의고사</b><span>'+(ks?'초보 4 · 중수 8 · 고수 11문항(사료·지도·그래프 3문항 포함)을 섞어':'초보 4 · 중수 8 · 고수 11문항을 섞어')+' 풀어요. 정답은 제출 후에 공개돼요.</span></button>'+'<button class="lvc" id="infbtn" type="button" style="border-color:#7ee0a5"><i>∞ 문제</i><b>♾️ 무한 모드</b><span>풀 때마다 숫자와 보기가 새로 만들어져요. '+(ks?'사건 순서·정부 시기·설명 찾기 등을 매번 새로 조합해요.':SB==="s"?'효율·pH·이온 수 등 계산 문제와 개념 문제가 계속 나와요.':'이자·환율·비교 우위·수요 공급 등 계산 문제가 계속 나와요.')+' 10문제씩 끝없이 이어져요. 오답노트에는 저장되지 않아요.</span></button><button class="lvc" id="notebtn" type="button" style="border-color:#ff5c6c"><i>'+wrongList().length+'문제</i><b>📕 오답노트</b><span>틀린 문제를 모아 보고, 비슷한 유형의 변형 문제로 다시 연습해요.</span></button><button class="lvc" data-u="-1" type="button"><i>'+(cnt("easy",-1)+cnt("mid",-1)+cnt("hard",-1)+cnt("ultra",-1))+'문제</i><b>전체 단원</b><span>모든 단원의 문제가 섞여 나와요.</span></button>';
  UN.forEach(function(u,i){h+='<button class="lvc" data-u="'+i+'" type="button"><i>'+(cnt("easy",i)+cnt("mid",i)+cnt("hard",i)+cnt("ultra",i))+'문제</i><b>'+u.no+'단원 · '+u.n+'</b><span>'+u.d+'</span></button>';});
  $("lv").innerHTML=h;
  [].forEach.call($("lv").querySelectorAll(".lvc[data-u]"),function(b){b.onclick=function(){lvPick(+b.getAttribute("data-u"));};});
  $("notebtn").onclick=notes;$("infbtn").onclick=startInf;
  if($("exbtn"))$("exbtn").onclick=startExam;$("sbk").onclick=subjects;
}
function lvPick(u){
  curU=u;hideAll();$("home").hidden=false;
  $("hh").textContent=u<0?"전체 단원":UN[u].no+"단원 · "+UN[u].n;$("hs").textContent="난이도를 골라 주세요";
  var h='<button class="btn b" id="bk" type="button" style="align-self:flex-start">&#9664; 단원 선택</button>';
  LV.forEach(function(l){var b=sv(bk(l.k,u)),c=cnt(l.k,u);h+='<button class="lvc" data-k="'+l.k+'" type="button"'+(c?'':' disabled style="opacity:.45"')+'><i>'+(b?"최고 "+b+"점 · ":"")+"새 문제 "+rem(l.k,u)+"/"+c+'</i><b>'+l.n+'</b><span>'+l.d+'</span></button>';});
  $("lv").innerHTML=h;$("bk").onclick=home;
  [].forEach.call($("lv").querySelectorAll(".lvc"),function(b){b.onclick=function(){if(!b.disabled)start(b.getAttribute("data-k"));};});
}
function seenOf(k){var s=[];try{s=JSON.parse(sv(PFX+"hqs_"+k)||"[]");}catch(e){s=[];}return s;}
function rem(k,u){var s=seenOf(k),c=0;for(var i=0;i<Q[k].length;i++)if(inU(Q[k][i],u)&&s.indexOf(i)<0)c++;return c;}
function pickSet(k,u){
  var pool=Q[k],n=10,seen=seenOf(k),cand=[],i,pick=[];
  for(i=0;i<pool.length;i++)if(inU(pool[i],u))cand.push(i);
  function un(a){return a.filter(function(x){return seen.indexOf(x)<0&&pick.indexOf(x)<0;});}
  var W=SB==="s"?4:(k==="hard"?2:0);
  if(W){
    var im=cand.filter(function(x){return pool[x].img;});
    pick=shuf(un(im)).slice(0,W);
    if(pick.length<W)pick=pick.concat(shuf(im.filter(function(x){return pick.indexOf(x)<0;})).slice(0,W-pick.length));
  }
  pick=pick.concat(shuf(un(cand)).slice(0,n-pick.length));
  if(pick.length<n){
    var rest=cand.filter(function(x){return pick.indexOf(x)<0;});
    pick=pick.concat(shuf(rest).slice(0,n-pick.length));
    seen=seen.filter(function(x){return cand.indexOf(x)<0;}).concat(pick);
  }else seen=seen.concat(pick);
  sv(PFX+"hqs_"+k,JSON.stringify(seen));
  return shuf(pick).map(function(x){return pool[x];});
}
function start(k){
  cur=LV.filter(function(l){return l.k===k;})[0];
  list=pickSet(k,curU);idx=0;ok=0;wrong=[];
  hideAll();$("play").hidden=false;
  $("lvn").textContent=(curU<0?"전체":UN[curU].no+"단원")+" · "+cur.n;
  show();
}
function show(){
  var q=list[idx];
  q._o=/^(ㄱ|ㄴ|ㄷ|ㄹ|\()/.test(q.c[0])&&/^(ㄱ|ㄴ|ㄷ|ㄹ|\()/.test(q.c[4])?[0,1,2,3,4]:shuf([0,1,2,3,4]);q._k=q._o.indexOf(q.a);
  $("cnt").textContent=(idx+1)+" / "+list.length;
  $("bf").style.width=(idx/list.length*100)+"%";
  $("nx").hidden=true;
  var h='<div class="qn">문제 '+(idx+1)+(q.s?' · 사료 분석':'')+'</div><p class="qt">'+q.q+'</p>';
  if(q.p||q.img)h+='<div class="box">'+(q.s?'<b style="color:var(--yellow)">[사료]</b><br>':'')+(q.p||'')+(q.img?'<div class="pic">'+q.img+'</div>':'')+'</div>';
  h+='<div class="ch">';
  q._o.forEach(function(oi,i){h+='<button class="c" data-i="'+i+'" type="button"><em>'+NUM[i]+'</em><span>'+q.c[oi]+'</span></button>';});
  h+='</div><div id="exp"></div>';
  $("qb").innerHTML=h;
  [].forEach.call($("qb").querySelectorAll(".c"),function(b){b.onclick=function(){pick(+b.getAttribute("data-i"));};});
  window.scrollTo(0,0);
}
function pick(i){
  var q=list[idx],bs=$("qb").querySelectorAll(".c"),good=i===q._k;
  [].forEach.call(bs,function(b,n){b.disabled=true;if(n===q._k)b.className="c ok";else if(n===i)b.className="c no";});
  if(good){ok++;delWrong(q.id);}else{wrong.push({q:q,my:i});if(!q.gen)addWrong(q);}
  $("exp").innerHTML='<div class="ex"><b>'+(good?"정답입니다! ⭕":"오답입니다. ❌ 정답은 "+NUM[q._k])+'</b>'+q.e+'</div>';
  $("bf").style.width=((idx+1)/list.length*100)+"%";
  $("nx").textContent=idx+1<list.length?"다음 문제 ▶":"결과 보기 ▶";
  $("nx").hidden=false;
}
$("nx").onclick=function(){idx++;if(idx<list.length)show();else finish();};
function finish(){
  hideAll();$("end").hidden=false;if(cur.sp==="i"){infTot+=list.length;infOk+=ok;}
  var sc=Math.round(ok/list.length*100),old=cur.sp?0:+(sv(bk(cur.k,curU))||0);
  if(!cur.sp&&sc>old)sv(bk(cur.k,curU),String(sc));
  var m=sc===100?"만점! "+(SB==="k"?"한국사":SB==="s"?"통합과학":"통합사회")+" 완전 정복 🏆":sc>=75?"훌륭해요! 1등급 도전 가능 👍":sc>=50?"좋아요, 틀린 문제만 복습해 봐요 📖":"기본 개념부터 다시 다져 봐요 💪";
  var h='<h1>'+cur.n+' 결과</h1><div class="score">'+sc+'점</div><p class="sub">'+list.length+'문제 중 '+ok+'문제 정답 · '+m+(cur.sp==="i"?'<br>이번 접속 누적 '+infTot+'문제 중 '+infOk+'문제 정답':'')+'</p>';
  if(wrong.length){h+='<div class="rev"><b>이번 판 오답</b>';wrong.forEach(function(w){h+='<div class="q"><p class="qt" style="font-size:15px">'+w.q.q+'</p>'+(w.q.p||w.q.img?'<div class="box">'+(w.q.p||'')+(w.q.img?'<div class="pic">'+w.q.img+'</div>':'')+'</div>':'')+'<small>내 답: '+NUM[w.my]+' '+w.q.c[w.q._o[w.my]]+'<br>정답: '+NUM[w.q._k]+' '+w.q.c[w.q.a]+'<br>'+w.q.e+'</small></div>';});h+='</div>';}
  h+='<div class="row"><button class="btn o" id="re" type="button">'+(cur.sp==="v"?'새 변형 문제 풀기':cur.sp==="i"?'새 10문제 계속 풀기':'다시 풀기')+'</button>'+(cur.sp?'':'<button class="btn b" id="hm" type="button">난이도 선택</button>')+'<button class="btn" id="hu" type="button">단원 선택</button><button class="btn r" id="nb" type="button">📕 오답노트 ('+wrongList().length+')</button></div>';
  $("end").innerHTML=h;
  $("re").onclick=function(){if(cur.sp==="i")startInf();else if(cur.sp)startSp(cur.sp);else start(cur.k);};
  if($("hm"))$("hm").onclick=function(){lvPick(curU);};
  $("hu").onclick=home;$("nb").onclick=notes;
  window.scrollTo(0,0);
}
subjects();
try{parent.postMessage("gm-ready",location.origin);}catch(e){}
})();
</script>
