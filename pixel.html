<script>
/* =====================================================================
 *  SUPER PIXEL BROS.  —  단일 HTML 파일 횡스크롤 플랫폼 게임
 *  조작: ← → 이동 / Space(↑) 점프(길게 = 높게) / Z·X·Shift 달리기+불꽃
 *        Enter 시작 / P 일시정지 / M 소리 끄기·켜기      (마우스 불필요)
 *
 *  ※ 스프라이트는 위 <script>의 도트 문자열(art)에서 런타임에 생성됩니다.
 *    직접 만든 PNG로 바꾸고 싶다면 아래 CUSTOM_SPRITES 에 이미지 URL을 넣으세요.
 * ===================================================================== */
(() => {
'use strict';

/* ------------------------------ 상수 ------------------------------ */
const TS = 16, VW = 256, VH = 240, ROWS = 15;                    // 타일 크기 / 화면
let W = 216;                                                     // 맵 폭(타일) - 스테이지/지하 구간마다 달라짐
let FLAG_C = 192, POLE_X = FLAG_C * TS + 7, FLAG_TOP = 32, BASE_Y = 192;
let CASTLE_C = 197, CASTLE_X = CASTLE_C * TS, CASTLE_Y = 13 * TS - 80, DOOR_X = CASTLE_X + 40;
function setGeom(w, flagC, castleC) { W = w; FLAG_C = flagC; POLE_X = FLAG_C * TS + 7; CASTLE_C = castleC; CASTLE_X = CASTLE_C * TS; DOOR_X = CASTLE_X + 40; }
const T = {AIR:0, GROUND:1, BRICK:2, Q:3, USED:4, SOLID:5, PTL:6, PTR:7, PBL:8, PBR:9};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* 원하는 이미지로 교체하려면: {'hero_0_stand': 'https://.../my.png', 'goomba1': '...'} 형태로 입력 */
const CUSTOM_SPRITES = {};

/* ------------------------------ 스프라이트 생성 ------------------------------ */
const SP = {};

const PROG_KEY = 'superPixelBrosProgress';
function loadProg() {
  const out = {};

    const o = JSON.parse(localStorage.getItem(PROG_KEY) || '{}');
    if (Array.isArray(o.cleared)) o.cleared.filter(n => n > 0).forEach(n => { out[n] = 1; });   // 예전 저장분 = 별 1개
    if (o.stars && typeof o.stars === 'object') for (const k in o.stars) {
      const n = +k, v = Math.min(3, Math.max(0, (+o.stars[k]) | 0));
      if (n > 0 && v > 0) out[n] = Math.max(out[n] || 0, v);

}
const bestStars = loadProg();                                   // {스테이지번호: 별 개수(1~3)}

  map = s.map; contents = s.contents; items = s.items; enemies = s.enemies; warpPipe = s.warpPipe;
  setGeom(s.W, s.FLAG_C, s.CASTLE_C); underExit = null;
  hero.x = s.heroX; hero.y = s.heroY - 24; hero.vx = 0; hero.vy = 0; hero.onGround = false;
  G.camX = s.camX; G.mode = 'playing'; G.warpCooldown = 40; sfx('pipe');
  fireballs = []; particles = []; popups = []; bumps = []; coinPops = [];
  surfaceSave = null;
}
function updateUnderground() {
  updateHero(); if (G.mode !== 'underground') return;
  updateEnemies(); updateItems(); updateFireballs(); updateMisc(); cameraFollow();
  if (underExit && hero.onGround && hero.x + hero.w >= underExit.c * TS - 1) exitUnderground();
}

function updateHero() {
  const h = hero; h.prevBottom = h.y + h.h;
  const L = isDown('left'), R = isDown('right'), run = isDown('run'), jh = isDown('jump');
  const dirIn = (R ? 1 : 0) - (L ? 1 : 0), air = !h.onGround, maxV = run ? 2.5 : 1.5;
  if (h.invT > 0) h.invT--;
  if (h.starT > 0) h.starT--;

  /* 가속 / 감속 / 급정지(반대 방향 입력 시 더 빠르게 감속) */
  if (dirIn) {
    if (h.vx * dirIn < 0) h.vx += dirIn * (air ? 0.09 : 0.2);
    else if (Math.abs(h.vx) < maxV) h.vx = clamp(h.vx + dirIn * (air ? 0.06 : (run ? 0.09 : 0.075)), -maxV, maxV);
    else if (!air) h.vx -= Math.sign(h.vx) * 0.05;
    h.dir = dirIn;
  } else if (!air) h.vx = Math.abs(h.vx) <= 0.07 ? 0 : h.vx - Math.sign(h.vx) * 0.07;

  /* 점프: 점프 버퍼 + 코요테 타임 / 누르는 시간에 따라 높이 조절(가변 중력) */
  if (edge.jump) h.jumpBuf = 6;
  if (h.onGround) h.coyote = 5; else if (h.coyote > 0) h.coyote--;
  if (h.jumpBuf > 0 && h.coyote > 0) { h.vy = -(4.6 + Math.abs(h.vx) * 0.3); h.onGround = false; h.coyote = 0; h.jumpBuf = 0; sfx('jump'); }
  if (h.jumpBuf > 0) h.jumpBuf--;
  h.vy = Math.min(h.vy + ((h.vy < 0 && jh) ? 0.19 : 0.52), 6);

  /* 불꽃 발사 */
  if ((edge.run || edge.fire) && h.power === 2 && fireballs.length < 2) {
    fireballs.push({x: h.dir > 0 ? h.x + h.w : h.x - 8, y: h.y + 10, w: 8, h: 8, vx: h.dir * 3.4, vy: 1, dir: h.dir}); sfx('fire');
  }

  const r = moveEntity(h);
  h.onGround = r.landed;
  if (r.hitX) h.vx = 0;
  if (r.landed) { h.vy = 0; h.combo = 0; }
  if (r.bonk) { h.vy = 0.6; if (r.bc >= 0) hitBlock(r.bc, r.br); }
  if (h.x < G.camX) { h.x = G.camX; if (h.vx < 0) h.vx = 0; }
  if (h.onGround) h.walkT += Math.abs(h.vx) * 0.14;
  if (h.y > ROWS * TS + 8) killHero(true);
}

function reviveKoopa(e) { e.state = 'walk'; e.y -= 8; e.h = 22; e.t = 0; e.dir = hero.x < e.x ? -1 : 1; }
const alive = e => e.active && !e.removed && e.state !== 'dead' && e.state !== 'squish';
const COMBO = [100, 200, 400, 500, 800, 1000, 2000, 4000, 5000, 8000];

function updateEnemies() {
  const h = hero;
  for (const e of enemies) {
    if (e.removed) continue;
    if (!e.active) { if (e.x < G.camX + VW + 16) e.active = true; else continue; }
    if (e.x + e.w < G.camX - 48 || e.y > ROWS * TS + 64) { e.removed = true; continue; }
    if (e.state === 'dead') { e.vy = Math.min(e.vy + 0.35, 6); e.y += e.vy; e.x += e.vx; continue; }
    if (e.state === 'squish') { if (--e.t <= 0) e.removed = true; continue; }
    if (e.type === 'goomba' || e.state === 'walk') e.vx = e.dir * 0.5;
    else if (e.state === 'shell') { e.vx = 0; if (++e.t > 320) reviveKoopa(e); }
    else if (e.state === 'shellMove') { e.vx = e.dir * 4; if (e.grace > 0) e.grace--; }
    e.vy = Math.min(e.vy + 0.4, 5);
    const r = moveEntity(e);
    e.onGround = r.landed; if (r.landed) e.vy = 0;
    if (r.hitX) { e.dir *= -1; if (e.state === 'shellMove') sfx('bump'); }
    if (e.type === 'koopa' && e.red && e.state === 'walk' && e.onGround) {     // 주황 거북은 낭떠러지에서 돌아선다
      const fx = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
      if (!solidAt(Math.floor(fx / TS), Math.floor((e.y + e.h + 2) / TS))) e.dir *= -1;
    }
  }
  /* 적끼리 충돌: 굴러가는 껍질은 다른 적을 쓰러뜨린다 */
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (!alive(a)) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (!alive(b) || !ov(a, b)) continue;
      const am = a.state === 'shellMove', bm = b.state === 'shellMove';
      if (am && !bm) killEnemy(b, a.dir, 500); else if (bm && !am) killEnemy(a, b.dir, 500);
      else if (am && bm) { killEnemy(a, -1, 500); killEnemy(b, 1, 500); }
      else if (a.state !== 'shell' && b.state !== 'shell') { if (a.x < b.x) { a.dir = -1; b.dir = 1; } else { a.dir = 1; b.dir = -1; } }
      else { const w = a.state === 'shell' ? b : a, s = a.state === 'shell' ? a : b; w.dir = w.x < s.x ? -1 : 1; }
    }
  }
  /* 주인공과 충돌 */
  for (const e of enemies) {
    if (G.mode !== 'playing' && G.mode !== 'underground') break;
    if (!alive(e) || !ov(h, e)) continue;
    if (h.starT > 0) { killEnemy(e, h.x < e.x ? 1 : -1, 200); continue; }
    const stomp = h.vy > 0 && h.prevBottom <= e.y + 8;
    const bounce = () => { h.vy = isDown('jump') ? -5.0 : -3.2; h.y = Math.min(h.y, e.y - h.h); };
    const stompScore = () => { const s = COMBO[Math.min(h.combo++, 9)]; addScore(s, e.x, e.y - 8); };
    if (e.type === 'goomba') {
      if (stomp) { e.state = 'squish'; e.t = 30; e.vx = 0; bounce(); stompScore(); sfx('stomp'); } else hurtHero();
    } else if (e.state === 'walk') {
      if (stomp) { e.state = 'shell'; e.t = 0; e.y += 8; e.h = 14; e.vx = 0; bounce(); stompScore(); sfx('stomp'); } else hurtHero();
    } else if (e.state === 'shell') {
      e.state = 'shellMove'; e.dir = (h.x + h.w / 2 < e.x + e.w / 2) ? 1 : -1; e.grace = 12; e.t = 0;
      if (stomp) bounce(); addScore(400, e.x, e.y - 8); sfx('kick');
    } else if (e.state === 'shellMove' && e.grace <= 0) {
      if (stomp) { e.state = 'shell'; e.t = 0; e.vx = 0; bounce(); stompScore(); sfx('stomp'); } else hurtHero();
    }
  }
}

function updateItems() {
  const h = hero;
  for (const it of items) {
    if (it.removed) continue;
    if (it.type === 'coin') { if (ov(h, it)) { it.removed = true; getCoin(); } continue; }
    if (it.emerge > 0) { it.y -= 1; it.emerge--; if (it.emerge === 0 && (it.type === 'mushroom' || it.type === 'life')) it.vx = 0.9; continue; }
    if (it.type === 'mushroom' || it.type === 'life') {
      it.vx = it.dir * 0.9; it.vy = Math.min(it.vy + 0.35, 5);
      const r = moveEntity(it); if (r.hitX) it.dir *= -1; if (r.landed) it.vy = 0;
      if (it.y > ROWS * TS + 32) it.removed = true;
    } else if (it.type === 'star') {
      it.vx = it.dir * 1.4; it.vy = Math.min(it.vy + 0.35, 6);
      const r = moveEntity(it); if (r.hitX) it.dir *= -1; if (r.landed) it.vy = -6.2;
      if (it.y > ROWS * TS + 32) it.removed = true;
    }
    if (ov(h, it)) {
      it.removed = true;
      if (it.type === 'life') { G.lives++; popups.push({x: it.x, y: it.y - 8, t: 0, text: '1UP'}); sfx('oneup'); }
      else if (it.type === 'star') { h.starT = 600; sfx('powerup'); }
      else growHero(it.type === 'flower' ? 'flower' : 'mush');
    }
  }
  items = items.filter(i => !i.removed);
}

function updateFireballs() {
  for (const f of fireballs) {
    f.vy = Math.min(f.vy + 0.3, 4); const r = moveEntity(f);
    if (r.landed) f.vy = -2.8;
    if (r.hitX || r.bonk) f.dead = true;
    if (f.x < G.camX - 16 || f.x > G.camX + VW + 16 || f.y > ROWS * TS + 16) f.dead = true;
    for (const e of enemies) if (!f.dead && alive(e) && ov(f, e)) { killEnemy(e, f.dir, 100); f.dead = true; }
    if (f.dead) fxs.push({x: f.x, y: f.y, t: 0});
  }
  fireballs = fireballs.filter(f => !f.dead);
}

function updateMisc() {
  if (G.score > G.high) { G.high = G.score; saveHigh(G.high); }
  G.bumpOff = {};
  for (const b of bumps) { b.t++; G.bumpOff[b.c + ',' + b.r] = -Math.round(Math.sin(b.t / 8 * Math.PI) * 6); }
  bumps = bumps.filter(b => b.t < 8);
  for (const c of coinPops) { c.t++; c.vy += 0.4; c.y += c.vy; if (c.vy > 0 && c.y >= c.y + 0 && c.t > 10 && c.vy > 4) { c.done = true; addScore(0); popups.push({x: c.x, y: c.y - 8, t: 0, text: '200'}); } }
  coinPops = coinPops.filter(c => !c.done);
  for (const p of particles) { p.t++; p.vy += 0.35; p.x += p.vx; p.y += p.vy; }
  particles = particles.filter(p => p.y < 260);
  for (const p of popups) { p.t++; p.y -= 0.6; } popups = popups.filter(p => p.t < 45);
  for (const f of fxs) f.t++; fxs = fxs.filter(f => f.t < 8);
}

function cameraFollow() { G.camX = clamp(Math.max(G.camX, hero.x - 112), 0, W * TS - VW); }

/* ---- 사망 ---- */
function updateDying() {
  const h = hero; G.deadT++; updateMisc();
  if (!h.fell) {
    if (G.deadT < 30) return;
    if (G.deadT === 30) h.vy = -5.2;
    h.vy = Math.min(h.vy + 0.28, 6); h.y += h.vy;
  } else h.y += 0;
  if (G.deadT > (h.fell ? 100 : 170)) {
    if (--G.lives <= 0) { G.mode = 'gameover'; G.t = 0; } else startIntermission();
  }
}

/* ---- 깃대 / 클리어 연출 ---- */
function startFlag() {
  const h = hero; G.mode = 'flag'; G.phase = 0; h.vx = 0; h.vy = 0; h.climbT = 0;
  const timeOk = G.time >= G.goal.time, coinOk = G.stageCoins >= G.goal.coins;
  G.result = {time: G.time, coins: G.stageCoins, timeOk, coinOk, stars: 1 + (timeOk ? 1 : 0) + (coinOk ? 1 : 0)};
  const feet = Math.min(h.y + h.h, BASE_Y);
  const pts = feet <= 64 ? 5000 : feet <= 96 ? 2000 : feet <= 128 ? 800 : feet <= 160 ? 400 : 100;
  addScore(pts, POLE_X + 8, feet - 16);
  h.x = POLE_X - h.w + 2; h.y = feet - h.h; h.dir = 1; h.invT = 0; sfx('flag');
}
function updateFlag() {
  const h = hero;
  if (G.phase === 0) {
    if (h.y + h.h < BASE_Y) { h.y = Math.min(h.y + 2, BASE_Y - h.h); h.climbT++; }
    if (G.flagY < 176) G.flagY = Math.min(G.flagY + 2, 176);
    if (h.y + h.h >= BASE_Y && G.flagY >= 176) { G.phase = 1; G.t = 0; }
  } else {
    G.t++;
    if (G.t === 12) { h.x = POLE_X + 2; h.dir = -1; }
    if (G.t >= 36) { h.dir = 1; h.onGround = false; G.mode = 'castle'; sfx('clear'); }
  }
}
function updateCastle() {
  const h = hero; h.vx = 1.3; h.dir = 1; h.vy = Math.min(h.vy + 0.52, 6);
  const r = moveEntity(h); h.onGround = r.landed; if (r.landed) h.vy = 0;
  if (h.onGround) h.walkT += 0.18;
  if (h.x >= DOOR_X - 6) { h.hidden = true; G.mode = 'clear'; markCleared(G.stage, G.result ? G.result.stars : 1); G.t = 0; G.castleT = 0; }
}
function updateClear() {
  G.t++; G.castleT++;
  if (G.t > 50) {
    if (G.time > 0) { const d = Math.min(G.time, 2); G.time -= d; G.score += d * 50; if (G.frame % 4 === 0) sfx('tick'); G.bonusT = 0; }
    else if (++G.bonusT > 70) { G.mode = 'win'; G.t = 0; }
  }
}

/* ------------------------------ 렌더링 ------------------------------ */
function txt(s, x, y, col = '#fcfcfc', size = 8, align = 'left') {
  ctx.font = size + 'px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function txtShadow(s, x, y, col, size, align) { txt(s, x + 1, y + 1, '#000', size, align); txt(s, x, y, col, size, align); }

function heroSprite() {
  const h = hero; let pw = h.power, pose;
  if (h.morph > 0) {
    const alt = Math.floor(h.morph / 4) % 2 === 0;
    pw = h.morphKind === 'fire' ? (alt ? 1 : 2) : (alt ? 0 : 1); pose = 'stand';
  } else if (G.mode === 'flag') pose = (h.climbT >> 2) % 2 ? 'climb2' : 'climb1';
  else if (h.dead) { pose = 'dead'; pw = 0; }
  else if (!h.onGround) pose = 'jump';
  else if (Math.abs(h.vx) > 0.1) pose = ['run1', 'run2', 'run3'][Math.floor(h.walkT) % 3];
  else pose = 'stand';
  return SP['hero_' + pw + '_' + pose] || SP['hero_0_' + pose] || SP.hero_0_stand;
}

function drawScenery(cx) {
  for (const s of scen.clouds) { const im = SP.cloud[s.s]; if (s.x - cx > VW || s.x - cx < -80) continue; spr(im, s.x - cx, s.y, false); }
  for (const s of scen.hills) { const im = s.s ? SP.hillSmall : SP.hillBig; if (s.x - cx > VW || s.x - cx < -90) continue; spr(im, s.x - cx, 13 * TS - im.height, false); }
  for (const s of scen.bushes) { const im = SP.bush[s.s]; if (s.x - cx > VW || s.x - cx < -70) continue; spr(im, s.x - cx, 13 * TS - im.height, false); }
}

function drawWorld() {
  const cx = Math.round(G.camX), under = G.mode === 'underground';
  ctx.fillStyle = under ? '#000000' : '#5c94fc'; ctx.fillRect(0, 0, VW, VH);
  if (!under) {
    drawScenery(cx);

    /* 성 / 깃대 */
    spr(SP.castle, CASTLE_X - cx, CASTLE_Y, false);
    if (G.mode === 'clear' || G.mode === 'win') {
      const fy = CASTLE_Y - 10 - Math.min(G.castleT / 3, 14);
      rect(ctx, '#00a800', DOOR_X - cx - 8, CASTLE_Y - 26, 1, 26);
      ctx.drawImage(SP.flag, Math.round(DOOR_X - cx - 8 + 1), Math.round(fy), 12, 12);
    }
    rect(ctx, '#00a800', POLE_X - cx, FLAG_TOP, 2, BASE_Y - FLAG_TOP); rect(ctx, '#80d010', POLE_X - cx, FLAG_TOP, 1, BASE_Y - FLAG_TOP);
    rect(ctx, '#000', POLE_X - cx - 3, FLAG_TOP - 9, 8, 8); rect(ctx, '#00a800', POLE_X - cx - 2, FLAG_TOP - 8, 6, 6); rect(ctx, '#80d010', POLE_X - cx - 1, FLAG_TOP - 7, 2, 2);
    spr(SP.flag, POLE_X - cx - 14, G.flagY, false);
  }

  /* 아이템(블록 뒤에서 솟아오르도록 타일보다 먼저) */
  for (const it of items) {
    if (it.type === 'coin') { const f = SP.coin[Math.floor(G.frame / 8) % 4]; spr(f, it.x - 3 - cx, it.y - 1, false); }
    else if (it.type === 'mushroom') spr(SP.mushroom, it.x - cx, it.y, false);
    else if (it.type === 'life') spr(SP.mushroomLife, it.x - cx, it.y, false);
    else if (it.type === 'star') spr(SP.star, it.x - cx, it.y, false);
    else spr(SP['flower' + (Math.floor(G.frame / 6) % 2 + 1)], it.x - cx, it.y, false);
  }
  for (const c of coinPops) spr(SP.coin[Math.floor(c.t / 3) % 4], c.x - cx, c.y, false);

  /* 적 */
  for (const e of enemies) {
    if (e.removed || !e.active) continue;
    let im, dy = 0, dx = 0;
    if (e.type === 'goomba') {
      if (e.state === 'squish') { im = SP.goombaSquish; dy = 3; } else im = SP['goomba' + (Math.floor(G.frame / 10) % 2 + 1)];
      spr(im, e.x + e.w / 2 - 8 - cx, e.y + e.h - 16 + dy, false, e.state === 'dead');
    } else {
      const rd = e.red ? 'R' : '';
      if (e.state === 'walk') im = SP['koopa' + rd + (Math.floor(G.frame / 12) % 2 + 1)];
      else { im = SP['shell' + rd]; if (e.state === 'shell' && e.t > 250) dx = (G.frame >> 1) % 2 ? 1 : -1; }
      spr(im, e.x + e.w / 2 - 8 - cx + dx, e.y + e.h - im.height + 1, e.dir > 0 && e.state === 'walk', e.state === 'dead');
    }
  }

  /* 타일 */
  const c0 = Math.floor(cx / TS), c1 = Math.min(W - 1, c0 + 17), q = [0, 0, 0, 1, 2, 1, 0][Math.floor(G.frame / 8) % 7];
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const t = map[r * W + c]; if (!t) continue;
    const x = c * TS - cx, y = r * TS + (G.bumpOff[c + ',' + r] || 0);
    if (t === T.GROUND) spr(SP.ground, x, y); else if (t === T.BRICK) spr(SP.brick, x, y);
    else if (t === T.Q) spr(SP['qBlock' + q], x, y); else if (t === T.USED) spr(SP.usedBlock, x, y);
    else if (t === T.SOLID) spr(SP.solid, x, y); else if (t === T.PTL) spr(SP.pipeTop, x, y); else if (t === T.PBL) spr(SP.pipeBody, x, y);
  }

  /* 주인공 */
  if (!hero.hidden && !(hero.invT > 0 && G.frame % 4 < 2 && (G.mode === 'playing' || G.mode === 'underground'))) {
    const im = heroSprite();
    if (hero.starT > 0) { ctx.save(); ctx.filter = 'hue-rotate(' + ((G.frame * 41) % 360) + 'deg) saturate(2.2)'; }
    spr(im, hero.x - 2 - cx, hero.y + hero.h - im.height, hero.dir < 0);
    if (hero.starT > 0) ctx.restore();
  }

  /* 불꽃 / 파편 / 이펙트 / 점수 */
  for (const f of fireballs) { const i = Math.floor(G.frame / 3) % 4; spr(SP.fireball, f.x - cx, f.y, !!(i & 1), !!(i & 2)); }
  for (const p of particles) spr(SP.brickPiece, p.x - cx, p.y, (p.t >> 2) % 2 === 0);
  for (const f of fxs) { const s = 2 + f.t; rect(ctx, '#fcfcfc', f.x - cx + 4 - s / 2, f.y + 4 - s / 2, s, s); rect(ctx, '#f85820', f.x - cx + 4 - s / 4, f.y + 4 - s / 4, s / 2, s / 2); }
  for (const p of popups) txt(p.text, p.x - cx, p.y, '#fcfcfc', 8);
}

function stageLabel() { return (Math.floor((G.stage - 1) / LAYOUTS.length) + 1) + '-' + (((G.stage - 1) % LAYOUTS.length) + 1); }
function goalState() {
  const r = G.result, g = G.goal;
  return {
    clear: r ? 'ok' : 'pending',
    speed: r ? (r.timeOk ? 'ok' : 'fail') : (G.time >= g.time ? 'pending' : 'fail'),
    coin: G.stageCoins >= g.coins ? 'ok' : (r ? 'fail' : 'pending'),
  };
}
function drawGoals() {
  const st = goalState(), g = G.goal;
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fillRect(4, 26, 90, 28);
  const rows = [['CLEAR', st.clear], ['TIME ' + g.time + '+', st.speed], ['COIN ' + Math.min(G.stageCoins, 99) + '/' + g.coins, st.coin]];
  rows.forEach(([label, state], i) => {
    const y = 28 + i * 8;
    starPath(11, y + 3, 3.6, 1.6);
    if (state === 'ok') { ctx.fillStyle = '#fcd800'; ctx.fill(); }
    ctx.lineWidth = 1; ctx.strokeStyle = state === 'ok' ? '#7c3c00' : state === 'fail' ? '#f85858' : '#fcfcfc'; ctx.stroke();
    txtShadow(label, 19, y, state === 'ok' ? '#fcd800' : state === 'fail' ? '#f85858' : '#fcfcfc', 6, 'left');
  });
}
function drawHUD() {
  if (G.mode !== 'title' && G.mode !== 'gameover') drawGoals();
  txt('HERO', 24, 8); txt(String(G.score).padStart(6, '0'), 24, 16);
  if (Math.floor(G.frame / 12) % 3 !== 2) rect(ctx, '#f8d820', 88, 16, 4, 8);
  txt('x' + String(G.coins).padStart(2, '0'), 96, 16);
  txt('WORLD', 144, 8); txt(stageLabel(), 152, 16);
  txt('TIME', 208, 8); txt(String(Math.max(0, G.time)).padStart(3, '0'), 216, 16);
}

function render() {
  if (G.mode === 'select') { drawSelect(); return; }
  if (G.mode === 'intermission' || G.mode === 'gameover') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
    if (G.mode === 'intermission') {
      drawHUD(); txt('WORLD ' + stageLabel(), 128, 88, '#fcfcfc', 8, 'center');
      txt('TOP ' + String(G.high).padStart(6, '0'), 128, 100, '#f8d820', 8, 'center');
      spr(SP.hero_0_stand, 96, 116); txt('x  ' + G.lives, 120, 122);
    } else { drawHUD(); txt('GAME OVER', 128, 112, '#fcfcfc', 8, 'center'); if (G.t > 60 && G.frame % 60 < 40) txt('PRESS ENTER', 128, 150, '#fc9838', 8, 'center'); }
    return;
  }
  drawWorld(); drawHUD();
  if (G.mode === 'title') {
    txtShadow('SUPER', 128, 44, '#fc9838', 24, 'center'); txtShadow('PIXEL BROS.', 128, 76, '#fcfcfc', 16, 'center');
    if (G.frame % 60 < 40) txtShadow('PRESS ENTER', 128, 108, '#fcfcfc', 8, 'center');
    txt('TOP SCORE ' + String(G.high).padStart(6, '0'), 128, 122, '#f8d820', 8, 'center');
    txt('LEFT/RIGHT MOVE   DOWN ENTER PIPE', 128, 140, '#fcfcfc', 6, 'center');
    txt('SPACE  JUMP (HOLD=HIGH)', 128, 150, '#fcfcfc', 8, 'center');
    txt('Z / SHIFT  RUN + FIRE', 128, 162, '#fcfcfc', 8, 'center'); txt('P  PAUSE     M  SOUND', 128, 174, '#fcfcfc', 8, 'center');
    txtShadow('T  STAGE SELECT', 128, 188, '#9fd0ff', 8, 'center'); if (maxCleared() > 0) txtShadow('CONTINUE ' + stageLabelOf(Math.min(maxCleared() + 1, unlockedMax())), 128, 200, '#fcd800', 8, 'center');
  }
  if (G.paused && G.mode === 'playing') txtShadow('PAUSE', 128, 112, '#fcfcfc', 8, 'center');
  if (G.mode === 'win') {
    const r = G.result || {stars: 1, time: 0, coins: 0};
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(16, 58, 224, 122);
    txtShadow('COURSE CLEAR!', 128, 66, '#fcfcfc', 16, 'center');
    for (let k = 0; k < 3; k++) {
      starPath(98 + k * 30, 98, 11, 4.8);
      if (k < r.stars) { ctx.fillStyle = '#fcd800'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#7c3c00'; ctx.stroke(); }
      else { ctx.lineWidth = 1.5; ctx.strokeStyle = '#6a7098'; ctx.stroke(); }
    }
    txt('TIME ' + r.time + '/' + G.goal.time + '  COIN ' + r.coins + '/' + G.goal.coins, 128, 116, '#9fd0ff', 6, 'center');
    txtShadow('SCORE ' + String(G.score).padStart(6, '0'), 128, 128, '#fc9838', 8, 'center');
    if (G.frame % 60 < 40) txtShadow('PRESS ENTER', 128, 148, '#fcfcfc', 8, 'center');
    txt('T  STAGE SELECT', 128, 162, '#9fd0ff', 6, 'center');
  }
}

/* ------------------------------ 메인 루프 ------------------------------ */
function fit() {
  const dev = document.documentElement.getAttribute('data-device');
  const reserve = dev === 'mobile' ? (innerHeight > innerWidth ? 130 : 0) : (dev === 'desktop' ? 26 : 0);
  const raw = Math.min(innerWidth / VW, (innerHeight - reserve) / VH);
  /* 터치 기기에서는 화면에 더 꽉 차게(0.25 단위), PC는 원래대로 정수 배율 */
  const s = (document.documentElement.getAttribute('data-device') === 'mobile' || (window.matchMedia && matchMedia('(pointer:coarse)').matches)) ? Math.max(1, Math.floor(raw * 4) / 4) : Math.max(1, Math.floor(raw));
  canvas.style.width = VW * s + 'px'; canvas.style.height = VH * s + 'px';
}
addEventListener('resize', fit); fit(); canvas.focus();

resetLevel();
let last = 0, acc = 0, started = false; const STEP = 1000 / 60;
function loop(t) {
  if (!last) last = t; acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  render(); requestAnimationFrame(loop);
}
const begin = () => { if (started) return; started = true; requestAnimationFrame(loop); };
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]).then(begin, begin);
else begin();

window.__dbg = {step: n => { for (let i = 0; i < n; i++) { update(); } render(); }, resetLevel: () => { resetLevel(); render(); }, G, held, edge, get hero() { return hero; }, get enemies() { return enemies; }, get items() { return items; }, get fireballs() { return fireballs; }, get map() { return map; }, get W() { return W; }, get warpPipe() { return warpPipe; }, get underExit() { return underExit; }, TS};
})();
</script>
