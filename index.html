<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLASH ZONE · 게임 모음</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff9d2e'/%3E%3Ccircle cx='32' cy='24' r='9' fill='%23fff'/%3E%3Crect x='28' y='30' width='8' height='14' fill='%23fff'/%3E%3Crect x='14' y='42' width='36' height='10' rx='5' fill='%231a2260'/%3E%3C/svg%3E">
<style>
:root{--navy:#0a0d2a;--blue:#2b3a8f;--blue2:#1a2260;--orange:#ff9d2e;--yellow:#ffe45c;--green:#32d546;--text:#eaf0ff;--muted:#9fb0e6;--card:#141b4d;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:var(--text);background:#05061a;overflow-x:hidden;-webkit-user-select:none;-ms-user-select:none;user-select:none;}
#frame{-webkit-user-select:auto;user-select:auto;}
body.noscroll{overflow:hidden;}
[hidden]{display:none !important;}
button{font-family:inherit;cursor:pointer;}
/* ---------- 배경 ---------- */
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1100px 560px at 50% -12%,rgba(120,80,255,.55),transparent 62%),
  radial-gradient(700px 420px at 90% 105%,rgba(255,140,40,.18),transparent 60%),
  linear-gradient(180deg,#140b44 0%,#0a0d2a 55%,#05061a 100%);}
.bg::before{content:"";position:absolute;inset:0;opacity:.55;background:
  radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 30% 62%,#cfe0ff,transparent),
  radial-gradient(1.6px 1.6px at 55% 28%,#fff,transparent),radial-gradient(1.2px 1.2px at 74% 74%,#ffe9b0,transparent),
  radial-gradient(1.4px 1.4px at 88% 22%,#fff,transparent),radial-gradient(1px 1px at 42% 88%,#fff,transparent);
  background-size:340px 300px;animation:drift 90s linear infinite;}
@keyframes drift{to{background-position:-340px 300px;}}
/* ---------- 버튼 ---------- */
.gbtn{border:2px solid #0d5a1a;border-radius:12px;padding:10px 22px;font-weight:900;font-size:16px;letter-spacing:.04em;color:#fff;
  background:linear-gradient(#8cff86 0%,#2fcf42 48%,#1aa22c 52%,#38d94b 100%);text-shadow:0 1px 0 #0d5a1a,0 0 6px rgba(0,0,0,.35);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 4px 0 #0d5a1a,0 8px 16px rgba(0,0,0,.45);transition:transform .08s,filter .15s;}
.gbtn:hover{filter:brightness(1.08);}
.gbtn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 1px 0 #0d5a1a,0 3px 8px rgba(0,0,0,.4);}
.gbtn.blue{border-color:#10236b;background:linear-gradient(#8fb4ff 0%,#3a6bff 48%,#2150e0 52%,#4d7bff 100%);text-shadow:0 1px 0 #10236b;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #10236b,0 8px 16px rgba(0,0,0,.45);}
.gbtn.orange{border-color:#7a3a05;background:linear-gradient(#ffd27a 0%,#ff9d2e 48%,#e87a08 52%,#ffb347 100%);text-shadow:0 1px 0 #7a3a05;box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 4px 0 #7a3a05,0 8px 16px rgba(0,0,0,.45);}
.gbtn.sm{padding:6px 14px;font-size:13px;border-radius:9px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #10236b,0 5px 10px rgba(0,0,0,.4);}
/* ---------- 로고 ---------- */
.logo{display:flex;align-items:center;gap:12px;user-select:none;}
.logo svg{width:46px;height:46px;flex-shrink:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45));}
.logo b{font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1;background:linear-gradient(#fff6b0,#ffb52e 60%,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #3a1a02;paint-order:stroke fill;filter:drop-shadow(0 3px 0 #3a1a02);}
.logo small{display:block;margin-top:5px;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);-webkit-text-stroke:0;filter:none;}
/* ---------- 입장 화면 ---------- */
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--top)) 18px calc(24px + var(--bot));position:relative;overflow:hidden;}
.rays{position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;z-index:0;opacity:.35;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,90,.55) 0 7deg,transparent 7deg 20deg);animation:spin 70s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);}
@keyframes spin{to{transform:rotate(360deg);}}
.gcard{position:relative;z-index:1;width:100%;max-width:400px;border-radius:22px;padding:26px 24px 24px;text-align:center;
  background:linear-gradient(180deg,rgba(43,58,143,.96),rgba(18,24,76,.97));border:3px solid #7c8cff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 0 4px rgba(10,13,42,.8),0 20px 60px rgba(0,0,0,.65),0 0 60px rgba(120,90,255,.35);}
.gcard .logo{justify-content:center;margin-bottom:6px;}
.gcard p{margin:12px 0 18px;color:var(--muted);font-size:14px;}
#pw{width:100%;padding:13px 16px;font-size:20px;text-align:center;letter-spacing:.3em;border-radius:12px;border:3px solid #0a0d2a;outline:none;color:#fff;
  background:linear-gradient(#0a0e30,#171f5c);box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 0 0 2px #5668e8;}
#pw:focus{box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 0 0 3px var(--yellow),0 0 18px rgba(255,228,92,.55);}
#gateMsg{min-height:22px;margin:10px 0 12px;font-weight:800;font-size:14px;color:#ff7b7b;}
.shake{animation:shake .4s;}
@keyframes shake{20%{transform:translateX(-10px);}40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(4px);}}
#gate .gbtn{width:100%;font-size:18px;padding:12px 22px;}
/* ---------- 포털 ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + var(--top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(#34459f,#1a2260);border-bottom:4px solid var(--orange);box-shadow:0 6px 20px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.25);}
.ticker{display:flex;align-items:center;gap:10px;background:#07092a;border-bottom:2px solid #232c78;overflow:hidden;white-space:nowrap;font-size:13px;color:#d6e0ff;}
.ticker .tag{flex-shrink:0;margin:6px 0 6px 12px;padding:2px 10px;border-radius:99px;font-weight:900;font-size:11px;letter-spacing:.1em;color:#3a1a02;background:linear-gradient(#fff6b0,#ffb52e);}
.ticker .run{display:inline-block;padding-left:100%;animation:run 26s linear infinite;}
@keyframes run{to{transform:translateX(-100%);}}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px calc(40px + var(--bot));}
.sectionHead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.sectionHead h2{margin:0;font-size:22px;font-weight:900;letter-spacing:.03em;text-shadow:0 2px 0 #000a;}
.sectionHead h2 span{color:var(--yellow);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tab{border:2px solid #10236b;border-radius:99px;padding:6px 16px;font-weight:800;font-size:13px;color:#cfe0ff;
  background:linear-gradient(#3e4fb0,#222c78);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #0a1450;}
.tab.on{color:#3a1a02;border-color:#7a3a05;background:linear-gradient(#ffe08a,#ff9d2e);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 3px 0 #7a3a05;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;}
.card{position:relative;border-radius:18px;overflow:hidden;text-align:left;padding:0;border:3px solid #6b7bff;color:var(--text);
  background:linear-gradient(180deg,#1c2566,#0f1547);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 10px 26px rgba(0,0,0,.55);
  transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-5px) scale(1.015);border-color:var(--yellow);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 16px 34px rgba(0,0,0,.6),0 0 28px rgba(255,228,92,.4);}
.thumb{position:relative;aspect-ratio:16/10;background:#000;overflow:hidden;border-bottom:3px solid #0a0d2a;}
.thumb svg{width:100%;height:100%;display:block;transition:transform .35s;}
.card:hover .thumb svg{transform:scale(1.08);}
.thumb .over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,26,.55);opacity:0;transition:opacity .18s;}
.card:hover .thumb .over{opacity:1;}
.ribbon{position:absolute;top:14px;left:-34px;width:130px;text-align:center;transform:rotate(-38deg);padding:3px 0;font-size:12px;font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 1px 0 #0006;box-shadow:0 3px 8px rgba(0,0,0,.5);}
.ribbon.hot{background:linear-gradient(#ff7a7a,#e02828);}
.ribbon.new{background:linear-gradient(#7dff7a,#1fb532);}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.cbody h3{margin:0;font-size:19px;font-weight:900;line-height:1.25;text-shadow:0 2px 0 #000a;}
.cbody h3 small{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--yellow);}
.cbody p{margin:0;font-size:13px;line-height:1.55;color:var(--muted);flex:1;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;color:#cfe0ff;background:#232c78;border:1px solid #4a5ad0;}
.cbody .gbtn{margin-top:4px;width:100%;}
.card.soon{border-style:dashed;border-color:#4a5ad0;background:rgba(20,27,77,.45);box-shadow:none;cursor:default;align-items:center;justify-content:center;min-height:300px;text-align:center;}
.card.soon:hover{transform:none;border-color:#4a5ad0;box-shadow:none;}
.card.soon b{display:block;font-size:64px;line-height:1;color:#4a5ad0;text-shadow:0 3px 0 #0a0d2a;}
.card.soon span{display:block;margin-top:10px;font-weight:800;color:var(--muted);}
.foot{margin-top:34px;text-align:center;font-size:12px;color:#6f7fc8;}
/* ---------- 플레이어 ---------- */
#player{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000;}
.pbar{display:flex;align-items:center;gap:10px;padding:calc(7px + var(--top)) 12px 7px;background:linear-gradient(#34459f,#1a2260);border-bottom:3px solid var(--orange);box-shadow:0 4px 14px rgba(0,0,0,.6);}
.ptitle{flex:1;min-width:0;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #000a;}
.pbtns{display:flex;gap:8px;}
.pstage{position:relative;flex:1;min-height:0;background:#000;}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0f19;}
#preload{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;
  background:radial-gradient(circle at 50% 40%,#1b1f5e,#05061a 70%);transition:opacity .35s;}
#preload.done{opacity:0;pointer-events:none;}
#preload h3{margin:0;font-size:24px;font-weight:900;text-shadow:0 3px 0 #000;}
.bar{width:min(420px,78vw);height:26px;border-radius:99px;padding:3px;background:#0a0d2a;border:3px solid #6b7bff;box-shadow:inset 0 3px 6px rgba(0,0,0,.7),0 0 20px rgba(107,123,255,.35);}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .15s linear;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px),linear-gradient(#ffd27a,#ff9d2e 55%,#e87a08);background-size:28px 28px,100% 100%;animation:stripe .6s linear infinite;}
@keyframes stripe{to{background-position:28px 0,0 0;}}
#pct{font-weight:900;letter-spacing:.08em;color:var(--yellow);}
#tip{font-size:13px;color:var(--muted);max-width:360px;min-height:20px;}
@media (max-width:560px){.logo b{font-size:24px;}.logo svg{width:38px;height:38px;}.grid{grid-template-columns:1fr;}.top .gbtn.sm{padding:6px 10px;}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

/* ---------- 기기 선택 ---------- */
#device{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--top)) 18px calc(24px + var(--bot));position:relative;overflow:hidden;}
.dcard{max-width:520px;}
.dcard h2{margin:14px 0 4px;font-size:21px;font-weight:900;text-shadow:0 2px 0 #000a;}
.dcard p{margin:0 0 4px;}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.dopt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px 16px;border-radius:18px;color:var(--text);border:3px solid #6b7bff;
  background:linear-gradient(180deg,#1c2566,#0f1547);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 8px 20px rgba(0,0,0,.5);transition:transform .12s,border-color .15s,box-shadow .15s;}
.dopt:hover{transform:translateY(-4px);border-color:var(--yellow);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 14px 28px rgba(0,0,0,.55),0 0 24px rgba(255,228,92,.4);}
.dopt:active{transform:translateY(1px) scale(.98);}
.dopt svg{width:64px;height:64px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45));}
.dopt b{font-size:20px;font-weight:900;text-shadow:0 2px 0 #000a;}
.dopt span{word-break:keep-all;font-size:12px;font-weight:700;color:var(--muted);line-height:1.4;}
.dopt .rec{position:absolute;top:-11px;right:10px;padding:2px 10px;border-radius:99px;font-style:normal;font-weight:900;font-size:11px;letter-spacing:.08em;color:#3a1a02;background:linear-gradient(#fff6b0,#ffb52e);box-shadow:0 2px 6px rgba(0,0,0,.45);}
.dnote{margin-top:14px;font-size:12px;color:#6f7fc8;}
.topbtns{display:flex;gap:8px;align-items:center;}
/* ---------- 기기별 화면 ---------- */
html[data-device=mobile] .wrap{max-width:480px;padding:16px 12px calc(32px + var(--bot));}
html[data-device=mobile] .grid{grid-template-columns:1fr;gap:16px;}
html[data-device=mobile] .card:hover{transform:none;border-color:#6b7bff;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 10px 26px rgba(0,0,0,.55);}
html[data-device=mobile] .card:hover .thumb svg{transform:none;}
html[data-device=mobile] .thumb .over{display:none;}
html[data-device=mobile] .sectionHead h2{font-size:19px;}
html[data-device=mobile] .gbtn{min-height:44px;}
html[data-device=mobile] .gbtn.sm{min-height:36px;}
html[data-device=mobile] .tab{padding:8px 16px;}
html[data-device=mobile] .pstage{background:#05061a;}
html[data-device=mobile] #frame{left:50%;right:auto;width:min(100%,480px);transform:translateX(-50%);}
html[data-device=mobile] #tip{display:block;}
html[data-device=desktop] .wrap{max-width:1280px;padding:28px 28px 48px;}
html[data-device=desktop] .grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px;}
html[data-device=desktop] .card,html[data-device=desktop] .tab,html[data-device=desktop] .gbtn{cursor:pointer;}
@media (max-width:360px){.dopts{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="bg"></div>

<!-- 입장 화면 -->
<section id="gate" hidden>
  <div class="rays"></div>
  <div class="gcard" id="gcard">
    <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff8a1e"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="15" fill="url(#lg1)" stroke="#3a1a02" stroke-width="3"/><circle cx="32" cy="22" r="9" fill="#e02828" stroke="#3a1a02" stroke-width="3"/><circle cx="29" cy="19" r="2.6" fill="#fff" opacity=".8"/><rect x="29" y="29" width="6" height="14" fill="#3a1a02"/><rect x="11" y="41" width="42" height="13" rx="6.5" fill="#1a2260" stroke="#3a1a02" stroke-width="3"/><circle cx="21" cy="47.5" r="3.4" fill="#7dff7a"/><circle cx="32" cy="47.5" r="3.4" fill="#ffe45c"/><circle cx="43" cy="47.5" r="3.4" fill="#ff7a7a"/></svg><div><b>FLASH ZONE</b><small>GAME ARCADE</small></div></div>
    <p>비밀번호를 입력하고 입장하세요</p>
    <input id="pw" type="password" autocomplete="off" placeholder="PASSWORD" maxlength="64">
    <div id="gateMsg"></div>
    <button class="gbtn orange" id="enter" type="button">ENTER &#9654;</button>
  </div>
</section>

<!-- 기기 선택 -->
<section id="device" hidden>
  <div class="rays"></div>
  <div class="gcard dcard">
    <div class="logo" id="dlogo"></div>
    <h2>어떤 기기로 플레이하나요?</h2>
    <p>선택한 기기에 맞춰 게임 화면이 바뀌어요</p>
    <div class="dopts">
      <button class="dopt" data-m="mobile" type="button"><i class="rec" hidden>추천</i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="4" width="28" height="56" rx="7" fill="#1a2260" stroke="#ffe45c" stroke-width="3"/><rect x="22" y="11" width="20" height="38" rx="2" fill="#5c94fc"/><circle cx="32" cy="54.5" r="2.6" fill="#ffe45c"/><rect x="28" y="7" width="8" height="2" rx="1" fill="#ffe45c"/></svg><b>모바일</b><span>터치 · 세로 화면<br>화면 속 버튼 조작</span></button>
      <button class="dopt" data-m="desktop" type="button"><i class="rec" hidden>추천</i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="9" width="56" height="35" rx="5" fill="#1a2260" stroke="#ffe45c" stroke-width="3"/><rect x="9" y="14" width="46" height="25" rx="2" fill="#5c94fc"/><rect x="28" y="44" width="8" height="8" fill="#ffe45c"/><rect x="18" y="52" width="28" height="5" rx="2.5" fill="#ffe45c"/></svg><b>컴퓨터</b><span>키보드 · 넓은 화면<br>방향키 · 스페이스</span></button>
    </div>
    <div class="dnote">나중에 위쪽 '기기 변경' 버튼으로 바꿀 수 있어요</div>
  </div>
</section>

<!-- 게임 모음 -->
<section id="portal" hidden>
  <header class="top">
    <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff8a1e"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="15" fill="url(#lg1)" stroke="#3a1a02" stroke-width="3"/><circle cx="32" cy="22" r="9" fill="#e02828" stroke="#3a1a02" stroke-width="3"/><circle cx="29" cy="19" r="2.6" fill="#fff" opacity=".8"/><rect x="29" y="29" width="6" height="14" fill="#3a1a02"/><rect x="11" y="41" width="42" height="13" rx="6.5" fill="#1a2260" stroke="#3a1a02" stroke-width="3"/><circle cx="21" cy="47.5" r="3.4" fill="#7dff7a"/><circle cx="32" cy="47.5" r="3.4" fill="#ffe45c"/><circle cx="43" cy="47.5" r="3.4" fill="#ff7a7a"/></svg><div><b>FLASH ZONE</b><small>GAME ARCADE</small></div></div>
    <div class="topbtns"><button class="gbtn blue sm" id="devSwitch" type="button">기기 변경</button><button class="gbtn blue sm" id="lock" type="button">LOCK</button></div>
  </header>
  <div class="ticker"><span class="tag">NEW</span><span class="run" id="run"></span></div>
  <main class="wrap">
    <div class="sectionHead">
      <h2><span>&#9733;</span> 게임 모음</h2>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">FLASH ZONE &middot; 게임은 계속 추가돼요</div>
  </main>
</section>

<!-- 플레이어 -->
<section id="player" hidden>
  <div class="pbar">
    <button class="gbtn blue sm" id="pBack" type="button">&#9664; 목록</button>

      +'<div class="over"><span class="gbtn orange">PLAY &#9654;</span></div></div>'
      +'<div class="cbody"><h3>'+g.title+(g.sub?'<small>'+g.sub+'</small>':'')+'</h3>'
      +'<div class="chips">'+g.tags.map(function(t){return '<span class="chip">'+t+'</span>';}).join("")+'</div>'
      +'<p>'+g.desc+'</p><button class="gbtn" type="button">PLAY &#9654;</button></div></article>';
  });
  if(curCat==="all") h+='<article class="card soon"><div><b>?</b><span>다음 게임을 준비하는 중이에요</span></div></article>';
  $("grid").innerHTML=h;
  [].forEach.call($("grid").querySelectorAll(".card[data-id]"),function(c){
    var go=function(){ openGame(c.getAttribute("data-id"),true); };
    c.addEventListener("click",go);
    c.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
}
function enterPortal(){
  $("gate").hidden=true; $("device").hidden=true; $("portal").hidden=false;
  $("run").textContent="새 게임이 추가됐어요!  \u2605  NEON KNUCKLE 격투 대전 (온라인 지원)  \u2605  SUPER PIXEL BROS.  \u2605  전설의 검 키우기 : 100강의 지배자  \u2605  뒷산에서 보석 캐기 업데이트  \u2605  게임은 계속 추가돼요";
  renderTabs(); renderGrid();
  setTimeout(function(){ GAMES.forEach(function(g){ try{ var l=document.createElement("link"); l.rel="prefetch"; l.href=g.src; document.head.appendChild(l); }catch(e){} }); },800);
  var id=(location.hash||"").replace("#","");
  if(id&&GAMES.some(function(g){return g.id===id;})) openGame(id,false);
}
$("lock").addEventListener("click",function(){ ss("passed_auth",null); ss("device_mode",null); applyDev(""); closeGame(true); $("device").hidden=true; showGate(); });

/* ============ 플레이어 ============ */
var playing=null,progTimer=null,pct=0,tipTimer=null,loadId=0,curFinish=null;
function setPct(p){ pct=p; $("barFill").style.width=p+"%"; $("pct").textContent=Math.floor(p)+"%"; }
/* iframe은 열 때마다 새로 만들고, 닫을 때 통째로 제거함
   → 브라우저 기록에 iframe 이동이 안 쌓이고, 로딩 중인 게임이 '목록' 버튼을 붙잡지 못함 */
function swapFrame(url){
  var old=$("frame"), f=document.createElement("iframe");
  f.id="frame"; f.title="game"; f.setAttribute("allow","fullscreen; autoplay");
  if(url) f.src=url;
  old.onload=null; old.parentNode.replaceChild(f,old);
  return f;
}
function frameState(f){
  try{ var d=f.contentDocument; if(!d) return ""; var h=d.location.href; if(!h||h==="about:blank") return ""; return d.readyState||"complete"; }
  catch(e){ return "?"; }
}
var ignorePop=false;
function openGame(id,push){
  var g=GAMES.filter(function(x){return x.id===id;})[0]; if(!g) return;
  clearInterval(progTimer); clearInterval(tipTimer);
  playing=g;
  if(push) history.pushState({g:id},"","#"+id);
  document.body.classList.add("noscroll");
  $("pTitle").textContent=g.title+(g.sub?" : "+g.sub:"");
  $("pl").textContent=g.title;
  $("preload").classList.remove("done"); setPct(0);
  var ti=0; $("tip").textContent=TIPS[0]; tipTimer=setInterval(function(){ ti=(ti+1)%TIPS.length; $("tip").textContent=TIPS[ti]; },2600);
  $("player").hidden=false;
  var my=++loadId, done=false, ticks=0;
  function finish(){
    if(done||my!==loadId) return; done=true; clearInterval(progTimer); setPct(100);
    setTimeout(function(){ if(my!==loadId) return; $("preload").classList.add("done"); clearInterval(tipTimer); },250);
  }
  curFinish=finish;
  var f=swapFrame(g.src);
  f.onload=function(){ if(my===loadId&&playing){ finish(); try{ f.contentWindow.focus(); }catch(e){} } };
  progTimer=setInterval(function(){
    if(done||my!==loadId){ clearInterval(progTimer); return; }
    ticks++;
    var st=frameState(f);
    /* 다 로드됐거나, 화면 구조(DOM)만 잡혀도 바로 통과. 외부 서버가 느려도 최대 약 6초 뒤엔 무조건 통과 */
    if(st==="complete"||st==="?"||(st==="interactive"&&ticks>3)||ticks>65){ finish(); return; }
    setPct(Math.min(92,pct+(92-pct)*.08+.6));
  },90);
}
function closeGame(skipHistory){
  if(!playing&&$("player").hidden) return;
  playing=null; loadId++; curFinish=null; clearInterval(progTimer); clearInterval(tipTimer);
  /* 화면부터 즉시 닫고, 게임은 그 다음에 제거 */
  $("player").hidden=true; document.body.classList.remove("noscroll");
  try{ var d=document; if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); } }catch(e){}
  swapFrame("");
  if(!skipHistory&&location.hash) history.replaceState(null,"",location.pathname+location.search);
}
/* 목록 버튼: 누르는 즉시 닫고, 우리가 쌓은 기록 한 칸만 조용히 되돌림 */
$("pBack").addEventListener("click",function(){
  var had=history.state&&history.state.g;
  closeGame(true);
  if(had){ ignorePop=true; setTimeout(function(){ ignorePop=false; },800); history.back(); }
  else if(location.hash) history.replaceState(null,"",location.pathname+location.search);
});
window.addEventListener("popstate",function(e){
  if(ignorePop){ ignorePop=false; closeGame(true); return; }
  if(e.state&&e.state.g&&authed()) openGame(e.state.g,false); else closeGame(true);
});
/* 게임 쪽(2차 비밀번호 화면 등)이 "준비됨" 신호를 보내면 로딩 화면을 바로 걷음 */
window.addEventListener("message",function(e){
  if(e.origin!==location.origin||e.data!=="gm-ready") return;
  try{ if(playing&&e.source===$("frame").contentWindow&&curFinish) curFinish(); }catch(x){}
});
$("pReload").addEventListener("click",function(){
  if(!playing) return; openGame(playing.id,false);
});
var fsEl=document.documentElement;
var canFS=!!(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen);
if(!canFS) $("pFull").hidden=true;
$("pFull").addEventListener("click",function(){
  var el=$("player"), d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
  else (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
});

/* ============ 시작 ============ */
if(authed()){ var _m=getDev(); if(_m){ applyDev(_m); enterPortal(); } else showDevice(); } else showGate();
})();
</script>
</body>
</html>
